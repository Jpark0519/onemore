<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OneMore">
<meta name="theme-color" content="#0E0F12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>OneMore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 토큰 (src/theme/tokens.ts와 동일) ===== */
:root, [data-theme="dark"] {
  --bg:#0E0F12; --surface:#17191E; --surfaceRaised:#20232A; --border:#2C3038;
  --textPrimary:#F3F4F6; --textSecondary:#A4AAB4; --textMuted:#868C97;
  --primary:#FF6B2C; --onPrimary:#14161A; --primaryText:#FF6B2C; --primarySoft:#3A1E12;
  --success:#2BD47D; --successSoft:#11291D; --warning:#FFC23D; --danger:#FF4D5E;
  --overlay:rgba(0,0,0,.6); --page:#050506;
  --muscleBase:#2E323B; --muscleSkin:#3A3F49; --musclePrimary:#FF3B3B; --muscleSecondary:#7A2A2E; --figure:#C9CDD4;
}
[data-theme="light"] {
  --bg:#F6F6F7; --surface:#FFFFFF; --surfaceRaised:#EFF0F2; --border:#E1E3E7;
  --textPrimary:#111318; --textSecondary:#4F5560; --textMuted:#6B717C;
  --primary:#FF6B2C; --onPrimary:#14161A; --primaryText:#C2410C; --primarySoft:#FFE6DA;
  --success:#12A55C; --successSoft:#DDF4E7; --warning:#B97F00; --danger:#D92D3F;
  --overlay:rgba(17,19,24,.4); --page:#D9DBDF;
  --muscleBase:#D5D8DE; --muscleSkin:#C3C7CF; --musclePrimary:#E0242B; --muscleSecondary:#F2A7A9; --figure:#3B414C;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--page); font-family:Pretendard, "Noto Sans KR", system-ui, sans-serif; color:var(--textPrimary);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px 16px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; }

/* ===== 프로토타입 컨트롤 (폰 바깥) ===== */
.controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.controls button { height:36px; padding:0 14px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13px; font-weight:600; }
.hint { font-size:12px; color:var(--textMuted); text-align:center; max-width:390px; line-height:1.5; }

/* ===== 폰 프레임 ===== */
.phone { width:390px; height:844px; background:var(--bg); border-radius:44px; overflow:hidden; position:relative;
  box-shadow:0 0 0 10px #1b1c20, 0 30px 80px rgba(0,0,0,.45); display:flex; flex-direction:column; }
@media (max-width:440px) { body { padding:0; gap:0; justify-content:flex-start; } .controls,.hint { display:none; }
  .phone { width:100vw; height:100dvh; border-radius:0; box-shadow:none; } }
.statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 28px; font-size:15px; font-weight:700; }
.screen { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.scroll { flex:1; overflow-y:auto; padding:0 16px 24px; scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }

/* ===== 공통 ===== */
.btn { height:48px; border-radius:10px; font-weight:700; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 16px; transition:opacity .12s; }
.btn:active { opacity:.85; }
.btn:disabled { opacity:.4; cursor:default; }
.btn-lg { height:56px; width:100%; }
.btn-sm { height:36px; font-size:14px; padding:0 14px; }
.btn-primary { background:var(--primary); color:var(--onPrimary); }
.btn-secondary { background:var(--surfaceRaised); color:var(--textPrimary); }
.btn-ghost { color:var(--primaryText); }
.btn-danger { color:var(--danger); }
.card { background:var(--surface); border-radius:14px; padding:16px; }
.micro { font-size:11px; line-height:14px; font-weight:600; letter-spacing:.4px; color:var(--textMuted); }
.caption { font-size:13px; line-height:18px; color:var(--textMuted); font-weight:500; }
.title1 { font-size:24px; line-height:30px; font-weight:700; }
.title2 { font-size:18px; line-height:24px; font-weight:700; }
.icon { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.icon-sm { width:18px; height:18px; }
.badge { display:inline-flex; align-items:center; height:20px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:700; background:var(--surfaceRaised); color:var(--textSecondary); }
.badge.mine { background:var(--primarySoft); color:var(--primaryText); }

/* ===== 홈 ===== */
.home-head { display:flex; align-items:center; justify-content:space-between; padding:8px 0 20px; }
.logo { font-size:22px; font-weight:800; letter-spacing:-.3px; }
.logo b { color:var(--primaryText); }
.resume { display:flex; align-items:center; justify-content:space-between; background:var(--primary); color:var(--onPrimary); border-radius:14px; padding:14px 16px; margin-bottom:12px; width:100%; text-align:left; }
.resume strong { font-size:16px; display:block; }
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
.stat-val { font-size:28px; line-height:34px; font-weight:800; margin-top:4px; }
.stat-val small { font-size:14px; font-weight:600; color:var(--textMuted); margin-left:2px; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; }
.routine { margin-bottom:12px; }
.routine-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.routine-ex { margin-top:6px; }

/* ===== 탭 바 ===== */
.tabbar { flex:none; height:84px; border-top:1px solid var(--border); background:var(--bg); display:grid; grid-template-columns:repeat(5,1fr); padding-bottom:24px; }
.tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600; color:var(--textMuted); }
.tab.on { color:var(--textPrimary); }
.tab.on .icon { color:var(--primaryText); }

/* ===== 진행 중 운동 ===== */
.wk-head { flex:none; display:flex; align-items:center; gap:8px; padding:4px 12px 12px; border-bottom:1px solid var(--border); }
.icon-btn { width:48px; height:48px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--textSecondary); }
.wk-title { flex:1; min-width:0; }
.wk-title .title2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-card { background:var(--surface); border-radius:14px; padding:12px 0 8px; margin-top:12px; }
.ex-head { display:flex; align-items:center; justify-content:space-between; padding:0 4px 0 16px; }
.ex-meta { padding:0 16px; margin-top:2px; }
/* 동작 + 효과 부위 */
.ex-media { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 12px 0; }
.ex-media > div { background:var(--bg); border-radius:10px; height:128px; position:relative; display:flex; align-items:center; justify-content:center; }
.ex-media .tag { position:absolute; left:8px; top:6px; font-size:10px; font-weight:700; color:var(--textMuted); letter-spacing:.3px; }
.motion svg { width:100%; height:100%; }
.motion .limb { stroke:var(--figure); stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.motion { padding-top:12px; }
.motion .back { opacity:.38; }
.motion .head { fill:var(--figure); }
.motion .prop { fill:var(--textMuted); stroke:none; }
.motion .prop-line { stroke:var(--textMuted); stroke-width:1.6; fill:none; }
.motion .ground { stroke:var(--border); stroke-width:2; }
.motion .bench { fill:var(--surfaceRaised); }
.muscles { padding-top:14px; }
.muscles svg { height:104px; width:auto; }
.muscles .m { fill:var(--muscleBase); transition:fill .2s; }
.muscles .sk { fill:var(--muscleSkin); }
.muscles .m.p { fill:var(--musclePrimary); }
.muscles .m.s { fill:var(--muscleSecondary); }
.muscles .legend { position:absolute; right:8px; top:6px; display:flex; gap:6px; font-size:10px; font-weight:700; color:var(--textMuted); }
.muscles .legend i { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:3px; vertical-align:0; }
.target-line { padding:6px 16px 0; font-size:12px; color:var(--textSecondary); font-weight:600; }
.target-line b { color:var(--musclePrimary); font-weight:700; }
/* 종목 통계 */
.ex-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 12px 0; }
.ex-stat { background:var(--surfaceRaised); border-radius:10px; padding:8px 10px; min-width:0; }
.ex-stat .v { font-size:16px; line-height:20px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-stat .v small { font-size:11px; font-weight:600; color:var(--textMuted); margin-left:1px; }
.ex-stat .d { font-size:10px; font-weight:700; color:var(--success); height:12px; }
.detail-media .ex-media { margin:12px 0 0; }
.detail-media .ex-media > div { height:150px; }
.detail-media .muscles svg { height:124px; }
.detail-media .ex-stats { margin:8px 0 0; }
.cols, .set-row { display:grid; grid-template-columns:40px 1fr 72px 64px 48px; gap:8px; align-items:center; padding:0 12px; }
.cols { margin-top:10px; height:20px; }
.cols span:nth-child(n+3) { text-align:center; }
.span2 { grid-column:span 2; }
.set-row { height:56px; transition:background .2s; }
.set-row.done { background:var(--successSoft); }
.set-no { height:40px; border-radius:8px; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; color:var(--textSecondary); }
.set-no.w { color:var(--warning); }
.prev { font-size:14px; color:var(--textMuted); text-align:left; height:40px; display:flex; align-items:center; white-space:nowrap; overflow:hidden; }
.cell { height:44px; border-radius:10px; background:var(--surfaceRaised); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center;
  color:var(--textSecondary); border:2px solid transparent; font-variant-numeric:tabular-nums; }
.cell.edited, .set-row.done .cell { color:var(--textPrimary); }
.set-row.done .cell { background:transparent; }
.cell.editing { background:var(--primarySoft); border-color:var(--primary); color:var(--textPrimary); }
.cell.empty { color:var(--textMuted); font-weight:500; }
.check { width:48px; height:48px; border-radius:10px; background:var(--surfaceRaised); display:flex; align-items:center; justify-content:center; color:var(--textMuted); transition:transform .12s; }
.check.on { background:var(--success); color:var(--onPrimary); animation:pop .12s; }
@keyframes pop { 50% { transform:scale(1.15); } }
.pr { font-size:10px; font-weight:800; color:var(--onPrimary); background:var(--primary); border-radius:4px; padding:1px 4px; margin-left:4px; }
.add-set { width:100%; height:44px; color:var(--textSecondary); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px; }
.add-ex { margin-top:16px; }

/* ===== 종목별 페이지 (좌우 스와이프) ===== */
.pnav { flex:none; display:flex; align-items:center; gap:4px; padding:4px 8px; border-bottom:1px solid var(--border); }
.pnav .label { flex:1; text-align:center; }
.dots { display:flex; justify-content:center; gap:6px; margin-top:6px; }
.dot { width:6px; height:6px; border-radius:3px; background:var(--border); padding:0; transition:width .2s, background .2s; }
.dot.done { background:var(--success); }
.dot.on { width:18px; background:var(--primary); }
.pager { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
.pager::-webkit-scrollbar { display:none; }
.pager.dragging { scroll-snap-type:none; cursor:grabbing; user-select:none; }
.page { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; padding:0 16px 24px; scrollbar-width:none; }
.page::-webkit-scrollbar { display:none; }
.all-done { margin-top:12px; background:var(--successSoft); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
.rest.idle .rest-time { color:var(--textSecondary); }
.rest button:disabled { opacity:.35; }

/* ===== 휴식 타이머 ===== */
.rest { flex:none; height:64px; background:var(--surfaceRaised); position:relative; display:flex; align-items:center; padding:0 8px 0 16px; gap:4px; }
.rest-bar { position:absolute; top:0; left:0; height:3px; background:var(--primary); transition:width .25s linear; }
.rest.low .rest-bar { background:var(--warning); }
.rest.low .rest-time { color:var(--warning); }
.rest-time { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; min-width:92px; }
.rest-label { flex:1; }
.rest button { height:48px; min-width:48px; padding:0 8px; font-weight:700; font-size:14px; color:var(--textSecondary); border-radius:10px; }
.rest .skip { color:var(--primaryText); }

/* ===== 숫자 패드 ===== */
.pad { flex:none; background:var(--surface); border-top:1px solid var(--border); padding:10px 8px 28px; animation:up .26s ease-out; }
@keyframes up { from { transform:translateY(100%); } }
.pad-display { display:flex; justify-content:space-between; align-items:baseline; padding:2px 8px 10px; }
.pad-display .v { font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
.pad-grid { display:grid; grid-template-columns:repeat(3,1fr) 1.15fr; gap:6px; }
.key { height:56px; border-radius:10px; background:var(--surfaceRaised); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center; }
.key:active { opacity:.7; }
.key.fn { font-size:17px; font-weight:700; }
.key.next { background:var(--primary); color:var(--onPrimary); font-size:17px; font-weight:700; }
.key:disabled { opacity:.3; }

/* ===== 시트 공통 ===== */
.sheet-bg { position:absolute; inset:0; background:var(--overlay); z-index:20; display:flex; align-items:flex-end; }
.sheet-bg.z2 { z-index:25; }
.sheet-bg.z3 { z-index:30; }
.sheet { background:var(--bg); width:100%; height:92%; border-radius:20px 20px 0 0; display:flex; flex-direction:column; animation:up .26s ease-out; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; padding:8px 8px 8px 16px; flex:none; }
.sheet-foot { padding:12px 16px 32px; border-top:1px solid var(--border); flex:none; display:flex; gap:8px; }
.sheet-foot .btn { flex:1; }
.sheet.short { height:auto; max-height:92%; }

/* ===== 루틴 ===== */
.rt-body { padding:0 16px 20px; overflow-y:auto; }
.rt-list { margin-top:12px; background:var(--surface); border-radius:12px; padding:4px 14px; }
.rt-line { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:15px; }
.rt-line:last-child { border-bottom:0; }
.rt-open { flex:1; min-width:0; text-align:left; }
.re-ex { margin-top:12px; padding:12px 12px 8px 16px; }
.re-head { display:flex; align-items:center; gap:0; }
.re-head .t { flex:1; min-width:0; }
.re-head .icon-btn:disabled { opacity:.25; }
.re-set { display:grid; align-items:center; gap:8px; margin-top:8px; }
.re-set .input { height:44px; text-align:center; padding:0 4px; }
.re-cols { margin-top:12px; }

/* ===== 기록 (달력) ===== */
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin:0 -8px 8px; }
.cal-nav .icon-btn:disabled { opacity:.25; }
.cal { touch-action:pan-y; user-select:none; overflow:hidden; }
.cal-week, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-week span { text-align:center; font-size:12px; font-weight:600; color:var(--textMuted); padding:6px 0; }
.cal-week span:first-child { color:var(--danger); }
.cal-day { height:48px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:15px; font-weight:600; color:var(--textPrimary); }
.cal-day.sun { color:var(--danger); }
.cal-day i { width:6px; height:6px; border-radius:50%; background:transparent; }
.cal-day.has { background:var(--primarySoft); }
.cal-day.has i { background:var(--primary); }
.cal-day.today span { color:var(--primaryText); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
.cal-day.sel { background:var(--primary); color:var(--onPrimary); }
.cal-day.sel span { color:var(--onPrimary) !important; }
.cal-day.sel i { background:var(--onPrimary); }
.cal-day.sel:not(.has) { background:var(--surfaceRaised); color:var(--textPrimary); }
.cal-day.sel:not(.has) span { color:var(--textPrimary) !important; }
.cal-day:disabled { opacity:.3; }
.slide-l { animation:slideL .22s ease-out; }
.slide-r { animation:slideR .22s ease-out; }
@keyframes slideL { from { transform:translateX(40px); opacity:0; } }
@keyframes slideR { from { transform:translateX(-40px); opacity:0; } }
.hist-w { margin-bottom:12px; display:block; width:100%; text-align:left; color:inherit; }
.hist-w:active { background:var(--surfaceRaised); }
.hist-top .caption { display:flex; align-items:center; gap:2px; white-space:nowrap; }
.lg-parts { display:grid; grid-template-columns:130px 1fr; gap:14px; align-items:center; margin-bottom:12px; padding:12px; }
.lg-map .muscles { background:var(--bg); border-radius:10px; height:120px; position:relative; display:flex; align-items:center; justify-content:center; }
.lg-map .tag { display:none; }
.lg-badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.lg-ex { margin-bottom:12px; padding:12px 8px 12px 16px; }
.lg-ex-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.lg-set { display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:8px; padding:7px 8px 7px 0; border-top:1px solid var(--border); font-size:15px; }
.lg-set .no { color:var(--textMuted); font-weight:700; font-size:13px; text-align:center; }
.lg-set.warm .no { color:var(--warning); }
.lg-set.warm .v { color:var(--textSecondary); }
.lg-cols { border-top:0; padding-bottom:2px; }
.lg-foot { display:flex; gap:16px; padding:8px 8px 0 0; border-top:1px solid var(--border); }
.lg-foot b { color:var(--textPrimary); }
.routine-top .btn { flex:none; white-space:nowrap; }

/* ===== 통계 ===== */
.seg { display:flex; background:var(--surfaceRaised); border-radius:12px; padding:3px; }
.seg button { flex:1; height:38px; border-radius:9px; font-weight:700; font-size:15px; color:var(--textSecondary); }
.seg button.on { background:var(--surface); color:var(--textPrimary); box-shadow:0 1px 3px rgba(0,0,0,.25); }
.st-tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
.st-tiles .card { padding:14px; }
.st-tiles .stat-val { font-size:24px; line-height:30px; margin-top:2px; }
.st-d { display:block; font-size:12px; font-weight:700; color:var(--textMuted); margin-top:2px; }
.st-d.up { color:var(--success); }
.st-d.down { color:var(--textMuted); }
.st-card { margin-top:12px; }
.st-h { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
.st-h .caption { font-size:12px; text-align:right; }
.chart { width:100%; height:auto; display:block; overflow:visible; }
.chart .gl { stroke:var(--border); stroke-width:1; }
.chart .ax { fill:var(--textMuted); font-size:10px; font-weight:600; }
.chart .ax.cur { fill:var(--textPrimary); font-weight:800; }
.chart .hit { fill:transparent; cursor:pointer; }
.chart .bar .b { fill:var(--primarySoft); }
.chart .bar.cur .b { fill:var(--primary); }
.chart .tip { fill:var(--textPrimary); font-size:11px; font-weight:800; display:none; paint-order:stroke; stroke:var(--surface); stroke-width:3px; }
.chart .bar.cur .tip, .chart .bar.on .tip, .chart .pt.on .tip, .chart .pt.lab .tip { display:block; }
.chart .ln, .spark .ln { fill:none; stroke:var(--primary); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.chart .pt circle { fill:var(--primary); stroke:var(--surface); stroke-width:2; }
.chart .pt.on circle { r:6; }
.chart:has(.pt.on) .pt.lab:not(.on) .tip { display:none; }
.st-parts { display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:center; }
.pb { display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:8px; padding:5px 0; font-size:14px; }
.pb-l { font-weight:700; }
.pb-t { height:8px; border-radius:4px; background:var(--surfaceRaised); overflow:hidden; }
.pb-t i { display:block; height:100%; background:var(--primary); border-radius:4px; }
.pb-v { font-weight:800; font-size:14px; white-space:nowrap; }
.pb-v small, .pb-v em { font-size:11px; color:var(--textMuted); font-weight:600; font-style:normal; }
