  ex("dumbbell_decline_press","디클라인 덤벨프레스","가슴","가슴","덤벨","weight_reps",["디클라인 덤벨 프레스","Decline Dumbbell Press"],"디클라인 벤치에 누워 발을 고정하고 덤벨을 가슴 옆에 잡습니다.\n덤벨을 아랫가슴 위로 밀어 팔을 펴줍니다.\n팔꿈치를 살짝 벌리며 가슴 옆까지 천천히 내립니다.\n가슴을 조이며 다시 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 머리 쪽으로 피가 쏠리므로 어지러우면 즉시 중단하세요.","chest",["triceps"],"bench","dumbbell"),
  ex("dumbbell_fly","덤벨 플라이","가슴","가슴","덤벨","weight_reps",["플라이","덤플","Dumbbell Fly"],"평평한 벤치에 누워 덤벨을 가슴 위에서 마주 보게 들고 팔꿈치를 살짝 굽힙니다.\n팔꿈치 각도를 유지한 채 양팔을 큰 원을 그리듯 옆으로 벌립니다.\n가슴이 충분히 늘어나는 지점까지 내립니다.\n가슴을 모으는 느낌으로 덤벨을 시작 위치로 끌어올립니다.\n안전 팁: 어깨가 아프지 않은 범위까지만 내리고 가벼운 무게로 시작하세요.","chest",["shoulders"],"fly","dumbbell"),
  ex("dumbbell_incline_fly","인클라인 덤벨 플라이","가슴","가슴","덤벨","weight_reps",["인클라인 플라이","Incline Dumbbell Fly"],"벤치를 30도 정도로 세우고 덤벨을 가슴 위에서 마주 보게 듭니다.\n팔꿈치를 살짝 굽힌 상태로 고정합니다.\n양팔을 옆으로 벌리며 윗가슴이 늘어나도록 내립니다.\n가슴을 모으듯 덤벨을 원래 위치로 들어 올립니다.\n안전 팁: 팔꿈치를 펴거나 과도하게 굽히면 어깨와 팔꿈치에 무리가 가니 각도를 유지하세요.","chest",["shoulders"],"fly","dumbbell"),
  ex("dumbbell_pullover","풀오버","가슴","가슴","덤벨","weight_reps",["덤벨 풀오버","Dumbbell Pullover"],"벤치에 어깨를 대고 눕거나 가로로 누워 덤벨 한 개를 두 손으로 가슴 위에서 잡습니다.\n팔꿈치를 살짝 굽힌 채 덤벨을 머리 뒤쪽으로 천천히 넘깁니다.\n가슴과 옆구리가 늘어나는 지점에서 멈춥니다.\n같은 궤적으로 덤벨을 가슴 위로 당겨 올립니다.\n안전 팁: 허리가 과하게 꺾이지 않도록 복부에 힘을 주고 덤벨을 단단히 잡으세요.","chest",["back","triceps"],"fly","dumbbell"),
  ex("smith_bench_press","스미스 벤치프레스","가슴","가슴","스미스","weight_reps",["스미스 벤치","Smith Machine Bench Press"],"벤치를 스미스 머신 바 아래 가슴 위치에 맞추고 눕습니다.\n어깨너비보다 약간 넓게 바를 잡고 회전시켜 랙에서 빼냅니다.\n바를 아랫가슴 쪽으로 수직으로 내립니다.\n가슴에 닿기 직전 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 세이프티 스토퍼를 가슴 높이보다 약간 아래로 설정하세요.","chest",["triceps","shoulders"],"bench","smith"),
  ex("smith_incline_press","스미스 인클라인 프레스","가슴","가슴","스미스","weight_reps",["스미스 인클라인","Smith Incline Press"],"벤치를 30~45도로 세우고 바가 윗가슴 위에 오도록 위치를 맞춥니다.\n어깨너비보다 약간 넓게 바를 잡고 랙에서 풀어줍니다.\n바를 윗가슴 쪽으로 천천히 내립니다.\n팔을 펴며 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 바 궤적이 고정되므로 벤치 위치가 어긋나지 않았는지 먼저 확인하세요.","chest",["shoulders","triceps"],"bench","smith"),
  ex("machine_chest_press","체스트 프레스","가슴","가슴","머신","weight_reps",["체프","머신 체스트 프레스","Chest Press"],"의자 높이를 조절해 손잡이가 가슴 중간 높이에 오도록 맞춥니다.\n등을 패드에 붙이고 견갑을 모은 상태로 손잡이를 잡습니다.\n손잡이를 앞으로 밀어 팔이 거의 펴질 때까지 나아갑니다.\n가슴이 늘어나는 느낌으로 천천히 시작 위치로 돌아옵니다.\n안전 팁: 팔꿈치를 끝까지 잠그지 말고 어깨가 앞으로 말리지 않게 하세요.","chest",["triceps","shoulders"],"bench","machine"),
  ex("machine_incline_chest_press","인클라인 체스트 프레스","가슴","가슴","머신","weight_reps",["머신 인클라인 프레스","Incline Chest Press"],"시트 높이를 맞춰 손잡이가 윗가슴 높이에 오도록 합니다.\n등과 머리를 패드에 붙이고 손잡이를 잡습니다.\n위쪽 앞방향으로 손잡이를 밀어 팔을 폅니다.\n천천히 가슴이 늘어나는 위치까지 돌아옵니다.\n안전 팁: 시트를 너무 낮추면 어깨에 부담이 되니 손잡이가 가슴 상단 높이가 되게 하세요.","chest",["shoulders","triceps"],"bench","machine"),
  ex("machine_decline_chest_press","디클라인 체스트 프레스","가슴","가슴","머신","weight_reps",["머신 디클라인 프레스","Decline Chest Press"],"시트와 발판을 조절해 손잡이가 아랫가슴 높이에 오도록 앉습니다.\n등을 패드에 붙이고 손잡이를 단단히 잡습니다.\n아래 앞방향으로 손잡이를 밀어 팔을 폅니다.\n가슴을 느끼며 천천히 시작 위치로 돌아옵니다.\n안전 팁: 반동을 쓰지 말고 일정한 속도로 움직이세요.","chest",["triceps"],"bench","machine"),
  ex("machine_pec_deck_fly","펙덱 플라이","가슴","가슴","머신","weight_reps",["펙덱","버터플라이","체스트 플라이","Pec Deck Fly"],"시트 높이를 조절해 팔꿈치와 어깨가 비슷한 높이가 되게 앉습니다.\n등을 패드에 붙이고 팔을 패드나 손잡이에 올립니다.\n가슴을 모으며 양팔을 몸 앞으로 천천히 모읍니다.\n가슴을 잠시 수축한 후 천천히 벌려 시작 자세로 돌아옵니다.\n안전 팁: 너무 뒤로 벌리면 어깨 앞쪽에 무리가 가니 가슴 높이 정도까지만 벌리세요.","chest",["shoulders"],"fly","machine"),
  ex("cable_crossover","케이블 크로스오버","가슴","가슴","케이블","weight_reps",["크로스오버","Cable Crossover"],"양쪽 케이블 풀리를 높게 설정하고 가운데에 서서 손잡이를 잡습니다.\n상체를 약간 앞으로 숙이고 팔꿈치를 살짝 굽힙니다.\n양팔을 아래 앞쪽으로 원을 그리며 모아 가슴 앞에서 만납니다.\n천천히 팔을 벌려 가슴이 늘어나는 위치로 돌아옵니다.\n안전 팁: 한 발을 앞에 두고 몸통을 고정해 반동 없이 움직이세요.","chest",["shoulders"],"fly","cable"),
  ex("cable_high_crossover","하이 케이블 크로스오버","가슴","가슴","케이블","weight_reps",["하이 크로스오버","하이투로우","High Cable Crossover"],"케이블 풀리를 가장 높은 위치에 두고 손잡이를 잡은 채 한 발 앞으로 내딛고 섭니다.\n상체를 살짝 숙이고 팔꿈치를 가볍게 굽힙니다.\n양손을 아래 앞쪽 허벅지 앞까지 끌어내리며 모읍니다.\n가슴을 수축한 후 천천히 시작 위치로 돌아갑니다.\n안전 팁: 어깨를 으쓱하지 말고 손이 어깨보다 뒤로 과하게 가지 않게 하세요.","chest",["shoulders"],"fly","cable"),
  ex("cable_low_crossover","로우 케이블 크로스오버","가슴","가슴","케이블","weight_reps",["로우 크로스오버","로우투하이","Low Cable Crossover"],"케이블 풀리를 가장 낮게 두고 양손에 손잡이를 잡은 채 한 발 앞으로 섭니다.\n상체를 약간 숙이고 팔꿈치를 가볍게 굽힙니다.\n양손을 아래에서 위로 가슴 높이까지 끌어 올려 모읍니다.\n윗가슴을 수축한 후 천천히 시작 위치로 내려옵니다.\n안전 팁: 허리를 젖히지 말고 복부에 힘을 주어 상체를 고정하세요.","chest",["shoulders"],"fly","cable"),
  ex("cable_fly","케이블 플라이","가슴","가슴","케이블","weight_reps",["케이블플라이","Cable Fly"],"케이블 풀리를 가슴 높이에 맞추고 양손에 손잡이를 잡고 가운데에 섭니다.\n한 발을 앞에 두고 팔꿈치를 살짝 굽혀 팔을 옆으로 벌립니다.\n가슴을 조이며 양손을 가슴 앞에서 모읍니다.\n천천히 팔을 벌려 가슴이 늘어나는 위치로 돌아옵니다.\n안전 팁: 팔꿈치 각도를 일정하게 유지해 어깨 부담을 줄이세요.","chest",["shoulders"],"fly","cable"),
  ex("cable_chest_press","케이블 프레스","가슴","가슴","케이블","weight_reps",["케이블 체스트 프레스","Cable Chest Press"],"케이블 풀리를 가슴 높이에 놓고 손잡이를 잡은 채 등을 돌려 한 발 앞으로 섭니다.\n손잡이를 가슴 옆에 두고 팔꿈치를 몸통에서 45도 정도 벌립니다.\n손잡이를 앞으로 밀어 팔을 거의 폅니다.\n천천히 가슴 옆까지 돌아옵니다.\n안전 팁: 상체가 케이블에 끌려가지 않도록 복부와 하체에 힘을 주세요.","chest",["triceps","shoulders"],"bench","cable"),
  ex("bodyweight_push_up","푸쉬업","가슴","가슴","맨몸","reps",["푸시업","팔굽혀펴기","Push-up"],"양손을 어깨보다 약간 넓게 바닥에 짚고 머리부터 발끝까지 일직선을 만듭니다.\n복부와 엉덩이에 힘을 주어 몸통을 고정합니다.\n팔꿈치를 몸통에서 45도 정도 벌리며 가슴이 바닥 가까이 갈 때까지 내려갑니다.\n바닥을 밀어 팔을 펴며 시작 자세로 돌아옵니다.\n안전 팁: 허리가 처지지 않게 하고 힘들면 무릎을 대고 하세요.","chest",["triceps","shoulders"],"push_up","bodyweight"),
  ex("bodyweight_wide_push_up","와이드 푸쉬업","가슴","가슴","맨몸","reps",["와이드 푸시업","Wide Push-up"],"양손을 어깨너비보다 넓게 바닥에 짚고 몸을 일직선으로 만듭니다.\n복부에 힘을 주고 시선은 바닥을 향합니다.\n가슴이 바닥에 가까워질 때까지 팔꿈치를 굽혀 내려갑니다.\n바닥을 밀어 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 손 간격을 너무 넓히면 어깨에 무리가 가니 어깨너비의 1.5배 정도로 하세요.","chest",["shoulders"],"push_up","bodyweight"),
  ex("bodyweight_decline_push_up","디클라인 푸쉬업","가슴","가슴","맨몸","reps",["디클라인 푸시업","Decline Push-up"],"발을 벤치나 박스 위에 올리고 양손을 어깨너비로 바닥에 짚습니다.\n머리부터 발끝까지 곧게 유지하고 복부에 힘을 줍니다.\n가슴이 바닥에 가까워질 때까지 팔꿈치를 굽혀 내려갑니다.\n바닥을 밀어 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 허리가 꺾이지 않게 하고 높이는 단계적으로 올리세요.","chest",["shoulders","triceps"],"push_up","bodyweight"),
  ex("bodyweight_incline_push_up","인클라인 푸쉬업","가슴","가슴","맨몸","reps",["인클라인 푸시업","Incline Push-up"],"벤치나 안정적인 박스에 양손을 어깨너비로 짚고 몸을 일직선으로 만듭니다.\n발은 뒤로 뻗어 바닥에 두고 복부에 힘을 줍니다.\n가슴을 벤치 모서리에 가까이 가져가며 팔꿈치를 굽힙니다.\n밀어서 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 벤치가 미끄러지지 않도록 고정된 것을 사용하세요.","chest",["triceps"],"push_up","bodyweight"),
  ex("bodyweight_diamond_push_up","다이아몬드 푸쉬업","팔","삼두","맨몸","reps",["다이아몬드 푸시업","Diamond Push-up"],"양손을 가슴 아래에서 엄지와 검지로 다이아몬드 모양을 만들어 바닥에 짚습니다.\n몸을 머리부터 발끝까지 일직선으로 유지합니다.\n팔꿈치를 몸에 붙이듯 굽히며 가슴이 손 가까이 갈 때까지 내려갑니다.\n팔을 펴며 시작 자세로 돌아옵니다.\n안전 팁: 손목이나 팔꿈치가 아프면 손 간격을 넓히거나 무릎을 대세요.","triceps",["chest"],"push_up","bodyweight"),
  ex("bodyweight_dips","딥스","가슴","가슴","맨몸","reps",["평행봉","딥스바","체스트 딥스","Dips"],"평행봉을 잡고 팔을 펴서 몸을 들어 올립니다. 가슴은 약간 앞으로 숙입니다.\n다리는 모으거나 뒤로 교차해 몸을 안정시킵니다.\n팔꿈치를 굽히며 어깨가 팔꿈치와 비슷한 높이까지 내려갑니다.\n가슴과 팔로 밀어 팔을 펴며 올라옵니다.\n안전 팁: 어깨가 앞으로 쏠리지 않도록 너무 깊이 내려가지 마세요.","chest",["triceps","shoulders"],"dip","bodyweight"),
  ex("rings_push_up","링 푸쉬업","가슴","가슴","기타","reps",["링 푸시업","링","체조링","Ring Push-up"],"링을 가슴 아래 높이로 낮게 설정하고 손잡이를 잡아 몸을 일직선으로 만듭니다.\n복부와 엉덩이에 힘을 주고 링이 흔들리지 않게 고정합니다.\n팔꿈치를 굽히며 가슴이 링 사이로 내려가도록 합니다.\n링을 밀며 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 처음에는 링을 낮게 두고 어깨 안정성을 기른 뒤 난이도를 높이세요.","chest",["triceps","shoulders"],"push_up","other"),
  ex("barbell_deadlift","컨벤셔널 데드리프트","등","등","바벨","weight_reps",["데드리프트","데드","컨벤","DL","deadlift","Conventional Deadlift"],"바 아래에 발을 엉덩이너비로 두고 어깨너비로 바를 잡습니다.\n가슴을 펴고 등을 곧게 유지한 채 엉덩이와 무릎으로 바닥을 밀어냅니다.\n바를 정강이와 허벅지에 붙여 끌어올려 완전히 서서 엉덩이를 폅니다.\n엉덩이를 뒤로 빼며 바를 같은 경로로 바닥에 내려놓습니다.\n안전 팁: 허리가 둥글게 말리지 않도록 복압을 유지하세요.","back",["hamstrings","glutes","lower_back"],"hinge","barbell"),
  ex("barbell_romanian_deadlift","루마니안 데드리프트","하체","햄스트링","바벨","weight_reps",["RDL","루데","Romanian Deadlift"],"바를 어깨너비로 잡고 서서 무릎을 살짝 굽힌 채 고정합니다.\n엉덩이를 뒤로 밀며 바를 허벅지를 따라 내립니다.\n햄스트링이 늘어나는 느낌이 들면 정강이 중간 근처에서 멈춥니다.\n엉덩이를 앞으로 밀며 바를 끌어올려 시작 자세로 돌아옵니다.\n안전 팁: 등을 곧게 유지하고 바가 몸에서 멀어지지 않게 하세요.","hamstrings",["glutes","lower_back"],"hinge","barbell"),
  ex("barbell_sumo_deadlift","스모 데드리프트","등","등","바벨","weight_reps",["스모 데드","스모","Sumo Deadlift"],"발을 어깨너비보다 넓게 벌려 발끝을 바깥으로 향하게 하고 바 앞에 섭니다.\n무릎 안쪽에서 바를 잡고 가슴을 펴며 등을 곧게 유지합니다.\n바닥을 밀어내며 바를 몸에 붙여 끌어올려 엉덩이를 완전히 폅니다.\n엉덩이를 뒤로 빼며 바를 천천히 내려놓습니다.\n안전 팁: 무릎이 안으로 모이지 않도록 발끝 방향으로 밀어주세요.","back",["glutes","quads","hamstrings"],"hinge","barbell"),
  ex("barbell_stiff_leg_deadlift","스티프 레그 데드리프트","하체","햄스트링","바벨","weight_reps",["SLDL","스티프","Stiff-leg Deadlift"],"바를 어깨너비로 잡고 무릎을 거의 편 상태로 섭니다.\n등을 곧게 유지하며 엉덩이를 뒤로 보내 상체를 숙입니다.\n바가 정강이 중간 정도에 오면 햄스트링이 늘어나는 것을 느끼고 멈춥니다.\n엉덩이를 앞으로 밀며 일어나 시작 자세로 돌아옵니다.\n안전 팁: 무릎을 완전히 잠그지 말고 허리가 말리지 않는 범위까지만 내리세요.","hamstrings",["glutes","lower_back"],"hinge","barbell"),
  ex("barbell_row","바벨 로우","등","등","바벨","weight_reps",["벤트오버 로우","바로우","Barbell Row"],"바를 어깨너비보다 약간 넓게 잡고 무릎을 살짝 굽혀 상체를 45도 정도 숙입니다.\n등을 곧게 유지하고 복부에 힘을 줍니다.\n팔꿈치를 뒤로 당기며 바를 배꼽 쪽으로 끌어올립니다.\n등 근육을 조인 후 천천히 바를 내려 시작 자세로 돌아갑니다.\n안전 팁: 상체가 흔들리지 않게 고정하고 허리가 둥글어지면 무게를 줄이세요.","back",["biceps"],"row_bent","barbell"),
  ex("barbell_pendlay_row","펜들레이 로우","등","등","바벨","weight_reps",["펜들레이","Pendlay Row"],"상체를 바닥과 거의 평행하게 숙이고 어깨너비보다 넓게 바를 바닥에서 잡습니다.\n등을 곧게 펴고 복부에 힘을 줍니다.\n바를 폭발적으로 가슴 아래까지 끌어올립니다.\n바를 천천히 바닥에 내려놓아 매 반복마다 정지합니다.\n안전 팁: 허리 각도를 유지하고 반동으로 상체를 일으키지 마세요.","back",["biceps"],"row_bent","barbell"),
  ex("barbell_underhand_row","언더그립 바벨 로우","등","등","바벨","weight_reps",["리버스 그립 로우","언더 로우","Underhand Barbell Row"],"손바닥이 위를 향하게 어깨너비로 바를 잡고 상체를 45도 정도 숙입니다.\n등을 곧게 펴고 무릎을 살짝 굽힙니다.\n팔꿈치를 몸통에 붙이며 바를 아랫배 쪽으로 끌어올립니다.\n등을 조인 후 천천히 바를 내려 시작 자세로 돌아갑니다.\n안전 팁: 손목과 이두 부담이 크니 무게를 점진적으로 올리세요.","back",["biceps"],"row_bent","barbell"),
  ex("barbell_t_bar_row","티바 로우","등","등","바벨","weight_reps",["T바 로우","티바","T-Bar Row"],"바를 두 발 사이에 놓고 손잡이를 잡은 채 무릎을 굽히고 상체를 숙입니다.\n등을 곧게 펴고 가슴을 들어 올립니다.\n팔꿈치를 뒤로 당기며 손잡이를 가슴 아래로 끌어올립니다.\n등 근육을 조인 후 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 허리가 둥글게 말리지 않도록 상체 각도를 유지하세요.","back",["biceps"],"row_bent","barbell"),
  ex("dumbbell_one_arm_row","원암 덤벨 로우","등","등","덤벨","weight_reps",["원암 로우","덤벨 로우","One-arm Dumbbell Row"],"한 손과 같은 쪽 무릎을 벤치에 올리고 반대 손으로 덤벨을 잡습니다.\n등을 바닥과 평행하게 유지하고 팔을 아래로 늘어뜨립니다.\n팔꿈치를 뒤로 당기며 덤벨을 옆구리 쪽으로 끌어올립니다.\n등 근육을 조인 후 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 상체를 비틀지 말고 어깨가 위로 올라가지 않게 하세요.","back",["biceps"],"row_bent","dumbbell"),
  ex("dumbbell_bench_row","벤치 덤벨 로우","등","등","덤벨","weight_reps",["인클라인 덤벨 로우","엎드려 덤벨 로우","Bench Dumbbell Row"],"벤치를 30~45도로 세우고 가슴을 대고 엎드려 양손에 덤벨을 잡습니다.\n팔을 아래로 늘어뜨리고 견갑을 살짝 모읍니다.\n팔꿈치를 뒤로 당기며 덤벨을 옆구리 쪽으로 끌어올립니다.\n등을 조인 후 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 가슴을 패드에서 떼지 말고 목을 과하게 들지 마세요.","back",["biceps"],"row_bent","dumbbell"),
  ex("machine_lat_pulldown","랫풀다운","등","등","머신","weight_reps",["랫풀","렛풀다운","랫 풀다운","Lat Pulldown"],"무릎 패드를 조절해 허벅지를 고정하고 어깨너비보다 넓게 바를 잡습니다.\n상체를 약간 뒤로 기울이고 가슴을 펴며 어깨를 내립니다.\n팔꿈치를 아래로 당기며 바를 쇄골 쪽으로 끌어내립니다.\n등을 조인 후 천천히 팔을 펴며 시작 위치로 돌아갑니다.\n안전 팁: 반동으로 상체를 젖히지 말고 목 뒤로 당기지 마세요.","back",["biceps"],"pulldown","machine"),
  ex("machine_wide_lat_pulldown","와이드 랫풀다운","등","등","머신","weight_reps",["와이드 랫풀","Wide-grip Lat Pulldown"],"무릎 패드로 허벅지를 고정하고 어깨너비보다 훨씬 넓게 바를 잡습니다.\n가슴을 펴고 상체를 살짝 뒤로 기울입니다.\n팔꿈치를 옆으로 내리며 바를 쇄골 위쪽까지 당깁니다.\n등 바깥쪽을 조인 후 천천히 팔을 펴 돌아갑니다.\n안전 팁: 너무 넓게 잡으면 어깨에 무리가 가니 편안한 폭을 찾으세요.","back",["biceps"],"pulldown","machine"),
  ex("machine_underhand_lat_pulldown","언더그립 랫풀다운","등","등","머신","weight_reps",["리버스 그립 랫풀다운","언더 랫풀","Underhand Lat Pulldown"],"무릎 패드로 허벅지를 고정하고 손바닥이 몸을 향하도록 어깨너비로 바를 잡습니다.\n가슴을 펴고 상체를 약간 뒤로 기울입니다.\n팔꿈치를 몸 옆으로 내리며 바를 가슴 상단까지 당깁니다.\n천천히 팔을 펴 시작 위치로 돌아갑니다.\n안전 팁: 이두근 부담이 크므로 팔꿈치를 완전히 잠그지 말고 부드럽게 펴세요.","back",["biceps"],"pulldown","machine"),
  ex("machine_neutral_lat_pulldown","뉴트럴그립 랫풀다운","등","등","머신","weight_reps",["중립그립 랫풀다운","V바 랫풀다운","Neutral-grip Lat Pulldown"],"무릎 패드로 허벅지를 고정하고 손바닥이 마주 보는 V바 손잡이를 잡습니다.\n가슴을 펴고 상체를 약간 뒤로 기울입니다.\n팔꿈치를 몸 옆으로 내리며 손잡이를 가슴 상단까지 당깁니다.\n등을 조인 후 천천히 팔을 펴 시작 위치로 돌아갑니다.\n안전 팁: 어깨를 으쓱하지 말고 어깨를 아래로 내린 상태를 유지하세요.","back",["biceps"],"pulldown","machine"),
  ex("machine_behind_neck_pulldown","비하인드 넥 랫풀다운","등","등","머신","weight_reps",["비하인드 넥 풀다운","Behind-the-neck Pulldown"],"무릎 패드로 허벅지를 고정하고 넓게 바를 잡은 뒤 머리를 약간 앞으로 숙입니다.\n등을 곧게 펴고 가슴을 듭니다.\n바를 목 뒤쪽 어깨 높이까지 천천히 당깁니다.\n천천히 팔을 펴 시작 위치로 돌아갑니다.\n안전 팁: 어깨 유연성이 부족하면 어깨를 다칠 수 있으니 가벼운 무게로 하거나 앞쪽 풀다운으로 대체하세요.","back",["shoulders"],"pulldown","machine"),
  ex("cable_seated_row","시티드 케이블 로우","등","등","케이블","weight_reps",["시티드 로우","케이블 로우","Seated Cable Row"],"발판에 발을 대고 무릎을 살짝 굽힌 채 앉아 손잡이를 잡습니다.\n등을 곧게 펴고 가슴을 들어 올립니다.\n팔꿈치를 뒤로 당기며 손잡이를 배꼽 쪽으로 끌어옵니다.\n견갑을 모아 잠시 멈춘 뒤 천천히 팔을 펴 돌아갑니다.\n안전 팁: 상체를 과하게 앞뒤로 흔들지 말고 허리를 곧게 유지하세요.","back",["biceps"],"row_seated","cable"),
  ex("cable_one_arm_row","원암 케이블 로우","등","등","케이블","weight_reps",["싱글 암 케이블 로우","Single-arm Cable Row"],"케이블을 허리 높이에 두고 한 손으로 손잡이를 잡고 한 발 앞으로 서서 상체를 고정합니다.\n팔을 펴고 어깨를 안정시킵니다.\n팔꿈치를 뒤로 당기며 손잡이를 옆구리 쪽으로 끌어옵니다.\n등을 조인 후 천천히 팔을 펴 시작 위치로 돌아갑니다.\n안전 팁: 몸통이 돌아가지 않도록 복부에 힘을 주세요.","back",["biceps"],"row_seated","cable"),
  ex("cable_straight_arm_pulldown","스트레이트 암 풀다운","등","등","케이블","weight_reps",["암 풀다운","스트레이트암","Straight-arm Pulldown"],"높은 풀리에 바나 로프를 걸고 한 발 앞으로 서서 상체를 약간 숙입니다.\n팔을 거의 편 상태로 어깨너비로 바를 잡습니다.\n팔을 편 채로 바를 허벅지 앞까지 아래로 끌어내립니다.\n광배를 조인 후 천천히 시작 위치로 돌아갑니다.\n안전 팁: 팔꿈치를 굽히지 말고 허리를 곧게 유지하세요.","back",["triceps"],"pushdown","cable"),
  ex("cable_face_pull","페이스풀","어깨","어깨","케이블","weight_reps",["페이스 풀","케이블 페이스풀","Face Pull"],"로프를 얼굴 높이의 케이블에 걸고 양손으로 잡은 뒤 뒤로 물러서 섭니다.\n팔을 앞으로 펴고 몸을 곧게 세웁니다.\n팔꿈치를 높게 유지하며 로프를 얼굴 쪽으로 당깁니다.\n뒷어깨와 견갑을 조인 후 천천히 팔을 펴 돌아갑니다.\n안전 팁: 가벼운 무게로 정확한 자세를 유지하고 상체를 뒤로 젖히지 마세요.","shoulders",["back","traps"],"row_seated","cable"),
  ex("machine_chest_supported_row","체스트 서포티드 로우","등","등","머신","weight_reps",["체서로","Chest-supported Row"],"가슴 패드 높이를 조절하고 가슴을 대고 앉아 손잡이를 잡습니다.\n견갑을 살짝 모으고 팔을 폅니다.\n팔꿈치를 뒤로 당기며 손잡이를 몸 쪽으로 끌어옵니다.\n등을 조인 후 천천히 팔을 펴 시작 위치로 돌아갑니다.\n안전 팁: 가슴이 패드에서 떨어지지 않게 하고 어깨를 으쓱하지 마세요.","back",["biceps"],"row_seated","machine"),
  ex("machine_high_row","하이 로우","등","등","머신","weight_reps",["머신 하이 로우","High Row"],"시트 높이를 조절해 손잡이가 가슴보다 위에 오도록 하고 가슴 패드에 몸을 붙입니다.\n손잡이를 잡고 팔을 앞으로 펴며 견갑을 살짝 모읍니다.\n팔꿈치를 아래 뒤쪽으로 당기며 손잡이를 가슴 쪽으로 끌어옵니다.\n등 윗부분을 조인 후 천천히 시작 위치로 돌아갑니다.\n안전 팁: 반동 없이 일정한 속도로 움직이고 어깨를 올리지 마세요.","back",["biceps"],"row_seated","machine"),
  ex("machine_low_row","로우 로우","등","등","머신","weight_reps",["머신 로우 로우","Low Row"],"시트에 앉아 가슴 패드에 몸을 붙이고 낮은 손잡이를 잡습니다.\n팔을 펴고 견갑을 살짝 모읍니다.\n팔꿈치를 뒤로 당기며 손잡이를 복부 쪽으로 끌어옵니다.\n등을 조인 후 천천히 팔을 펴 돌아갑니다.\n안전 팁: 허리를 곧게 유지하고 상체를 뒤로 과하게 젖히지 마세요.","back",["biceps"],"row_seated","machine"),
  ex("bodyweight_pull_up","풀업","등","등","맨몸","reps",["턱걸이","Pull-up"],"어깨너비보다 넓게 손바닥이 앞을 향하게 철봉을 잡고 매달립니다.\n어깨를 아래로 내리고 복부에 힘을 줍니다.\n팔꿈치를 아래로 당기며 턱이 철봉 위로 올라올 때까지 몸을 끌어올립니다.\n천천히 팔을 펴며 시작 자세로 내려옵니다.\n안전 팁: 반동을 줄이고 내려올 때 어깨가 빠지지 않도록 천천히 내려오세요.","back",["biceps"],"pullup","bodyweight"),
  ex("bodyweight_chin_up","친업","등","등","맨몸","reps",["언더그립 턱걸이","Chin-up"],"손바닥이 얼굴을 향하게 어깨너비로 철봉을 잡고 매달립니다.\n가슴을 펴고 복부에 힘을 줍니다.\n팔꿈치를 몸에 붙이며 턱이 철봉 위로 올라오도록 끌어올립니다.\n천천히 팔을 펴며 내려옵니다.\n안전 팁: 이두근에 부담이 크므로 팔꿈치를 급하게 펴지 말고 천천히 내려오세요.","back",["biceps"],"pullup","bodyweight"),
  ex("bodyweight_wide_pull_up","와이드 풀업","등","등","맨몸","reps",["와이드 턱걸이","Wide-grip Pull-up"],"어깨너비보다 훨씬 넓게 철봉을 잡고 매달립니다.\n어깨를 아래로 내리고 가슴을 약간 들어 올립니다.\n팔꿈치를 옆으로 내리며 가슴이 철봉에 가까워지도록 끌어올립니다.\n등을 조인 후 천천히 내려옵니다.\n안전 팁: 너무 넓게 잡으면 어깨에 무리가 가니 가동범위를 유지하며 하세요.","back",["biceps"],"pullup","bodyweight"),
  ex("bodyweight_neutral_pull_up","중립그립 풀업","등","등","맨몸","reps",["뉴트럴그립 풀업","패러럴 그립 풀업","Neutral-grip Pull-up"],"평행 손잡이를 손바닥이 마주 보게 잡고 매달립니다.\n어깨를 내리고 복부에 힘을 줍니다.\n팔꿈치를 몸 옆으로 당기며 턱이 손잡이 높이를 넘도록 끌어올립니다.\n천천히 팔을 펴며 내려옵니다.\n안전 팁: 어깨와 손목 부담이 적지만 반동은 줄이고 천천히 하세요.","back",["biceps"],"pullup","bodyweight"),
  ex("bodyweight_inverted_row","인버티드 로우","등","등","맨몸","reps",["호주식 턱걸이","바디웨이트 로우","Inverted Row"],"낮은 바 아래에 누워 어깨너비보다 약간 넓게 바를 잡고 몸을 일직선으로 만듭니다.\n발뒤꿈치를 바닥에 두고 복부와 엉덩이에 힘을 줍니다.\n팔꿈치를 뒤로 당기며 가슴을 바 쪽으로 끌어올립니다.\n견갑을 모은 후 천천히 내려옵니다.\n안전 팁: 엉덩이가 처지지 않도록 하고 바가 안정적으로 고정되었는지 확인하세요.","back",["biceps"],"row_bent","bodyweight"),
  ex("machine_back_extension","백 익스텐션","등","허리","머신","weight_reps",["백익스","하이퍼익스텐션","Back Extension"],"패드 높이를 조절해 골반이 패드에 걸치도록 앉거나 엎드립니다.\n발을 고정하고 상체를 곧게 세운 상태에서 시작합니다.\n허리와 엉덩이 힘으로 상체를 일직선이 될 때까지 천천히 들어 올립니다.\n천천히 상체를 내려 시작 자세로 돌아옵니다.\n안전 팁: 끝에서 허리를 과도하게 젖히지 마세요.","lower_back",["glutes","hamstrings"],"hinge","machine"),
  ex("back_extension_45","45도 백 익스텐션","등","허리","기타","reps",["45도 하이퍼","45-degree Back Extension"],"45도 벤치에 골반을 패드 끝에 걸치고 발뒤꿈치를 고정합니다.\n팔을 가슴 앞에 모으고 몸을 일직선으로 맞춥니다.\n상체를 천천히 숙였다가 엉덩이와 허리 힘으로 일직선까지 올라옵니다.\n올라와서 엉덩이를 조인 후 천천히 다시 내려갑니다.\n안전 팁: 일직선을 넘어서 과하게 젖히지 마세요.","lower_back",["glutes","hamstrings"],"hinge","other"),
  ex("roman_chair_extension","로만 체어 익스텐션","등","허리","기타","reps",["로만체어 익스텐션","Roman Chair Extension"],"로만 체어에 허벅지를 올리고 발뒤꿈치를 고정한 채 상체를 곧게 세웁니다.\n팔을 가슴 앞에서 교차합니다.\n허리를 곧게 유지하며 상체를 천천히 앞으로 숙입니다.\n엉덩이와 허리 힘으로 상체를 일직선까지 들어 올립니다.\n안전 팁: 반동을 쓰지 말고 올라올 때 허리를 과하게 젖히지 마세요.","lower_back",["glutes"],"hinge","other"),
  ex("barbell_good_morning","굿모닝","하체","햄스트링","바벨","weight_reps",["굿모닝 엑서사이즈","Good Morning"],"바를 승모근 위에 올리고 발을 어깨너비로 벌려 서서 무릎을 살짝 굽힙니다.\n가슴을 펴고 복부에 힘을 줍니다.\n엉덩이를 뒤로 밀며 상체를 바닥과 가까워질 때까지 숙입니다.\n엉덩이를 앞으로 밀며 일어나 시작 자세로 돌아옵니다.\n안전 팁: 허리가 둥글게 말리지 않도록 가벼운 무게로 시작하세요.","hamstrings",["lower_back","glutes"],"hinge","barbell"),
  ex("barbell_rack_pull","랙 풀","등","허리","바벨","weight_reps",["랙풀","Rack Pull"],"랙의 핀을 무릎 높이 정도로 설정하고 바 앞에 섭니다.\n어깨너비로 바를 잡고 가슴을 펴며 등을 곧게 합니다.\n엉덩이와 허리로 바를 끌어올려 완전히 선 자세를 만듭니다.\n엉덩이를 뒤로 빼며 바를 천천히 핀 위에 내려놓습니다.\n안전 팁: 허리가 둥글게 말리지 않도록 복압을 유지하세요.","lower_back",["back","traps","glutes"],"hinge","barbell"),
  ex("bodyweight_bird_dog","버드독","복근","복근","맨몸","reps",["버드 독","Bird Dog"],"손은 어깨 아래, 무릎은 엉덩이 아래에 두고 네발 자세를 만듭니다.\n복부에 힘을 주고 허리를 중립으로 유지합니다.\n한쪽 팔과 반대쪽 다리를 동시에 곧게 뻗습니다.\n잠시 멈춘 후 천천히 돌아오고 반대쪽도 반복합니다.\n안전 팁: 골반이 한쪽으로 기울거나 허리가 꺾이지 않게 하세요.","abs",["lower_back","glutes"],"plank","bodyweight"),
  ex("bodyweight_superman","슈퍼맨","등","허리","맨몸","reps",["슈퍼맨 자세","Superman"],"바닥에 엎드려 팔을 앞으로 뻗고 다리를 곧게 펍니다.\n복부를 살짝 조이고 시선은 바닥을 향합니다.\n팔과 다리, 가슴을 동시에 바닥에서 들어 올립니다.\n잠시 멈춘 후 천천히 내려 시작 자세로 돌아옵니다.\n안전 팁: 목을 젖히지 말고 허리에 통증이 있으면 들어 올리는 높이를 줄이세요.","lower_back",["glutes"],"hinge","bodyweight"),
  ex("machine_reverse_hyperextension","리버스 하이퍼익스텐션","하체","둔근","머신","weight_reps",["리버스 하이퍼","Reverse Hyperextension"],"머신에 엎드려 골반을 패드 끝에 두고 손잡이를 잡습니다.\n다리를 아래로 내려뜨리고 몸을 고정합니다.\n엉덩이 힘으로 다리를 몸과 일직선이 되도록 들어 올립니다.\n엉덩이를 조인 후 천천히 다리를 내려 시작 자세로 돌아갑니다.\n안전 팁: 다리를 과하게 높이 들어 허리를 꺾지 마세요.","glutes",["hamstrings","lower_back"],"glute_kick","machine"),
  ex("cable_pull_through","케이블 풀스루","하체","둔근","케이블","weight_reps",["풀스루","Cable Pull-through"],"낮은 풀리에 로프를 걸고 케이블을 등지고 서서 가랑이 사이로 로프를 잡습니다.\n케이블에서 몇 걸음 앞으로 걸어가 발을 어깨너비로 벌립니다.\n엉덩이를 뒤로 밀며 상체를 숙이고 등은 곧게 유지합니다.\n엉덩이를 앞으로 밀어 완전히 선 자세로 돌아와 엉덩이를 조입니다.\n안전 팁: 팔이 아닌 엉덩이로 움직이고 허리를 둥글게 말지 마세요.","glutes",["hamstrings"],"hinge","cable"),
  ex("barbell_overhead_press","오버헤드 프레스","어깨","어깨","바벨","weight_reps",["OHP","오버헤드","Overhead Press"],"바를 쇄골 위에 올려 어깨너비로 잡고 팔꿈치를 앞쪽에 둡니다.\n복부와 엉덩이에 힘을 주고 몸을 곧게 세웁니다.\n머리를 살짝 뒤로 빼며 바를 머리 위로 곧게 밀어 올립니다.\n머리를 앞으로 넣으며 팔을 완전히 펴고 천천히 바를 내립니다.\n안전 팁: 허리를 과하게 젖히지 말고 복압을 유지하세요.","shoulders",["triceps"],"ohp","barbell"),
  ex("barbell_military_press","밀리터리 프레스","어깨","어깨","바벨","weight_reps",["밀프","Military Press"],"바를 쇄골 위에 올리고 발을 모아 엄격한 자세로 섭니다.\n복부와 엉덩이를 조여 몸을 고정합니다.\n반동 없이 바를 머리 위로 곧게 밀어 올립니다.\n천천히 쇄골 위로 내려 시작 자세로 돌아갑니다.\n안전 팁: 다리 반동을 쓰지 말고 허리가 꺾이지 않게 복부에 힘을 주세요.","shoulders",["triceps"],"ohp","barbell"),
  ex("barbell_behind_neck_press","비하인드 넥 프레스","어깨","어깨","바벨","weight_reps",["비하인드넥","Behind-the-neck Press"],"바를 승모근 위에 올리고 어깨너비보다 넓게 잡고 앉거나 섭니다.\n등을 곧게 펴고 복부에 힘을 줍니다.\n바를 머리 뒤에서 위로 곧게 밀어 올립니다.\n천천히 귀 높이 정도까지 내려 시작 자세로 돌아갑니다.\n안전 팁: 어깨 유연성이 부족하면 부상 위험이 크니 가벼운 무게로 하거나 피하세요.","shoulders",["triceps"],"ohp","barbell"),
  ex("barbell_push_press","푸쉬 프레스","어깨","어깨","바벨","weight_reps",["푸시 프레스","Push Press"],"바를 쇄골 위에 올리고 어깨너비로 잡고 발을 엉덩이너비로 섭니다.\n무릎을 살짝 굽혀 다리 반동을 준비합니다.\n다리로 힘차게 밀며 그 힘으로 바를 머리 위로 밀어 올립니다.\n팔을 완전히 펴고 천천히 바를 쇄골로 내리며 무릎으로 충격을 흡수합니다.\n안전 팁: 바가 머리 앞쪽 궤적을 따라 올라가도록 하고 허리를 과하게 젖히지 마세요.","shoulders",["triceps","quads"],"ohp","barbell"),
  ex("dumbbell_shoulder_press","덤벨 숄더 프레스","어깨","어깨","덤벨","weight_reps",["덤숄프","Dumbbell Shoulder Press"],"덤벨을 어깨 높이에서 손바닥이 앞을 향하게 잡고 서거나 앉습니다.\n복부에 힘을 주고 팔꿈치를 손목 바로 아래에 둡니다.\n덤벨을 머리 위로 밀어 올려 팔을 거의 펴 줍니다.\n귀 높이까지 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 허리가 과하게 꺾이지 않도록 갈비뼈를 내리고 엉덩이에 힘을 유지하세요.","shoulders",["triceps"],"ohp","dumbbell"),
  ex("dumbbell_arnold_press","아놀드 프레스","어깨","어깨","덤벨","weight_reps",["아놀드","Arnold Press"],"덤벨을 가슴 앞에서 손바닥이 몸쪽을 향하게 잡고 팔꿈치를 모읍니다.\n팔을 들어 올리면서 손목을 바깥으로 돌려 손바닥이 앞을 향하게 합니다.\n머리 위에서 팔을 거의 펴 줍니다.\n내려오면서 손목을 다시 돌려 가슴 앞 시작 자세로 돌아갑니다.\n안전 팁: 회전 구간에서 어깨가 불편하면 중량을 낮추고 천천히 수행하세요.","shoulders",["triceps"],"ohp","dumbbell"),
  ex("dumbbell_seated_press","시티드 덤벨 프레스","어깨","어깨","덤벨","weight_reps",["시티드 숄더 프레스","Seated Dumbbell Press"],"등받이가 수직에 가까운 벤치에 앉아 덤벨을 어깨 높이로 듭니다.\n등과 엉덩이를 벤치에 붙이고 발을 바닥에 단단히 둡니다.\n덤벨을 머리 위로 곧게 밀어 올립니다.\n천천히 어깨 높이까지 내려 시작 자세로 돌아갑니다.\n안전 팁: 덤벨을 올릴 때 허리가 벤치에서 뜨지 않도록 복부에 힘을 주세요.","shoulders",["triceps"],"ohp","dumbbell"),
  ex("dumbbell_lateral_raise","덤벨 레터럴 레이즈","어깨","어깨","덤벨","weight_reps",["사레레","사이드 레터럴 레이즈","사이드 레이즈","Dumbbell Lateral Raise"],"덤벨을 몸 옆에 들고 서서 상체를 곧게 세우고 팔꿈치를 살짝 굽힙니다.\n팔꿈치가 손보다 먼저 올라가도록 팔을 옆으로 들어 올립니다.\n어깨 높이 근처에서 잠시 멈춥니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 반동을 쓰지 말고 가벼운 중량으로 어깨를 으쓱하지 않게 하세요.","shoulders",[],"raise","dumbbell"),
  ex("dumbbell_seated_lateral_raise","시티드 레터럴 레이즈","어깨","어깨","덤벨","weight_reps",["앉아서 사레레","Seated Lateral Raise"],"벤치에 앉아 허리를 세우고 덤벨을 몸 옆에 내려 잡습니다.\n팔꿈치를 살짝 굽힌 채 팔을 옆으로 들어 올립니다.\n어깨 높이에서 잠시 멈추며 승모근 개입을 줄입니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 앉은 상태에서 상체가 뒤로 젖혀지지 않도록 가슴을 펴고 유지하세요.","shoulders",[],"raise","dumbbell"),
  ex("dumbbell_front_raise","프론트 레이즈","어깨","어깨","덤벨","weight_reps",["덤벨 프론트 레이즈","Front Raise"],"덤벨을 허벅지 앞에 두고 선 채 상체를 곧게 세웁니다.\n팔꿈치를 살짝 굽히고 한쪽 또는 양팔을 앞으로 들어 올립니다.\n어깨 높이에서 잠시 멈춥니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 몸을 뒤로 젖혀 반동을 주지 않도록 중량을 낮추세요.","shoulders",[],"raise","dumbbell"),
  ex("dumbbell_bent_over_lateral_raise","벤트오버 레터럴 레이즈","어깨","어깨","덤벨","weight_reps",["벤트오버 레이즈","후면 레이즈","Bent-over Lateral Raise"],"덤벨을 들고 무릎을 살짝 굽혀 상체를 거의 수평으로 숙입니다.\n등을 곧게 펴고 덤벨을 몸 아래로 늘어뜨립니다.\n팔꿈치를 살짝 굽힌 채 팔을 옆으로 들어 올립니다.\n어깨 높이에서 멈춘 뒤 천천히 내립니다.\n안전 팁: 허리가 둥글어지지 않게 시선을 바닥에 두고 코어를 단단히 유지하세요.","shoulders",["back"],"raise","dumbbell"),
  ex("dumbbell_rear_delt_fly","리어 델트 플라이","어깨","어깨","덤벨","weight_reps",["리어델트","후면 플라이","Rear Delt Fly"],"벤치 끝에 앉아 상체를 앞으로 숙이고 덤벨을 무릎 아래에서 잡습니다.\n가슴을 허벅지 쪽으로 두고 등을 곧게 폅니다.\n팔꿈치를 살짝 굽힌 채 팔을 양옆으로 벌려 올립니다.\n견갑을 살짝 모은 뒤 천천히 내려 돌아갑니다.\n안전 팁: 목이 긴장되지 않도록 시선을 바닥에 두고 가벼운 중량을 쓰세요.","shoulders",["back"],"raise","dumbbell"),
  ex("barbell_upright_row","업라이트 로우","어깨","어깨","바벨","weight_reps",["업라로","Upright Row"],"바벨을 어깨너비 정도로 오버핸드로 잡고 허벅지 앞에 둡니다.\n바를 몸에 가깝게 유지하며 팔꿈치를 먼저 위로 이끕니다.\n바가 가슴 중간 높이에 오면 잠시 멈춥니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 어깨가 불편하면 가슴 아래까지만 당기고 그립을 넓게 잡으세요.","shoulders",["traps"],"upright","barbell"),
  ex("smith_shoulder_press","스미스 숄더 프레스","어깨","어깨","스미스","weight_reps",["스미스 오버헤드 프레스","Smith Shoulder Press"],"스미스 머신 아래에 벤치를 놓고 바를 턱 높이쯤에 맞춥니다.\n어깨너비보다 약간 넓게 바를 잡고 안전 걸쇠를 풉니다.\n바를 머리 위로 곧게 밀어 올립니다.\n턱 높이까지 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 바 궤적이 고정되므로 몸 위치를 맞추고 안전 걸쇠 높이를 미리 설정하세요.","shoulders",["triceps"],"ohp","smith"),
  ex("machine_shoulder_press","숄더 프레스 머신","어깨","어깨","머신","weight_reps",["머신 숄더 프레스","Shoulder Press Machine"],"시트 높이를 조절해 손잡이가 어깨 높이에 오도록 앉습니다.\n등을 등받이에 붙이고 손잡이를 잡습니다.\n손잡이를 머리 위로 밀어 팔을 거의 펴 줍니다.\n천천히 어깨 높이까지 내려 돌아갑니다.\n안전 팁: 팔을 끝까지 잠그지 말고 어깨가 으쓱 올라가지 않게 하세요.","shoulders",["triceps"],"ohp","machine"),
  ex("machine_lateral_raise","레터럴 레이즈 머신","어깨","어깨","머신","weight_reps",["머신 사레레","Lateral Raise Machine"],"시트 높이를 조절해 어깨 관절이 머신 회전축과 맞도록 앉습니다.\n팔꿈치 패드 안쪽에 팔을 대고 등을 등받이에 붙입니다.\n팔을 옆으로 어깨 높이까지 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 손이 아닌 팔꿈치로 밀듯 올려 어깨가 으쓱하지 않게 하세요.","shoulders",[],"raise","machine"),
  ex("machine_rear_delt","리어 델트 머신","어깨","어깨","머신","weight_reps",["리버스 펙덱","Rear Delt Machine"],"가슴을 패드에 대고 앉아 손잡이를 어깨 높이로 맞춥니다.\n팔을 거의 편 채 손잡이를 잡습니다.\n팔을 뒤로 벌려 견갑을 가볍게 모읍니다.\n천천히 앞으로 돌아와 시작 자세로 갑니다.\n안전 팁: 반동 없이 움직이고 목과 승모근에 힘이 들어가지 않게 하세요.","shoulders",["back"],"raise","machine"),
  ex("cable_lateral_raise","케이블 레터럴 레이즈","어깨","어깨","케이블","weight_reps",["케이블 사레레","Cable Lateral Raise"],"케이블을 가장 낮은 위치에 두고 옆으로 서서 먼 쪽 손으로 손잡이를 잡습니다.\n몸을 곧게 세우고 팔꿈치를 살짝 굽힙니다.\n팔을 옆으로 어깨 높이까지 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 몸이 기울지 않도록 반대 손으로 기둥을 잡고 수행하세요.","shoulders",[],"raise","cable"),
  ex("cable_front_raise","케이블 프론트 레이즈","어깨","어깨","케이블","weight_reps",["Cable Front Raise"],"케이블을 낮은 위치에 두고 등을 기계 쪽으로 향해 서서 손잡이를 잡습니다.\n팔을 몸 앞에 내리고 팔꿈치를 살짝 굽힙니다.\n팔을 앞으로 어깨 높이까지 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 허리가 젖혀지지 않도록 복부에 힘을 주고 중량을 조절하세요.","shoulders",[],"raise","cable"),
  ex("cable_rear_delt_fly","케이블 리어 델트 플라이","어깨","어깨","케이블","weight_reps",["케이블 리어 플라이","Cable Rear Delt Fly"],"케이블 양쪽을 가슴 높이로 맞추고 반대편 손잡이를 교차해 잡습니다.\n한 걸음 물러나 팔을 거의 편 채 시작합니다.\n팔을 양옆으로 벌리며 견갑을 가볍게 모읍니다.\n천천히 팔을 모아 시작 자세로 돌아갑니다.\n안전 팁: 가슴을 편 채 어깨가 으쓱 올라가지 않도록 가벼운 중량으로 하세요.","shoulders",["back"],"raise","cable"),
  ex("bodyweight_pike_push_up","파이크 푸쉬업","어깨","어깨","맨몸","reps",["파이크 푸시업","Pike Push-up"],"손을 어깨너비로 바닥에 짚고 엉덩이를 높이 올려 역 브이자를 만듭니다.\n발은 어깨너비로 두고 머리가 손 사이를 향하게 합니다.\n팔꿈치를 굽혀 머리 정수리가 바닥에 가까워지게 내려갑니다.\n바닥을 밀어 팔을 펴며 시작 자세로 돌아갑니다.\n안전 팁: 머리를 바닥에 부딪히지 않게 깊이를 조절하고 손목을 충분히 풀어 주세요.","shoulders",["triceps"],"push_up","bodyweight"),
  ex("bodyweight_handstand_push_up","핸드스탠드 푸쉬업","어깨","어깨","맨몸","reps",["물구나무 푸시업","HSPU","Handstand Push-up"],"벽을 등지고 손을 짚어 물구나무로 발을 벽에 대고 몸을 곧게 폅니다.\n손은 어깨너비 정도로 두고 복부와 엉덩이에 힘을 줍니다.\n팔꿈치를 굽혀 머리가 바닥에 가까워지게 천천히 내려갑니다.\n바닥을 밀어 팔을 펴며 올라갑니다.\n안전 팁: 매트나 수건을 머리 아래에 두고, 숙련 전에는 가동범위를 줄여 수행하세요.","shoulders",["triceps"],"push_up","bodyweight"),
  ex("barbell_back_squat","백 스쿼트","하체","대퇴사두","바벨","weight_reps",["스쿼트","바벨 스쿼트","Back Squat"],"랙에서 바를 어깨 뒤 승모근 위에 얹고 발을 어깨너비로 서서 한두 걸음 물러섭니다.\n가슴을 펴고 복부에 힘을 준 채 엉덩이와 무릎을 함께 굽혀 내려갑니다.\n허벅지가 바닥과 평행하거나 그 이하가 될 때까지 앉습니다.\n발바닥 전체로 바닥을 밀어 일어나며 시작 자세로 돌아갑니다.\n안전 팁: 랙의 세이프티 바를 알맞은 높이로 설정하세요.","quads",["glutes","hamstrings"],"squat","barbell"),
  ex("barbell_front_squat","프론트 스쿼트","하체","대퇴사두","바벨","weight_reps",["프스","Front Squat"],"바를 쇄골과 앞 어깨 위에 얹고 팔꿈치를 높이 들어 고정합니다.\n발을 어깨너비로 벌리고 상체를 곧게 세웁니다.\n무릎과 엉덩이를 굽혀 상체를 세운 채 깊이 앉습니다.\n발바닥으로 바닥을 밀며 일어나 돌아옵니다.\n안전 팁: 팔꿈치가 내려가면 바가 굴러 떨어지므로 팔꿈치를 계속 높게 유지하세요.","quads",["glutes","abs"],"squat","barbell"),
  ex("barbell_high_bar_squat","하이바 스쿼트","하체","대퇴사두","바벨","weight_reps",["하이바","High-bar Squat"],"바를 목 바로 아래 승모근 위쪽에 얹고 발을 어깨너비로 섭니다.\n가슴을 펴고 상체를 세운 채 무릎을 앞으로 보내며 앉습니다.\n허벅지가 평행 이하가 될 때까지 내려갑니다.\n발바닥 전체로 밀어 일어납니다.\n안전 팁: 무릎이 안쪽으로 모이지 않도록 발끝 방향으로 밀어내세요.","quads",["glutes"],"squat","barbell"),
  ex("barbell_low_bar_squat","로우바 스쿼트","하체","대퇴사두","바벨","weight_reps",["로우바","Low-bar Squat"],"바를 후면 삼각근 위 등 상부에 낮게 얹고 견갑을 모아 지지합니다.\n발을 어깨너비보다 약간 넓게 서고 엉덩이를 뒤로 빼며 시작합니다.\n상체를 약간 숙인 채 허벅지가 평행 이하가 될 때까지 앉습니다.\n엉덩이와 허벅지로 밀어 일어나며 돌아옵니다.\n안전 팁: 손목과 어깨가 불편하면 그립을 넓게 하고 세이프티 바를 설정하세요.","quads",["glutes","hamstrings"],"squat","barbell"),
  ex("barbell_box_squat","박스 스쿼트","하체","대퇴사두","바벨","weight_reps",["Box Squat"],"랙 안에 박스를 두고 바를 등에 얹은 뒤 박스 앞에 섭니다.\n엉덩이를 뒤로 빼며 박스 위에 천천히 앉습니다.\n박스에 앉아 긴장을 유지하고 반동 없이 멈춥니다.\n발로 바닥을 밀어 일어나 시작 자세로 돌아갑니다.\n안전 팁: 박스에 털썩 앉지 말고 허리를 중립으로 유지하며 조절해 앉으세요.","quads",["glutes","hamstrings"],"squat","barbell"),
  ex("barbell_overhead_squat","오버헤드 스쿼트","하체","대퇴사두","바벨","weight_reps",["OHS","Overhead Squat"],"바를 넓게 잡아 머리 위로 올리고 팔을 완전히 편 채 고정합니다.\n발은 어깨너비보다 약간 넓게 서고 복부에 힘을 줍니다.\n바를 발 중앙 위에 유지하며 깊이 앉습니다.\n바를 흔들리지 않게 유지하며 일어나 돌아옵니다.\n안전 팁: 처음엔 빈 바나 막대로 연습하고 바를 떨어뜨릴 공간을 확보하세요.","quads",["shoulders","abs"],"squat","barbell"),
  ex("dumbbell_goblet_squat","고블릿 스쿼트","하체","대퇴사두","덤벨","weight_reps",["고블렛 스쿼트","Goblet Squat"],"덤벨 한쪽 끝을 두 손으로 잡아 가슴 앞에 붙입니다.\n발은 어깨너비보다 약간 넓게 두고 발끝을 약간 바깥으로 향합니다.\n상체를 세운 채 엉덩이와 무릎을 굽혀 팔꿈치가 무릎 안쪽에 오게 앉습니다.\n발바닥으로 바닥을 밀어 일어나 돌아옵니다.\n안전 팁: 덤벨을 가슴에 붙이고 허리가 둥글어지지 않게 하세요.","quads",["glutes"],"squat","dumbbell"),
  ex("dumbbell_squat","덤벨 스쿼트","하체","대퇴사두","덤벨","weight_reps",["Dumbbell Squat"],"양손에 덤벨을 들고 몸 옆에 내리거나 어깨에 얹고 발을 어깨너비로 섭니다.\n가슴을 펴고 복부에 힘을 줍니다.\n엉덩이를 뒤로 빼며 무릎을 굽혀 허벅지가 평행이 될 때까지 앉습니다.\n발바닥으로 밀어 일어나 돌아옵니다.\n안전 팁: 무릎이 안으로 모이지 않게 하고 덤벨이 다리에 닿지 않게 주의하세요.","quads",["glutes"],"squat","dumbbell"),
  ex("dumbbell_bulgarian_split_squat","불가리안 스플릿 스쿼트","하체","대퇴사두","덤벨","weight_reps",["불가리안","불스쿼","Bulgarian Split Squat"],"벤치를 등지고 한 발 뒤꿈치를 올려 발등을 벤치에 얹고 덤벨을 양손에 듭니다.\n앞발은 한 걸음 반 정도 앞에 둡니다.\n상체를 곧게 세운 채 뒷무릎이 바닥에 가까워지게 내려갑니다.\n앞발 뒤꿈치로 밀어 올라와 돌아옵니다.\n안전 팁: 앞무릎이 안쪽으로 무너지지 않게 발끝 방향으로 유지하세요.","quads",["glutes"],"squat","dumbbell"),
  ex("dumbbell_lunge","덤벨 런지","하체","대퇴사두","덤벨","weight_reps",["런지","Dumbbell Lunge"],"양손에 덤벨을 들고 몸 옆에 둔 채 곧게 섭니다.\n한 발을 앞으로 크게 내디뎌 발바닥 전체를 바닥에 딛습니다.\n뒷무릎이 바닥 가까이 갈 때까지 상체를 세운 채 내려갑니다.\n앞발로 밀어 시작 자세로 돌아갑니다.\n안전 팁: 앞무릎이 발끝 방향을 따르도록 하고 균형을 위해 시선을 정면에 두세요.","quads",["glutes"],"squat","dumbbell"),
  ex("dumbbell_walking_lunge","워킹 런지","하체","대퇴사두","덤벨","weight_reps",["걸으며 런지","Walking Lunge"],"양손에 덤벨을 들고 상체를 세운 채 섭니다.\n한 발을 앞으로 크게 내디디며 뒷무릎이 바닥에 가까워지게 내려갑니다.\n앞발로 밀며 뒷발을 앞으로 가져와 반대 발 런지를 이어 갑니다.\n일정한 보폭으로 걸으며 반복합니다.\n안전 팁: 걸을 공간을 미리 확보하고 균형이 무너지면 가벼운 중량으로 하세요.","quads",["glutes"],"squat","dumbbell"),
  ex("dumbbell_reverse_lunge","리버스 런지","하체","대퇴사두","덤벨","weight_reps",["뒤로 런지","Reverse Lunge"],"양손에 덤벨을 들고 몸 옆에 둔 채 곧게 섭니다.\n한 발을 뒤로 크게 내딛어 발끝으로 닿습니다.\n앞무릎을 굽혀 뒷무릎이 바닥에 가까워지게 내려갑니다.\n앞발로 밀어 뒷발을 가져오며 돌아옵니다.\n안전 팁: 상체를 곧게 유지하고 앞무릎이 발끝을 크게 넘어가지 않게 하세요.","quads",["glutes"],"squat","dumbbell"),
  ex("smith_squat","스미스 스쿼트","하체","대퇴사두","스미스","weight_reps",["스미스 머신 스쿼트","Smith Squat"],"스미스 머신 바 아래에 서서 바를 등 상부에 얹고 발을 바보다 약간 앞에 둡니다.\n걸쇠를 풀고 가슴을 편 채 복부에 힘을 줍니다.\n무릎과 엉덩이를 굽혀 허벅지가 평행이 될 때까지 내려갑니다.\n발바닥으로 밀어 일어나 돌아옵니다.\n안전 팁: 안전 걸쇠를 하단 높이에 설정하고 바가 몸에서 너무 앞서지 않게 하세요.","quads",["glutes"],"squat","smith"),
  ex("smith_lunge","스미스 런지","하체","대퇴사두","스미스","weight_reps",["Smith Lunge"],"스미스 머신 바를 등 상부에 얹고 한 발을 앞에, 한 발을 뒤에 두고 섭니다.\n걸쇠를 풀고 상체를 곧게 세웁니다.\n뒷무릎이 바닥에 가까워질 때까지 수직으로 내려갑니다.\n앞발로 밀어 올라와 돌아옵니다.\n안전 팁: 앞발 위치를 충분히 앞에 두어 무릎에 무리가 가지 않게 하세요.","quads",["glutes"],"squat","smith"),
  ex("machine_hack_squat","핵 스쿼트","하체","대퇴사두","머신","weight_reps",["핵스쿼트","Hack Squat"],"어깨 패드 아래에 서서 등을 등받이에 붙이고 발을 발판에 둡니다.\n안전 장치를 풀고 복부에 힘을 줍니다.\n무릎을 굽혀 허벅지가 평행 이하가 될 때까지 내려갑니다.\n발바닥으로 밀어 올라와 돌아옵니다.\n안전 팁: 발이 뜨지 않도록 하고 정상에서 무릎을 완전히 잠그지 마세요.","quads",["glutes"],"squat","machine"),
  ex("machine_v_squat","브이 스쿼트","하체","대퇴사두","머신","weight_reps",["V 스쿼트","V-Squat"],"머신에 올라 어깨 패드에 어깨를 대고 발을 발판에 둡니다.\n등을 등받이에 붙이고 손잡이를 잡은 채 걸쇠를 풉니다.\n무릎을 굽혀 몸을 아래로 내려 깊이 앉습니다.\n발바닥으로 밀어 올라와 돌아옵니다.\n안전 팁: 무릎이 안쪽으로 모이지 않게 하고 하단에서 엉덩이가 떠지지 않게 하세요.","quads",["glutes"],"squat","machine"),
  ex("machine_leg_press","레그 프레스","하체","대퇴사두","머신","weight_reps",["레그프레스","레프","Leg Press"],"시트에 앉아 등과 엉덩이를 붙이고 발을 발판에 어깨너비로 둡니다.\n안전 걸쇠를 풀고 무릎을 굽혀 발판을 천천히 내립니다.\n무릎이 가슴 쪽으로 오되 엉덩이가 뜨지 않는 곳까지 내립니다.\n발바닥으로 밀어 팔다리를 펴며 돌아옵니다.\n안전 팁: 정상에서 무릎을 끝까지 잠그지 말고 엉덩이가 시트에서 뜨지 않게 하세요.","quads",["glutes"],"leg_press","machine"),
  ex("machine_single_leg_press","싱글 레그 프레스","하체","대퇴사두","머신","weight_reps",["원레그 프레스","Single-leg Press"],"시트에 앉아 등을 붙이고 한 발만 발판 중앙에 둡니다.\n반대 발은 바닥이나 발받침에 편안히 둡니다.\n무릎을 굽혀 발판을 천천히 내립니다.\n발바닥으로 밀어 다리를 펴며 돌아옵니다.\n안전 팁: 한쪽에 부담이 가므로 중량을 낮추고 골반이 한쪽으로 돌아가지 않게 하세요.","quads",["glutes"],"leg_press","machine"),
  ex("machine_leg_extension","레그 익스텐션","하체","대퇴사두","머신","weight_reps",["레그익스","레익","Leg Extension"],"시트에 앉아 무릎이 회전축과 맞도록 등받이를 조절하고 발목 패드를 정강이 아래에 둡니다.\n손잡이를 잡고 상체를 고정합니다.\n무릎을 펴며 패드를 위로 들어 올립니다.\n정상에서 잠시 멈춘 뒤 천천히 내려 돌아옵니다.\n안전 팁: 반동을 쓰지 말고 무릎에 무리가 가면 가동범위와 중량을 줄이세요.","quads",[],"leg_ext","machine"),
  ex("bodyweight_sissy_squat","시시 스쿼트","하체","대퇴사두","맨몸","reps",["Sissy Squat"],"발을 어깨너비보다 좁게 서고 한 손으로 기둥이나 벽을 잡아 균형을 잡습니다.\n뒤꿈치를 들고 무릎을 앞으로 보내며 상체를 뒤로 기울입니다.\n무릎이 바닥에 가까워지도록 몸을 일직선으로 유지하며 내려갑니다.\n허벅지 앞쪽 힘으로 일어나 돌아옵니다.\n안전 팁: 무릎 부담이 크므로 낮은 깊이에서 시작하고 지지물을 꼭 잡으세요.","quads",[],"squat","bodyweight"),
  ex("bodyweight_wall_sit","월싯","하체","대퇴사두","맨몸","duration",["벽 앉기","월 스쿼트","Wall Sit"],"벽에 등을 붙이고 서서 발을 앞으로 한 걸음 내딛습니다.\n등을 벽에 대고 미끄러져 무릎이 90도가 되도록 앉습니다.\n허벅지를 바닥과 평행하게 유지하며 정해진 시간 동안 버팁니다.\n시간이 끝나면 천천히 벽을 밀며 일어납니다.\n안전 팁: 무릎이 발끝을 넘지 않게 하고 호흡을 멈추지 말고 일정하게 쉬세요.","quads",["glutes"],"squat","bodyweight"),
  ex("bodyweight_pistol_squat","피스톨 스쿼트","하체","대퇴사두","맨몸","reps",["한발 스쿼트","Pistol Squat"],"한 발로 서서 반대 다리는 앞으로 뻗어 듭니다.\n팔을 앞으로 뻗어 균형을 잡습니다.\n지지한 다리의 엉덩이와 무릎을 굽혀 천천히 깊이 앉습니다.\n발바닥 전체로 바닥을 밀어 한 발로 일어납니다.\n안전 팁: 처음에는 의자나 기둥을 잡고 연습하고 무릎이 안으로 모이지 않게 하세요.","quads",["glutes"],"squat","bodyweight"),
  ex("barbell_hip_thrust","바벨 힙쓰러스트","하체","둔근","바벨","weight_reps",["힙쓰러스트","힙 쓰러스트","힙트","Barbell Hip Thrust"],"벤치에 어깨뼈 아래를 기대고 바를 골반 위에 얹습니다.\n발은 어깨너비로 두고 무릎이 약 90도가 되게 합니다.\n턱을 살짝 당기고 엉덩이를 힘껏 밀어 올려 몸통을 일직선으로 만듭니다.\n정상에서 엉덩이를 조인 뒤 천천히 내립니다.\n안전 팁: 바에 패드를 대고 허리가 과하게 꺾이지 않게 갈비뼈를 내리세요.","glutes",["hamstrings"],"bridge","barbell"),
  ex("bodyweight_glute_bridge","글루트 브리지","하체","둔근","맨몸","reps",["힙 브리지","브릿지","Glute Bridge"],"바닥에 누워 무릎을 굽히고 발을 엉덩이 쪽으로 가까이 둡니다.\n팔은 몸 옆에 두고 복부에 힘을 줍니다.\n발뒤꿈치로 바닥을 밀며 엉덩이를 들어 올립니다.\n어깨부터 무릎이 일직선이 되면 조인 뒤 천천히 내립니다.\n안전 팁: 허리가 아닌 엉덩이 힘으로 올리고 허리를 과하게 젖히지 마세요.","glutes",["hamstrings"],"bridge","bodyweight"),
  ex("bodyweight_single_leg_glute_bridge","싱글 레그 글루트 브리지","하체","둔근","맨몸","reps",["원레그 브리지","Single-leg Glute Bridge"],"바닥에 누워 한 발을 바닥에 두고 반대 다리는 곧게 위로 뻗습니다.\n복부에 힘을 주고 골반을 수평으로 유지합니다.\n지지 발 뒤꿈치로 밀어 엉덩이를 들어 올립니다.\n정상에서 조인 뒤 천천히 내립니다.\n안전 팁: 골반이 한쪽으로 기울지 않게 하고 햄스트링 경련이 오면 쉬어 가세요.","glutes",["hamstrings"],"bridge","bodyweight"),
  ex("dumbbell_romanian_deadlift","덤벨 루마니안 데드리프트","하체","햄스트링","덤벨","weight_reps",["덤벨 RDL","Dumbbell Romanian Deadlift"],"덤벨을 양손에 들고 허벅지 앞에 둔 채 발을 골반너비로 섭니다.\n무릎을 약간만 굽히고 가슴을 편 채 엉덩이를 뒤로 뺍니다.\n덤벨을 다리에 붙여 정강이 중간까지 내립니다.\n엉덩이를 앞으로 밀어 일어나 돌아옵니다.\n안전 팁: 등이 둥글어지지 않게 하고 허벅지 뒤 늘어남이 느껴지는 범위까지만 내리세요.","hamstrings",["glutes"],"hinge","dumbbell"),
  ex("dumbbell_glute_kickback","덤벨 글루트 킥백","하체","둔근","덤벨","weight_reps",["덤벨 킥백","덤벨 힙 킥백","Dumbbell Glute Kickback"],"벤치나 바닥에 한 손과 한 무릎을 짚고 네발 자세를 취합니다.\n반대 다리 접힌 오금 사이에 덤벨을 끼웁니다.\n복부에 힘을 주고 덤벨 낀 다리를 뒤위로 차올립니다.\n엉덩이를 조인 뒤 천천히 내려 돌아옵니다.\n안전 팁: 허리가 젖혀지지 않도록 골반을 고정하고 덤벨이 떨어지지 않게 주의하세요.","glutes",["hamstrings"],"glute_kick","dumbbell"),
  ex("smith_hip_thrust","스미스 힙쓰러스트","하체","둔근","스미스","weight_reps",["스미스 힙트","Smith Hip Thrust"],"스미스 머신 앞 바닥에 앉아 벤치에 어깨뼈 아래를 기대고 바를 골반 위에 얹습니다.\n발을 어깨너비로 두고 걸쇠를 풉니다.\n엉덩이를 힘껏 밀어 올려 몸통을 일직선으로 만듭니다.\n정상에서 조인 뒤 천천히 내립니다.\n안전 팁: 바에 패드를 대고 정상에서 허리를 과하게 젖히지 않게 하세요.","glutes",["hamstrings"],"bridge","smith"),
  ex("machine_lying_leg_curl","라잉 레그 컬","하체","햄스트링","머신","weight_reps",["레그컬","라잉 레그컬","Lying Leg Curl"],"머신에 엎드려 무릎이 회전축과 맞고 발목 패드가 종아리 아래에 오게 합니다.\n손잡이를 잡고 골반을 벤치에 붙입니다.\n무릎을 굽혀 패드를 엉덩이 쪽으로 당깁니다.\n정상에서 잠시 멈춘 뒤 천천히 내려 돌아옵니다.\n안전 팁: 엉덩이가 들리지 않게 하고 반동 없이 천천히 수행하세요.","hamstrings",[],"leg_curl","machine"),
  ex("machine_seated_leg_curl","시티드 레그 컬","하체","햄스트링","머신","weight_reps",["시티드 레그컬","Seated Leg Curl"],"시트에 앉아 등을 붙이고 발목 패드를 종아리 아래에 맞춥니다.\n허벅지 패드를 내려 다리를 고정합니다.\n무릎을 굽혀 패드를 아래로 당깁니다.\n정상에서 잠시 멈춘 뒤 천천히 올라가 돌아옵니다.\n안전 팁: 상체가 앞으로 쏠리지 않게 하고 무릎 축과 머신 축을 맞추세요.","hamstrings",[],"leg_curl","machine"),
  ex("machine_standing_leg_curl","스탠딩 레그 컬","하체","햄스트링","머신","weight_reps",["스탠딩 레그컬","Standing Leg Curl"],"머신에 서서 무릎이 회전축과 맞고 발목 패드가 종아리 뒤에 오게 합니다.\n손잡이를 잡고 지지 다리를 곧게 폅니다.\n한 다리의 무릎을 굽혀 패드를 엉덩이 쪽으로 당깁니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 골반이 앞뒤로 흔들리지 않게 고정하고 반동을 피하세요.","hamstrings",[],"leg_curl","machine"),
  ex("machine_hip_abduction","힙 어브덕션","하체","둔근","머신","weight_reps",["어브덕션","아웃타이","힙 아웃","Hip Abduction"],"시트에 앉아 등을 붙이고 무릎 바깥쪽 패드에 다리를 댑니다.\n손잡이를 잡고 상체를 안정시킵니다.\n다리를 양옆으로 힘껏 벌립니다.\n잠시 멈춘 뒤 천천히 모아 돌아옵니다.\n안전 팁: 무리한 중량으로 반동을 주지 말고 허리가 뜨지 않게 하세요.","glutes",[],"glute_kick","machine"),
  ex("machine_hip_adduction","힙 어덕션","하체","둔근","머신","weight_reps",["어덕션","이너타이","힙 인","Hip Adduction"],"시트에 앉아 등을 붙이고 무릎 안쪽 패드에 다리를 댑니다.\n시작 가동범위를 편안한 폭으로 조절합니다.\n다리를 안쪽으로 모아 패드를 닫습니다.\n잠시 멈춘 뒤 천천히 벌려 돌아옵니다.\n안전 팁: 시작 폭을 너무 넓게 하지 말고 사타구니가 당기면 범위를 줄이세요.","glutes",[],"glute_kick","machine"),
  ex("cable_glute_kickback","케이블 킥백","하체","둔근","케이블","weight_reps",["케이블 힙 킥백","Cable Glute Kickback"],"케이블을 낮게 두고 발목 스트랩을 한쪽 발목에 건 뒤 기계를 마주 섭니다.\n손잡이를 잡고 상체를 살짝 숙여 균형을 잡습니다.\n복부에 힘을 주고 다리를 뒤로 곧게 차올립니다.\n엉덩이를 조인 뒤 천천히 돌아옵니다.\n안전 팁: 허리가 과하게 젖혀지지 않게 골반을 고정하고 중량을 가볍게 시작하세요.","glutes",["hamstrings"],"glute_kick","cable"),
  ex("cable_hip_extension","케이블 힙 익스텐션","하체","둔근","케이블","weight_reps",["Cable Hip Extension"],"케이블을 낮은 위치에 두고 발목 스트랩을 한쪽 발목에 겁니다.\n기둥이나 손잡이를 잡고 상체를 곧게 세웁니다.\n무릎을 거의 편 채 다리를 뒤로 쭉 뻗어 엉덩이를 수축합니다.\n천천히 돌아와 시작 자세로 갑니다.\n안전 팁: 다리를 높이 차려고 허리를 꺾지 말고 엉덩이 힘으로 움직이세요.","glutes",["hamstrings"],"glute_kick","cable"),
  ex("bodyweight_nordic_curl","노르딕 컬","하체","햄스트링","맨몸","reps",["노르딕 햄스트링 컬","Nordic Hamstring Curl"],"패드 위에 무릎을 꿇고 발목을 파트너나 고정대에 단단히 고정합니다.\n상체를 곧게 펴고 팔은 가슴 앞에 둡니다.\n엉덩이를 편 채 몸을 앞으로 천천히 기울이며 최대한 버티며 내려갑니다.\n바닥을 짚어 몸을 받친 뒤 손으로 밀어 돌아옵니다.\n안전 팁: 햄스트링 부담이 크므로 내려가는 속도를 조절하고 처음엔 보조 도구를 쓰세요.","hamstrings",[],"leg_curl","bodyweight"),
  ex("machine_standing_calf_raise","스탠딩 카프 레이즈","하체","종아리","머신","weight_reps",["카프 레이즈","카프","Standing Calf Raise"],"어깨 패드 아래에 서서 발볼을 발판 가장자리에 올립니다.\n무릎을 거의 편 채 몸을 곧게 세웁니다.\n뒤꿈치를 최대한 높이 들어 올려 종아리를 수축합니다.\n천천히 뒤꿈치를 내려 종아리를 늘려 돌아옵니다.\n안전 팁: 무릎을 굽히지 말고 반동 없이 전 가동범위를 사용하세요.","calves",[],"calf","machine"),
  ex("machine_seated_calf_raise","시티드 카프 레이즈","하체","종아리","머신","weight_reps",["Seated Calf Raise"],"시트에 앉아 발볼을 발판에 올리고 무릎 위에 패드를 맞춥니다.\n안전 걸쇠를 풀고 뒤꿈치를 아래로 내립니다.\n발끝으로 밀어 뒤꿈치를 최대한 높이 올립니다.\n잠시 멈춘 뒤 천천히 내려 돌아옵니다.\n안전 팁: 무릎 패드 위치를 확인하고 발이 미끄러지지 않게 하세요.","calves",[],"calf","machine"),
  ex("machine_leg_press_calf_raise","레그프레스 카프 레이즈","하체","종아리","머신","weight_reps",["레그프레스 카프","Leg Press Calf Raise"],"레그 프레스에 앉아 발볼만 발판 아래쪽에 올립니다.\n다리를 거의 편 채 안전 걸쇠를 풉니다.\n발끝으로 발판을 밀어 뒤꿈치를 들어 올립니다.\n천천히 뒤꿈치를 내려 종아리를 늘려 돌아옵니다.\n안전 팁: 무릎을 완전히 잠그지 말고 발이 발판에서 미끄러지지 않게 하세요.","calves",[],"calf","machine"),
  ex("dumbbell_calf_raise","덤벨 카프 레이즈","하체","종아리","덤벨","weight_reps",["Dumbbell Calf Raise"],"덤벨을 양손이나 한 손에 들고 발볼을 낮은 단이나 판 위에 올려 섭니다.\n상체를 곧게 세우고 무릎을 거의 편 채 시작합니다.\n뒤꿈치를 최대한 높이 들어 올립니다.\n천천히 내려 종아리를 늘려 돌아옵니다.\n안전 팁: 균형이 어려우면 한 손으로 벽이나 기둥을 잡으세요.","calves",[],"calf","dumbbell"),
  ex("barbell_calf_raise","바벨 카프 레이즈","하체","종아리","바벨","weight_reps",["Barbell Calf Raise"],"바를 등 상부에 얹고 발볼을 낮은 단이나 판 위에 올려 섭니다.\n상체를 곧게 세우고 무릎을 거의 편 채 시작합니다.\n뒤꿈치를 최대한 높이 들어 올립니다.\n천천히 내려 종아리를 늘려 돌아옵니다.\n안전 팁: 랙 가까이에서 수행해 균형을 잃을 때 바를 안전하게 내려놓을 수 있게 하세요.","calves",[],"calf","barbell"),
  ex("smith_calf_raise","스미스 카프 레이즈","하체","종아리","스미스","weight_reps",["Smith Calf Raise"],"스미스 머신 바 아래에서 바를 등 상부에 얹고 발볼을 낮은 단 위에 둡니다.\n걸쇠를 풀고 무릎을 거의 편 채 섭니다.\n뒤꿈치를 높이 들어 올려 종아리를 수축합니다.\n천천히 내려 종아리를 늘려 돌아옵니다.\n안전 팁: 단 위 발 위치를 안정되게 하고 마친 뒤 걸쇠를 확실히 걸어 두세요.","calves",[],"calf","smith"),
  ex("bodyweight_single_leg_calf_raise","싱글 레그 카프 레이즈","하체","종아리","맨몸","reps",["한발 카프 레이즈","Single-leg Calf Raise"],"단이나 계단 가장자리에 한 발 발볼을 올려 서고 다른 발은 뒤로 접습니다.\n한 손으로 벽이나 난간을 잡아 균형을 잡습니다.\n뒤꿈치를 최대한 높이 들어 올립니다.\n천천히 내려 뒤꿈치를 단 아래로 늘려 돌아옵니다.\n안전 팁: 난간을 잡고 발이 미끄러지지 않는 신발을 신으세요.","calves",[],"calf","bodyweight"),
  ex("machine_donkey_calf_raise","동키 카프 레이즈","하체","종아리","머신","weight_reps",["도키 카프 레이즈","Donkey Calf Raise"],"머신에 허리를 숙여 엉덩이 패드를 허리 아래에 대고 발볼을 발판에 둡니다.\n손잡이를 잡고 무릎을 거의 편 채 섭니다.\n뒤꿈치를 최대한 높이 들어 올립니다.\n천천히 내려 종아리를 충분히 늘려 돌아옵니다.\n안전 팁: 허리가 둥글어지지 않게 하고 패드 위치를 허리 아래에 안정되게 맞추세요.","calves",[],"calf","machine"),
  ex("bodyweight_tibialis_raise","티비얼리스 레이즈","하체","종아리","맨몸","reps",["정강이 레이즈","티비알리스","Tibialis Raise"],"벽에 등을 기대고 발을 앞으로 한 걸음 내밀어 뒤꿈치만 바닥에 둡니다.\n무릎을 약간 굽혀 몸을 안정시킵니다.\n발끝을 정강이 쪽으로 최대한 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 정강이에 통증이 있으면 횟수를 줄이고 천천히 부하를 늘리세요.","calves",[],"calf","bodyweight"),
  ex("bodyweight_crunch","크런치","복근","복근","맨몸","reps",["윗배","Crunch"],"바닥에 누워 무릎을 굽히고 발을 바닥에 둡니다.\n손은 가슴 앞에 두거나 귀 옆에 가볍게 댑니다.\n복부를 말듯이 어깨뼈가 바닥에서 뜰 정도로 상체를 들어 올립니다.\n정상에서 복부를 조인 뒤 천천히 내립니다.\n안전 팁: 목을 당기지 말고 시선은 천장을 향하게 하세요.","abs",[],"crunch","bodyweight"),
  ex("bodyweight_reverse_crunch","리버스 크런치","복근","복근","맨몸","reps",["아랫배","Reverse Crunch"],"바닥에 누워 무릎을 굽혀 가슴 쪽으로 당기고 팔은 몸 옆에 둡니다.\n복부에 힘을 주고 허리를 바닥에 붙입니다.\n골반을 말아 올리며 무릎을 가슴 쪽으로 가져옵니다.\n천천히 골반을 내려 시작 자세로 돌아갑니다.\n안전 팁: 다리 반동을 쓰지 말고 복부 힘으로 골반을 들어 올리세요.","abs",[],"crunch","bodyweight"),
  ex("bodyweight_sit_up","싯업","복근","복근","맨몸","reps",["윗몸일으키기","Sit-up"],"바닥에 누워 무릎을 굽히고 발을 바닥에 둡니다.\n손은 가슴 앞에 교차하거나 귀 옆에 가볍게 댑니다.\n복부 힘으로 상체를 말아 올려 앉은 자세까지 일어납니다.\n천천히 등을 바닥에 붙이며 내려갑니다.\n안전 팁: 목을 잡아당기지 말고 허리가 아프면 가동범위를 줄이세요.","abs",[],"crunch","bodyweight"),
  ex("bodyweight_leg_raise","레그 레이즈","복근","복근","맨몸","reps",["라잉 레그 레이즈","Leg Raise"],"바닥에 누워 다리를 곧게 펴고 손은 몸 옆이나 엉덩이 아래에 둡니다.\n복부에 힘을 주고 허리를 바닥에 붙입니다.\n다리를 곧게 편 채 수직에 가깝게 들어 올립니다.\n허리가 뜨기 직전까지 천천히 내려 돌아옵니다.\n안전 팁: 허리가 바닥에서 뜨면 무릎을 굽히거나 다리를 높은 위치에서 멈추세요.","abs",[],"hang_raise","bodyweight"),
  ex("bodyweight_hanging_leg_raise","행잉 레그 레이즈","복근","복근","맨몸","reps",["철봉 레그 레이즈","철봉","Hanging Leg Raise"],"철봉을 어깨너비보다 약간 넓게 잡고 몸을 곧게 매달립니다.\n어깨를 아래로 당겨 고정하고 복부에 힘을 줍니다.\n다리를 곧게 편 채 골반을 말아 올리며 허리 높이 이상까지 들어 올립니다.\n반동 없이 천천히 내려 흔들림을 멈춘 뒤 반복합니다.\n안전 팁: 몸이 흔들리면 허리와 어깨에 부담이 가므로 세트 사이에 완전히 멈추고, 그립이 풀리지 않도록 스트랩을 활용하세요.","abs",[],"hang_raise","bodyweight"),
  ex("bodyweight_hanging_knee_raise","행잉 니 레이즈","복근","복근","맨몸","reps",["철봉 니 레이즈","철봉","Hanging Knee Raise"],"철봉을 어깨너비로 잡고 어깨를 내린 채 매달립니다.\n복부에 힘을 주고 무릎을 굽혀 가슴 쪽으로 끌어올립니다.\n골반을 살짝 말아 올려 아랫배가 수축되는 것을 느낍니다.\n무릎을 천천히 내려 몸이 흔들리지 않게 시작 자세로 돌아갑니다.\n안전 팁: 다리를 내릴 때 반동을 쓰지 말고, 손바닥이 아프면 장갑이나 스트랩을 사용하세요.","abs",[],"hang_raise","bodyweight"),
  ex("bodyweight_knee_raise","니 레이즈","복근","복근","맨몸","reps",["딥스바 니 레이즈","캡틴스 체어","딥스바","Knee Raise"],"딥스바 위에서 팔꿈치를 펴 몸을 지지하고 등을 패드나 바에 붙입니다.\n어깨를 내리고 다리를 아래로 자연스럽게 늘어뜨립니다.\n복부에 힘을 주며 무릎을 가슴 쪽으로 끌어올립니다.\n골반을 말아 올린 뒤 천천히 다리를 내려 시작 자세로 돌아갑니다.\n안전 팁: 어깨가 귀 쪽으로 올라가지 않게 하고, 허리가 과하게 꺾이지 않도록 주의하세요.","abs",[],"hang_raise","bodyweight"),
  ex("bodyweight_l_sit","L-sit","복근","복근","맨몸","duration",["엘싯","L싯","딥스바","L-sit"],"딥스바나 바닥의 손잡이를 잡고 팔꿈치를 펴 몸을 들어 올립니다.\n어깨를 아래로 눌러 몸을 지지하고 가슴을 펍니다.\n무릎을 편 채 다리를 앞으로 뻗어 바닥과 평행하게 만듭니다.\n호흡을 유지하며 정해진 시간 동안 자세를 버틴 뒤 천천히 내려옵니다.\n안전 팁: 다리가 유지되지 않으면 무릎을 굽힌 버전부터 시작하고, 손목에 통증이 있으면 즉시 중단하세요.","abs",["triceps"],"hang_raise","bodyweight"),
  ex("bodyweight_flutter_kicks","플러터 킥","복근","복근","맨몸","reps",["발차기 복근","Flutter Kicks"],"매트에 누워 손바닥을 엉덩이 아래에 두고 허리를 바닥에 붙입니다.\n두 다리를 곧게 펴 바닥에서 약간 띄웁니다.\n다리를 번갈아 위아래로 짧고 빠르게 차 올립니다.\n복부 긴장을 유지하며 정해진 횟수만큼 리듬을 지속합니다.\n안전 팁: 허리가 뜨면 다리 높이를 올리거나 범위를 줄이고, 목에 힘이 들어가지 않게 하세요.","abs",[],"crunch","bodyweight"),
  ex("bodyweight_bicycle_crunch","바이시클 크런치","복근","복근","맨몸","reps",["자전거 크런치","Bicycle Crunch"],"매트에 누워 손을 귀 옆에 가볍게 대고 다리를 들어 무릎을 굽힙니다.\n상체를 말아 어깨를 바닥에서 띄웁니다.\n한쪽 팔꿈치를 반대쪽 무릎으로 가져가며 반대 다리는 곧게 뻗습니다.\n좌우를 번갈아 천천히 통제하며 반복합니다.\n안전 팁: 목을 손으로 당기지 말고 복부의 힘으로 몸통을 회전하세요.","abs",[],"crunch","bodyweight"),
  ex("bodyweight_russian_twist","러시안 트위스트","복근","복근","맨몸","reps",["원판 트위스트","Russian Twist"],"바닥에 앉아 무릎을 굽히고 상체를 뒤로 45도쯤 기울입니다.\n발을 바닥에 두거나 띄우고 양손을 가슴 앞에 모읍니다.\n가슴과 어깨를 함께 돌려 손을 한쪽 옆 바닥 가까이로 보냅니다.\n중앙을 지나 반대쪽으로 회전하며 좌우를 번갈아 반복합니다.\n안전 팁: 등을 둥글게 말지 말고 가슴을 편 채, 허리가 불편하면 발을 바닥에 두세요.","abs",[],"twist","bodyweight"),
  ex("bodyweight_plank","플랭크","복근","복근","맨몸","duration",["Plank"],"팔꿈치를 어깨 바로 아래에 두고 전완을 바닥에 댑니다.\n발끝으로 지지하며 머리부터 발끝까지 일직선을 만듭니다.\n복부와 엉덩이에 힘을 주고 시선은 바닥을 향합니다.\n호흡을 멈추지 않고 정해진 시간 동안 자세를 유지합니다.\n안전 팁: 허리가 처지거나 엉덩이가 솟으면 시간을 줄이고 자세가 무너지기 전에 내려오세요.","abs",[],"plank","bodyweight"),
  ex("bodyweight_side_plank","사이드 플랭크","복근","복근","맨몸","duration",["옆 플랭크","Side Plank"],"옆으로 누워 팔꿈치를 어깨 바로 아래에 두고 다리를 겹쳐 쌓습니다.\n골반을 들어 올려 머리부터 발끝까지 일직선을 만듭니다.\n옆구리와 엉덩이에 힘을 주고 어깨가 처지지 않게 밀어냅니다.\n정해진 시간 동안 버틴 뒤 천천히 내려오고 반대쪽도 같은 시간 수행합니다.\n안전 팁: 어깨에 통증이 있으면 무릎을 바닥에 대는 쉬운 버전으로 하세요.","abs",[],"plank","bodyweight"),
  ex("bodyweight_mountain_climber","마운틴 클라이머","복근","복근","맨몸","reps",["마운틴클라이머","Mountain Climbers"],"손을 어깨 아래에 두고 팔굽혀펴기 자세로 몸을 곧게 만듭니다.\n복부에 힘을 주고 엉덩이가 올라가지 않게 고정합니다.\n한쪽 무릎을 가슴 쪽으로 빠르게 끌어당깁니다.\n다리를 번갈아 달리듯 리듬감 있게 반복합니다.\n안전 팁: 손목과 어깨가 무너지지 않게 속도를 조절하고, 숨이 차면 천천히 걷듯이 수행하세요.","abs",["shoulders"],"plank","bodyweight"),
  ex("bodyweight_dead_bug","데드버그","복근","복근","맨몸","reps",["데드 버그","Dead Bug"],"매트에 누워 팔을 천장으로 뻗고 무릎을 90도로 굽혀 들어 올립니다.\n허리를 바닥에 눌러 붙이고 복부에 힘을 줍니다.\n한쪽 팔과 반대쪽 다리를 천천히 바닥 가까이로 뻗습니다.\n허리가 뜨기 전에 멈추고 시작 자세로 돌아와 반대편도 반복합니다.\n안전 팁: 허리가 바닥에서 뜨면 움직임 범위를 줄이고 호흡을 참지 마세요.","abs",[],"crunch","bodyweight"),
  ex("ab_wheel_rollout","AB 롤아웃","복근","복근","기타","reps",["ab 롤아웃","복근 롤러","휠 롤아웃","ab 슬라이드","Ab Wheel Rollout"],"무릎을 매트에 대고 양손으로 롤러 손잡이를 어깨 아래에 잡습니다.\n복부에 힘을 주고 등을 살짝 둥글게 말아 고정합니다.\n롤러를 앞으로 천천히 밀며 몸을 길게 늘립니다.\n허리가 꺾이기 전에 복부 힘으로 롤러를 당겨 시작 자세로 돌아옵니다.\n안전 팁: 허리가 처지지 않는 범위까지만 내려가고, 초보자는 벽 앞에서 짧은 거리부터 시작하세요.","abs",["shoulders"],"crunch","other"),
  ex("cable_crunch","케이블 크런치","복근","복근","케이블","weight_reps",["로프 크런치","Cable Crunch"],"케이블 높은 위치에 로프를 걸고 무릎을 꿇어 로프를 머리 양옆으로 잡습니다.\n엉덩이를 뒤꿈치 위에 두고 고관절 위치를 고정합니다.\n복부를 수축하며 등을 말아 팔꿈치를 무릎 쪽으로 내립니다.\n끝에서 잠시 멈춘 뒤 천천히 상체를 펴 시작 자세로 돌아갑니다.\n안전 팁: 팔로 당기지 말고 복부로 움직이며, 허리가 과하게 젖혀지지 않게 하세요.","abs",[],"crunch","cable"),
  ex("cable_woodchopper","케이블 우드초퍼","복근","복근","케이블","weight_reps",["우드찹","우드 촙","Cable Woodchopper"],"케이블 높은 위치에 손잡이를 걸고 옆으로 서서 두 손으로 잡습니다.\n발을 어깨너비로 벌리고 복부에 힘을 줍니다.\n몸통을 회전하며 손잡이를 대각선 아래 반대쪽 무릎 옆으로 당깁니다.\n팔보다 몸통을 쓰며 천천히 시작 자세로 돌아갑니다.\n안전 팁: 허리가 아닌 몸통과 고관절로 회전하고, 무게는 통제 가능한 수준으로 선택하세요.","abs",["shoulders"],"twist","cable"),
  ex("cable_pallof_press","팔로프 프레스","복근","복근","케이블","weight_reps",["팔로프","Pallof Press"],"케이블을 가슴 높이에 두고 옆으로 서서 손잡이를 가슴 앞에 잡습니다.\n발을 어깨너비로 벌리고 복부와 엉덩이에 힘을 줍니다.\n손잡이를 가슴 앞에서 몸통 정면으로 곧게 밀어냅니다.\n케이블이 몸을 돌리려는 힘을 버티며 잠시 멈춘 뒤 가슴으로 되돌립니다.\n안전 팁: 몸통이 케이블 쪽으로 회전하지 않게 하고, 호흡을 유지하세요.","abs",[],"twist","cable"),
  ex("machine_ab_crunch","복근 머신 크런치","복근","복근","머신","weight_reps",["머신 크런치","앱 크런치 머신","Abdominal Crunch Machine"],"머신에 앉아 좌석 높이를 조절하고 손잡이나 패드를 잡습니다.\n발을 고정하고 등을 패드에 붙입니다.\n복부를 수축하며 상체를 앞으로 말아 내립니다.\n끝에서 잠시 멈추고 천천히 복부 긴장을 유지하며 돌아갑니다.\n안전 팁: 팔이나 다리로 밀지 말고 복부로만 움직이며, 목에 힘을 빼세요.","abs",[],"crunch","machine"),
  ex("roman_chair_sit_up","로만 체어 싯업","복근","복근","기타","reps",["로만체어 싯업","Roman Chair Sit-up"],"로만 체어에 앉아 발을 고정 패드 아래에 걸고 엉덩이를 패드 끝에 둡니다.\n팔을 가슴 앞에 모으고 복부에 힘을 줍니다.\n상체를 뒤로 천천히 내려 몸통이 거의 수평이 되게 합니다.\n복부로 상체를 말아 올려 시작 자세로 돌아옵니다.\n안전 팁: 고관절 굴곡근으로만 올라오지 않게 하고, 허리를 과하게 젖히지 마세요.","abs",[],"crunch","other"),
  ex("barbell_curl","바벨 컬","팔","이두","바벨","weight_reps",["바벨컬","이두","Barbell Curl"],"바벨을 어깨너비로 언더그립으로 잡고 팔을 펴 몸 앞에 둡니다.\n팔꿈치를 옆구리에 붙이고 가슴을 펴 서 있습니다.\n팔꿈치를 고정한 채 바벨을 어깨 쪽으로 말아 올립니다.\n위에서 이두근을 조인 뒤 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 몸을 흔들어 반동을 쓰지 말고, 손목이 꺾이지 않게 곧게 유지하세요.","biceps",["forearms"],"curl","barbell"),
  ex("barbell_straight_bar_curl","스트레이트 바 컬","팔","이두","바벨","weight_reps",["스트레이트바 컬","Straight Bar Curl"],"일자 바를 어깨너비로 언더그립으로 잡고 팔을 펴 선 자세를 만듭니다.\n팔꿈치를 몸통에 붙이고 어깨를 내립니다.\n바를 가슴 높이까지 반원을 그리며 말아 올립니다.\n정점에서 잠시 멈추고 천천히 통제하며 내립니다.\n안전 팁: 손목이 불편하면 EZ바로 바꾸고, 허리를 젖히지 않게 하세요.","biceps",["forearms"],"curl","barbell"),
  ex("ez_bar_curl","EZ바 컬","팔","이두","바벨","weight_reps",["이지바 컬","EZ 컬","EZ Bar Curl"],"EZ바의 굽은 부분 안쪽을 언더그립으로 잡고 팔을 펴 서 있습니다.\n팔꿈치를 옆구리에 붙이고 복부에 힘을 줍니다.\n팔꿈치를 고정한 채 바를 어깨 쪽으로 말아 올립니다.\n천천히 내려 팔을 완전히 편 뒤 반복합니다.\n안전 팁: 상체를 뒤로 젖혀 올리지 말고 중량을 낮춰 정확한 자세를 유지하세요.","biceps",["forearms"],"curl","ez_bar"),
  ex("barbell_wide_grip_curl","와이드그립 컬","팔","이두","바벨","weight_reps",["와이드 컬","Wide-grip Curl"],"바벨을 어깨너비보다 넓게 언더그립으로 잡고 팔을 펴 서 있습니다.\n팔꿈치를 몸통 옆에 두고 가슴을 펍니다.\n바를 어깨 쪽으로 말아 올리며 이두근 바깥쪽을 수축합니다.\n정점에서 멈춘 뒤 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 손목에 부담이 크므로 너무 넓게 잡지 말고 가벼운 중량으로 시작하세요.","biceps",[],"curl","barbell"),
  ex("barbell_close_grip_curl","클로즈그립 컬","팔","이두","바벨","weight_reps",["내로우 컬","Close-grip Curl"],"바벨을 어깨너비보다 좁게 언더그립으로 잡고 팔을 펴 서 있습니다.\n팔꿈치를 몸통에 붙이고 어깨를 고정합니다.\n바를 가슴 쪽으로 말아 올리며 이두근 안쪽을 수축합니다.\n천천히 내려 팔을 완전히 폅니다.\n안전 팁: 손목이 꺾이지 않게 곧게 유지하고, 반동 없이 가벼운 중량부터 하세요.","biceps",[],"curl","barbell"),
  ex("dumbbell_curl","덤벨 컬","팔","이두","덤벨","weight_reps",["덤벨컬","Dumbbell Curl"],"양손에 덤벨을 들고 손바닥이 앞을 향하게 팔을 내립니다.\n팔꿈치를 옆구리에 붙이고 가슴을 펴 서 있습니다.\n두 덤벨을 어깨 쪽으로 동시에 말아 올립니다.\n정점에서 수축한 뒤 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 상체를 흔들지 말고, 내릴 때도 중량을 통제해 팔꿈치를 보호하세요.","biceps",["forearms"],"curl","dumbbell"),
  ex("dumbbell_alternating_curl","얼터네이트 덤벨 컬","팔","이두","덤벨","weight_reps",["얼터 컬","교차 덤벨 컬","Alternating Dumbbell Curl"],"양손에 덤벨을 들고 손바닥이 앞을 향하게 서서 팔을 내립니다.\n팔꿈치를 몸통에 붙이고 복부에 힘을 줍니다.\n한쪽 덤벨을 어깨 쪽으로 말아 올리고 정점에서 잠시 멈춥니다.\n천천히 내린 뒤 반대쪽 팔로 같은 동작을 반복합니다.\n안전 팁: 올리는 팔의 반대 어깨가 기울지 않게 몸통을 곧게 유지하세요.","biceps",["forearms"],"curl","dumbbell"),
  ex("dumbbell_hammer_curl","해머 컬","팔","이두","덤벨","weight_reps",["덤벨 해머 컬","해머","Hammer Curl"],"덤벨을 손바닥이 몸쪽을 향하는 뉴트럴 그립으로 잡고 팔을 내립니다.\n팔꿈치를 옆구리에 고정하고 어깨를 내립니다.\n그립을 유지한 채 덤벨을 어깨 쪽으로 말아 올립니다.\n정점에서 멈춘 뒤 천천히 시작 자세로 내립니다.\n안전 팁: 손목을 돌리지 말고 몸통을 흔들지 않도록 중량을 조절하세요.","biceps",["forearms"],"curl","dumbbell"),
  ex("dumbbell_cross_body_hammer_curl","크로스바디 해머 컬","팔","이두","덤벨","weight_reps",["크로스 해머 컬","Cross-body Hammer Curl"],"덤벨을 뉴트럴 그립으로 잡고 팔을 몸 옆에 내립니다.\n서서 가슴을 펴고 팔꿈치를 몸통에 가까이 둡니다.\n한쪽 덤벨을 반대쪽 어깨를 향해 가슴 앞으로 말아 올립니다.\n천천히 내려 시작 자세로 돌아오고 반대쪽도 반복합니다.\n안전 팁: 몸통을 회전시키지 말고 팔꿈치 위치를 고정하세요.","biceps",["forearms"],"curl","dumbbell"),
  ex("dumbbell_incline_curl","인클라인 덤벨 컬","팔","이두","덤벨","weight_reps",["인클라인 컬","Incline Dumbbell Curl"],"각도를 55~60도로 세운 인클라인 벤치에 등을 기대고 덤벨을 아래로 늘어뜨립니다.\n어깨를 벤치에 붙이고 손바닥은 앞을 향하게 합니다.\n팔꿈치를 몸 뒤에 둔 채 덤벨을 어깨 쪽으로 말아 올립니다.\n천천히 내려 이두근이 늘어난 상태까지 돌아갑니다.\n안전 팁: 처음엔 가벼운 중량으로 시작하고 어깨가 앞으로 말리지 않게 하세요.","biceps",[],"curl","dumbbell"),
  ex("dumbbell_concentration_curl","컨센트레이션 컬","팔","이두","덤벨","weight_reps",["컨센 컬","Concentration Curl"],"벤치에 앉아 다리를 벌리고 한 손에 덤벨을 듭니다.\n같은 쪽 팔꿈치 뒤쪽을 허벅지 안쪽에 대고 팔을 펍니다.\n팔꿈치를 고정한 채 덤벨을 어깨 쪽으로 말아 올립니다.\n정점에서 수축한 뒤 천천히 내리고 반대쪽도 반복합니다.\n안전 팁: 상체를 일으키며 반동을 쓰지 말고 팔만으로 올리세요.","biceps",[],"curl","dumbbell"),
  ex("ez_bar_preacher_curl","프리처 컬","팔","이두","바벨","weight_reps",["프리쳐 컬","스캇 컬","Preacher Curl"],"프리처 벤치에 앉아 겨드랑이를 패드 상단에 맞추고 팔을 올립니다.\nEZ바를 언더그립으로 잡고 팔을 거의 펴 시작합니다.\n바를 어깨 쪽으로 말아 올려 이두근을 수축합니다.\n천천히 내려 팔꿈치를 완전히 펴기 직전까지 돌아갑니다.\n안전 팁: 바닥에서 팔꿈치를 급히 펴면 힘줄에 무리가 가므로 천천히 내리세요.","biceps",[],"curl","ez_bar"),
  ex("barbell_spider_curl","스파이더 컬","팔","이두","바벨","weight_reps",["Spider Curl"],"인클라인 벤치에 가슴을 대고 엎드려 바벨을 언더그립으로 잡습니다.\n팔을 벤치 앞으로 늘어뜨리고 팔꿈치를 몸에서 수직으로 둡니다.\n팔꿈치를 고정한 채 바를 어깨 쪽으로 말아 올립니다.\n정점에서 수축한 뒤 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 시작 전 바를 안전하게 잡고, 중량은 가볍게 시작하세요.","biceps",[],"curl","barbell"),
  ex("barbell_reverse_curl","리버스 컬","팔","전완","바벨","weight_reps",["리버스 그립 컬","EZ바 리버스 컬","Reverse Curl"],"바벨이나 EZ바를 어깨너비로 오버그립으로 잡고 팔을 폅니다.\n팔꿈치를 옆구리에 붙이고 손목을 곧게 유지합니다.\n그립을 유지한 채 바를 어깨 쪽으로 말아 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 손목이 꺾이면 부상 위험이 있으므로 가벼운 중량으로 시작하세요.","forearms",["biceps"],"curl","barbell"),
  ex("cable_curl","케이블 컬","팔","이두","케이블","weight_reps",["Cable Curl"],"케이블 낮은 위치에 바를 걸고 마주 서서 언더그립으로 잡습니다.\n팔꿈치를 옆구리에 붙이고 가슴을 폅니다.\n바를 어깨 쪽으로 말아 올려 이두근을 수축합니다.\n케이블 장력을 유지하며 천천히 내립니다.\n안전 팁: 몸을 뒤로 젖히지 않고 케이블 장력을 끝까지 유지하세요.","biceps",[],"curl","cable"),
  ex("cable_rope_hammer_curl","로프 해머 컬","팔","이두","케이블","weight_reps",["케이블 해머 컬","Rope Hammer Curl"],"케이블 낮은 위치에 로프를 걸고 뉴트럴 그립으로 양쪽을 잡습니다.\n팔꿈치를 몸통에 붙이고 가슴을 펍니다.\n로프를 어깨 쪽으로 말아 올리며 끝에서 손을 바깥으로 벌립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 팔꿈치가 앞으로 밀리지 않게 하고 반동을 피하세요.","biceps",["forearms"],"curl","cable"),
  ex("cable_one_arm_curl","원암 케이블 컬","팔","이두","케이블","weight_reps",["Single-arm Cable Curl"],"케이블 낮은 위치에 손잡이를 걸고 한 손으로 잡고 옆으로 섭니다.\n팔꿈치를 옆구리에 붙이고 몸통을 곧게 세웁니다.\n손잡이를 어깨 쪽으로 말아 올려 이두근을 수축합니다.\n천천히 내려 장력을 유지한 채 반복하고 반대쪽도 수행합니다.\n안전 팁: 몸통이 회전하거나 기울어지지 않게 하세요.","biceps",[],"curl","cable"),
  ex("cable_high_curl","하이 케이블 컬","팔","이두","케이블","weight_reps",["케이블 하이 컬","High Cable Curl"],"양쪽 케이블을 머리 높이로 올리고 가운데에 서서 손잡이를 한 손씩 잡습니다.\n팔을 옆으로 벌려 어깨 높이로 유지합니다.\n팔꿈치를 고정한 채 손잡이를 귀 쪽으로 당겨 말아 올립니다.\n이두근을 조인 뒤 천천히 팔을 펴 돌아갑니다.\n안전 팁: 팔꿈치가 처지지 않게 어깨 높이를 유지하고 가볍게 시작하세요.","biceps",[],"curl","cable"),
  ex("machine_biceps_curl","머신 바이셉스 컬","팔","이두","머신","weight_reps",["머신 컬","Machine Biceps Curl"],"머신에 앉아 좌석 높이를 조절해 팔꿈치가 회전축과 맞게 합니다.\n겨드랑이를 패드에 붙이고 손잡이를 잡습니다.\n손잡이를 어깨 쪽으로 말아 올려 이두근을 수축합니다.\n천천히 내려 장력을 유지하며 시작 자세로 돌아갑니다.\n안전 팁: 끝에서 팔을 급히 펴지 않고 어깨가 들리지 않게 하세요.","biceps",[],"curl","machine"),
  ex("barbell_close_grip_bench_press","클로즈그립 벤치프레스","팔","삼두","바벨","weight_reps",["클로즈 벤치","CGBP","Close-grip Bench Press"],"벤치에 누워 어깨너비 또는 약간 좁게 바벨을 오버그립으로 잡습니다.\n견갑을 모으고 발을 바닥에 고정한 채 바를 들어 올립니다.\n팔꿈치를 몸통 가까이 두고 바를 가슴 아래쪽으로 내립니다.\n삼두근 힘으로 바를 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 너무 좁게 잡으면 손목에 부담이 크므로 어깨너비 정도로 잡고 보조자를 활용하세요.","triceps",["chest"],"bench","barbell"),
  ex("ez_bar_skull_crusher","스컬크러셔","팔","삼두","바벨","weight_reps",["스컬 크러셔","EZ바 익스텐션","Skull Crusher"],"벤치에 누워 EZ바를 좁게 오버그립으로 잡고 팔을 가슴 위로 폅니다.\n상완을 바닥과 수직으로 고정합니다.\n팔꿈치만 굽혀 바를 이마 뒤쪽으로 천천히 내립니다.\n삼두근 힘으로 바를 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 중량은 가볍게 시작하고 가능하면 보조자와 함께 하세요.","triceps",[],"lying_ext","ez_bar"),
  ex("barbell_lying_triceps_extension","라잉 트라이셉스 익스텐션","팔","삼두","바벨","weight_reps",["라잉 익스텐션","Lying Triceps Extension"],"벤치에 누워 바벨을 어깨너비보다 좁게 잡고 가슴 위로 팔을 폅니다.\n상완을 고정하고 팔꿈치가 벌어지지 않게 합니다.\n팔꿈치를 굽혀 바를 머리 뒤쪽으로 천천히 내립니다.\n삼두근으로 바를 밀어 올려 시작 자세로 돌아갑니다.\n안전 팁: 바가 얼굴 위를 지나므로 통제 가능한 중량을 쓰고 보조자를 두세요.","triceps",[],"lying_ext","barbell"),
  ex("dumbbell_overhead_triceps_extension","오버헤드 익스텐션","팔","삼두","덤벨","weight_reps",["덤벨 오버헤드 익스텐션","트라이셉스 익스텐션","Overhead Triceps Extension"],"양손으로 덤벨 한쪽 끝을 감싸 잡고 머리 위로 팔을 폅니다.\n팔꿈치를 귀 옆에 두고 복부에 힘을 줍니다.\n팔꿈치를 굽혀 덤벨을 머리 뒤로 천천히 내립니다.\n삼두근으로 팔을 펴 시작 자세로 돌아갑니다.\n안전 팁: 팔꿈치가 벌어지지 않게 하고 허리를 과하게 젖히지 마세요.","triceps",[],"overhead_ext","dumbbell"),
  ex("dumbbell_one_arm_triceps_extension","원암 덤벨 익스텐션","팔","삼두","덤벨","weight_reps",["원암 오버헤드 익스텐션","Single-arm Dumbbell Extension"],"한 손에 덤벨을 들고 머리 위로 팔을 폅니다.\n반대 손으로 상완을 받쳐 팔꿈치를 고정합니다.\n팔꿈치를 굽혀 덤벨을 머리 뒤쪽으로 천천히 내립니다.\n삼두근으로 팔을 펴 올리고 반대쪽도 수행합니다.\n안전 팁: 덤벨이 머리와 가까우므로 가벼운 중량으로 하고 손목을 곧게 유지하세요.","triceps",[],"overhead_ext","dumbbell"),
  ex("dumbbell_triceps_kickback","덤벨 킥백","팔","삼두","덤벨","weight_reps",["트라이셉스 킥백","삼두 킥백","Dumbbell Kickback"],"한 손에 덤벨을 들고 상체를 숙여 반대 손을 벤치나 무릎에 짚습니다.\n상완을 몸통에 붙이고 바닥과 평행하게 고정합니다.\n팔꿈치를 굽혀 시작한 뒤 팔을 뒤로 완전히 폅니다.\n삼두근을 수축한 뒤 천천히 팔꿈치를 굽혀 돌아갑니다.\n안전 팁: 허리를 둥글게 말지 말고 중량은 가볍게 하세요.","triceps",[],"pushdown","dumbbell"),
  ex("cable_pushdown","케이블 푸쉬다운","팔","삼두","케이블","weight_reps",["푸시다운","케이블 푸시다운","삼두","Cable Pushdown"],"케이블 높은 위치에 손잡이를 걸고 마주 서서 손잡이를 잡습니다.\n팔꿈치를 옆구리에 붙이고 상체를 살짝 숙입니다.\n팔꿈치를 고정한 채 손잡이를 허벅지 쪽으로 눌러 팔을 폅니다.\n삼두근을 수축한 뒤 천천히 시작 자세로 돌아갑니다.\n안전 팁: 팔꿈치가 앞뒤로 흔들리지 않게 하고 어깨를 으쓱하지 마세요.","triceps",[],"pushdown","cable"),
  ex("cable_rope_pushdown","로프 푸쉬다운","팔","삼두","케이블","weight_reps",["로프 푸시다운","Rope Pushdown"],"케이블 높은 위치에 로프를 걸고 양쪽 끝을 잡고 섭니다.\n팔꿈치를 옆구리에 붙이고 상체를 살짝 숙입니다.\n로프를 아래로 눌러 팔을 폅니다.\n끝에서 로프를 양옆으로 벌려 삼두근을 조이고 천천히 돌아갑니다.\n안전 팁: 반동을 쓰지 않고 팔꿈치 위치를 고정하세요.","triceps",[],"pushdown","cable"),
  ex("cable_bar_pushdown","바 푸쉬다운","팔","삼두","케이블","weight_reps",["바 푸시다운","Bar Pushdown"],"케이블 높은 위치에 직선 바를 걸고 오버그립으로 어깨너비로 잡습니다.\n팔꿈치를 옆구리에 붙이고 상체를 살짝 숙입니다.\n바를 허벅지 쪽으로 눌러 팔꿈치를 완전히 펍니다.\n삼두근 힘으로 천천히 바를 가슴 높이까지 올려 돌아갑니다.\n안전 팁: 손목을 곧게 유지하고 상체를 흔들어 누르지 마세요.","triceps",[],"pushdown","cable"),
  ex("cable_reverse_grip_pushdown","리버스그립 푸쉬다운","팔","삼두","케이블","weight_reps",["리버스 푸시다운","Reverse-grip Pushdown"],"케이블 높은 위치에 바를 걸고 언더그립으로 어깨너비로 잡습니다.\n팔꿈치를 옆구리에 붙이고 가슴을 폅니다.\n바를 아래로 눌러 팔을 완전히 폅니다.\n천천히 팔꿈치를 굽혀 가슴 높이까지 돌아갑니다.\n안전 팁: 손목과 팔꿈치 부담이 있을 수 있으므로 가벼운 중량으로 시작하세요.","triceps",[],"pushdown","cable"),
  ex("cable_overhead_triceps_extension","오버헤드 케이블 익스텐션","팔","삼두","케이블","weight_reps",["케이블 오버헤드 익스텐션","Overhead Cable Extension"],"케이블 낮은 위치에 로프를 걸고 등을 돌려 서서 머리 뒤에서 로프를 잡습니다.\n한 발을 앞으로 내딛고 팔꿈치를 귀 옆에 모읍니다.\n팔꿈치를 고정한 채 로프를 앞쪽 위로 밀어 팔을 폅니다.\n삼두근이 늘어나도록 천천히 머리 뒤로 돌아갑니다.\n안전 팁: 허리를 과하게 젖히지 않도록 복부에 힘을 주세요.","triceps",[],"overhead_ext","cable"),
  ex("cable_one_arm_triceps_extension","원암 케이블 익스텐션","팔","삼두","케이블","weight_reps",["원암 푸시다운","Single-arm Cable Extension"],"케이블에 손잡이를 걸고 한 손으로 잡아 팔꿈치를 몸 가까이에 둡니다.\n상체를 살짝 숙이고 반대 손으로 몸을 지지합니다.\n팔꿈치를 고정한 채 손잡이를 눌러 팔을 완전히 폅니다.\n삼두근을 수축한 뒤 천천히 돌아가고 반대쪽도 수행합니다.\n안전 팁: 몸통을 비틀지 말고 어깨가 올라가지 않게 하세요.","triceps",[],"overhead_ext","cable"),
  ex("machine_triceps_extension","트라이셉스 머신 익스텐션","팔","삼두","머신","weight_reps",["머신 트라이셉스 익스텐션","Triceps Extension Machine"],"머신에 앉아 좌석 높이를 조절하고 팔꿈치가 회전축과 맞게 합니다.\n등을 등받이에 붙이고 손잡이를 잡습니다.\n팔꿈치를 고정한 채 손잡이를 밀어 팔을 폅니다.\n삼두근을 수축한 뒤 천천히 시작 자세로 돌아갑니다.\n안전 팁: 어깨가 앞으로 말리지 않게 하고 끝에서 팔꿈치를 과신전하지 마세요.","triceps",[],"pushdown","machine"),
  ex("bodyweight_bench_dips","벤치 딥스","팔","삼두","맨몸","reps",["벤치딥스","Bench Dips"],"벤치 끝을 뒤로 잡고 손을 엉덩이 옆에 두며 발은 앞으로 뻗습니다.\n팔을 펴 엉덩이를 벤치 앞으로 빼고 어깨를 내립니다.\n팔꿈치를 뒤로 굽혀 몸을 천천히 아래로 내립니다.\n삼두근으로 밀어 올려 팔을 펴 돌아갑니다.\n안전 팁: 어깨가 앞으로 쏠리지 않게 어깨가 팔꿈치보다 너무 낮아지지 않도록 하세요.","triceps",["chest"],"dip","bodyweight"),
  ex("barbell_wrist_curl","바벨 리스트 컬","팔","전완","바벨","weight_reps",["리스트 컬","손목 컬","Barbell Wrist Curl"],"벤치에 앉아 바벨을 언더그립으로 잡고 전완을 허벅지 위에 올립니다.\n손목이 무릎 밖으로 나오게 하고 바를 손가락 쪽으로 굴려 내립니다.\n손목을 말아 바를 위로 끝까지 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 중량을 가볍게 하고 손목을 급히 꺾지 말고 천천히 움직이세요.","forearms",[],"curl","barbell"),
  ex("dumbbell_wrist_curl","덤벨 리스트 컬","팔","전완","덤벨","weight_reps",["덤벨 손목 컬","Dumbbell Wrist Curl"],"벤치에 앉아 한 손에 덤벨을 언더그립으로 잡고 전완을 허벅지에 올립니다.\n손목을 무릎 밖으로 빼고 덤벨을 손가락 쪽으로 내립니다.\n손목을 말아 덤벨을 위로 들어 올립니다.\n천천히 내리고 반복한 뒤 반대 손도 수행합니다.\n안전 팁: 전완이 들리지 않게 고정하고 가벼운 중량으로 하세요.","forearms",[],"curl","dumbbell"),
  ex("dumbbell_reverse_wrist_curl","리버스 리스트 컬","팔","전완","덤벨","weight_reps",["리버스 손목 컬","Reverse Wrist Curl"],"벤치에 앉아 덤벨을 오버그립으로 잡고 전완을 허벅지에 올립니다.\n손목을 무릎 밖으로 빼고 손등이 위를 향하게 합니다.\n손목을 젖혀 덤벨을 위로 들어 올립니다.\n천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 매우 가벼운 중량으로 시작하고 손목 통증이 있으면 중단하세요.","forearms",[],"curl","dumbbell"),
  ex("dumbbell_farmers_walk","파머스 워크","팔","전완","덤벨","weight_duration",["파머스 캐리","농부 걷기","Farmer's Walk"],"양손에 덤벨을 들고 팔을 몸 옆에 곧게 내립니다.\n가슴을 펴고 어깨를 내리고 복부에 힘을 줍니다.\n보폭을 일정하게 하며 정해진 시간이나 거리만큼 걷습니다.\n멈춘 뒤 덤벨을 천천히 바닥에 내려놓습니다.\n안전 팁: 바닥이 미끄럽지 않은지 확인하고 덤벨을 내려놓을 때 허리를 곧게 유지하세요.","forearms",["traps","abs"],"walk","dumbbell"),
  ex("dumbbell_suitcase_carry","수트케이스 캐리","팔","전완","덤벨","weight_duration",["한손 캐리","Suitcase Carry"],"한 손에 덤벨을 들고 몸 옆에 내려 곧게 섭니다.\n복부에 힘을 주어 몸통이 기울지 않게 합니다.\n일정한 보폭으로 정해진 시간이나 거리만큼 걷습니다.\n멈춘 뒤 덤벨을 내려놓고 손을 바꿔 반복합니다.\n안전 팁: 덤벨 쪽으로 몸이 기울지 않게 버티고 무리한 중량은 피하세요.","forearms",["abs"],"walk","dumbbell"),
  ex("bodyweight_dead_hang","데드 행","팔","전완","맨몸","duration",["매달리기","철봉 매달리기","철봉","Dead Hang"],"철봉을 어깨너비로 오버그립으로 잡고 의자나 점프로 올라갑니다.\n발을 바닥에서 떼고 팔을 곧게 펴 매달립니다.\n어깨를 귀에서 멀어지게 살짝 내리고 복부에 힘을 줍니다.\n호흡을 유지하며 정해진 시간 동안 버틴 뒤 안전하게 내려옵니다.\n안전 팁: 어깨에 통증이 있으면 즉시 내려오고, 내려올 때는 발로 바닥을 먼저 확인하세요.","forearms",["back"],"hang","bodyweight"),
  ex("plate_pinch","플레이트 핀치","팔","전완","기타","weight_duration",["원판 핀치","원판","Plate Pinch"],"원판 두 장을 매끈한 면이 바깥을 향하게 맞붙입니다.\n엄지와 나머지 손가락으로 원판을 집게처럼 잡습니다.\n팔을 곧게 펴 원판을 바닥에서 들어 올립니다.\n정해진 시간 동안 버틴 뒤 천천히 내려놓습니다.\n안전 팁: 발 위에 떨어지지 않도록 주의하고 손가락 통증이 있으면 중단하세요.","forearms",[],"stand","other"),
  ex("grip_crusher","그립 크러셔","팔","전완","기타","reps",["악력기","핸드 그립","Grip Crusher"],"악력기를 손바닥으로 감싸고 손잡이 사이를 벌려 잡습니다.\n손목은 곧게 펴고 팔꿈치는 편하게 둡니다.\n손가락과 손바닥으로 손잡이를 끝까지 쥡니다.\n잠시 수축한 뒤 천천히 풀며 반복합니다.\n안전 팁: 너무 무거운 악력기는 손가락 관절에 무리가 되므로 점진적으로 늘리세요.","forearms",[],"stand","other"),
  ex("wrist_roller","리스트 롤러","팔","전완","기타","reps",["손목 롤러","롤러","Wrist Roller"],"손목 롤러의 막대를 어깨 높이로 팔을 펴 앞으로 잡습니다.\n줄 끝에 달린 중량이 바닥에서 떨어지도록 매답니다.\n손목을 굴려 줄을 감으며 중량을 위로 끌어올립니다.\n끝까지 올린 뒤 같은 방식으로 천천히 풀어 내립니다.\n안전 팁: 어깨와 손목이 피로하면 중단하고 가벼운 중량으로 시작하세요.","forearms",[],"curl","other"),
  ex("barbell_hold","바벨 홀드","팔","전완","바벨","weight_duration",["바벨 버티기","그립 홀드","Barbell Hold"],"랙에서 바벨을 데드리프트하거나 올려 허벅지 앞에서 잡습니다.\n가슴을 펴고 어깨를 내려 서 있습니다.\n바가 미끄러지지 않게 강하게 쥐고 정해진 시간 동안 버팁니다.\n시간이 끝나면 허리를 곧게 유지하며 바를 내려놓습니다.\n안전 팁: 그립이 풀리면 바로 내려놓고 스트랩이나 세이프티 바를 활용하세요.","forearms",["traps"],"stand","barbell"),
  ex("plate_pinch_grip_hold","핀치 그립 홀드","팔","전완","기타","weight_duration",["원판 핀치 홀드","원판","Pinch Grip Hold"],"원판 두 장을 매끈한 면이 밖으로 향하게 맞붙여 한 손으로 잡습니다.\n엄지와 손가락으로 원판 모서리를 집듯이 쥡니다.\n팔을 곧게 펴 몸 옆에서 원판을 바닥에서 들어 올립니다.\n정해진 시간 동안 버틴 뒤 천천히 내려놓고 반대 손도 수행합니다.\n안전 팁: 원판이 발 쪽으로 떨어지지 않게 주의하세요.","forearms",[],"stand","other"),
  ex("barbell_shrug","바벨 슈러그","등","승모근","바벨","weight_reps",["슈러그","으쓱","Barbell Shrug"],"바벨을 어깨너비로 오버그립으로 잡고 허벅지 앞에 둡니다.\n가슴을 펴고 팔을 곧게 펴서 어깨를 내립니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 곧게 으쓱합니다.\n정점에서 멈춘 뒤 천천히 내려 돌아갑니다.\n안전 팁: 어깨를 돌리지 말고 위아래로만 움직이며 그립이 약하면 스트랩을 사용하세요.","traps",[],"shrug","barbell"),
  ex("dumbbell_shrug","덤벨 슈러그","등","승모근","덤벨","weight_reps",["Dumbbell Shrug"],"양손에 덤벨을 들고 팔을 몸 옆에 곧게 내립니다.\n가슴을 펴고 시선은 정면을 봅니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 으쓱 올립니다.\n정점에서 승모근을 조인 뒤 천천히 내려 돌아갑니다.\n안전 팁: 목을 앞으로 빼지 말고 어깨를 돌리지 마세요.","traps",[],"shrug","dumbbell"),
  ex("smith_shrug","스미스 슈러그","등","승모근","스미스","weight_reps",["Smith Machine Shrug"],"스미스 머신 바를 허벅지 높이에 맞추고 어깨너비로 오버그립으로 잡습니다.\n바를 풀고 몸 가까이에서 팔을 곧게 폅니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 으쓱 올립니다.\n정점에서 멈춘 뒤 천천히 내려 돌아갑니다.\n안전 팁: 바 경로가 고정되어 있으므로 몸을 바에 가까이 두고 세이프티를 설정하세요.","traps",[],"shrug","smith"),
  ex("cable_shrug","케이블 슈러그","등","승모근","케이블","weight_reps",["Cable Shrug"],"케이블 가장 낮은 위치에 바를 걸고 바를 잡고 섭니다.\n팔을 곧게 펴고 가슴을 펍니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 으쓱 올립니다.\n장력을 유지하며 천천히 내려 돌아갑니다.\n안전 팁: 케이블 장력을 끝까지 유지하고 목을 앞으로 빼지 마세요.","traps",[],"shrug","cable"),
  ex("machine_shrug","머신 슈러그","등","승모근","머신","weight_reps",["Machine Shrug"],"머신에 서거나 앉아 손잡이를 잡고 팔을 곧게 폅니다.\n가슴을 펴고 어깨를 내립니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 으쓱 올립니다.\n정점에서 멈춘 뒤 천천히 내려 돌아갑니다.\n안전 팁: 머신 높이를 몸에 맞게 조절하고 어깨를 돌리지 마세요.","traps",[],"shrug","machine"),
  ex("barbell_power_shrug","파워 슈러그","등","승모근","바벨","weight_reps",["Power Shrug"],"바벨을 어깨너비로 잡고 무릎 위까지 들어 상체를 살짝 숙입니다.\n가슴을 펴고 바를 몸 가까이에 둡니다.\n엉덩이와 무릎을 펴는 힘으로 폭발적으로 일어서며 어깨를 으쓱합니다.\n바를 천천히 내려 시작 자세로 돌아갑니다.\n안전 팁: 바를 몸에서 멀리 보내지 말고 허리를 곧게 유지하며 무리한 중량은 피하세요.","traps",["quads"],"shrug","barbell"),
  ex("barbell_overhead_shrug","오버헤드 슈러그","등","승모근","바벨","weight_reps",["Overhead Shrug"],"바를 머리 위로 팔을 뻗어 든 상태로 어깨너비보다 넓게 잡습니다.\n팔꿈치를 완전히 편 채 갈비뼈를 닫고 코어에 힘을 줍니다.\n팔을 굽히지 않고 어깨를 귀 쪽으로 위로 으쓱 올립니다.\n잠시 멈춘 뒤 천천히 어깨를 내려 시작 자세로 돌아갑니다.\n안전 팁: 가벼운 중량으로 시작하고 허리가 꺾이지 않도록 하며, 바를 머리 위에서 유지하기 어려우면 중단하세요.","traps",["shoulders"],"shrug","barbell"),
  ex("barbell_high_pull","하이 풀","등","승모근","바벨","weight_reps",["바벨 하이 풀","High Pull"],"바를 어깨너비로 잡고 무릎 위 높이에서 허리를 곧게 편 채 준비합니다.\n엉덩이와 무릎을 펴며 바를 몸에 붙여 위로 끌어올립니다.\n팔꿈치를 바깥으로 높이 들어 바가 가슴 높이까지 오게 합니다.\n바를 천천히 내려 무릎 위 시작 위치로 돌아옵니다.\n안전 팁: 바를 몸에서 멀어지게 두지 말고 허리를 둥글게 말지 않도록 중량을 조절하세요.","traps",["shoulders"],"upright","barbell"),
  ex("bodyweight_neck_flexion","넥 플렉션","목","목","맨몸","reps",["목 굴곡","밴드 넥 플렉션","Neck Flexion"],"의자에 앉거나 서서 손바닥이나 밴드를 이마에 대고 시선은 정면에 둡니다.\n가볍게 이마로 저항을 밀며 턱을 가슴 쪽으로 천천히 당깁니다.\n끝 지점에서 1초 멈춘 뒤 같은 속도로 고개를 원위치로 돌립니다.\n안전 팁: 아주 약한 저항으로 천천히 움직이고, 어지럽거나 저리면 즉시 중단하세요.","neck",[],"neck","bodyweight"),
  ex("bodyweight_neck_extension","넥 익스텐션","목","목","맨몸","reps",["목 신전","밴드 넥 익스텐션","Neck Extension"],"의자에 앉아 손이나 밴드를 뒤통수에 대고 허리를 곧게 폅니다.\n뒤통수로 가볍게 저항을 누르며 고개를 천천히 뒤로 젖힙니다.\n불편하지 않은 범위에서 1초 멈춥니다.\n천천히 고개를 앞으로 돌려 시작 자세로 돌아옵니다.\n안전 팁: 반동 없이 아주 가벼운 저항만 쓰고, 목을 끝까지 젖히지 마세요.","neck",[],"neck","bodyweight"),
  ex("bodyweight_neck_lateral_flexion","넥 레터럴 플렉션","목","목","맨몸","reps",["목 측면 굴곡","Neck Lateral Flexion"],"바르게 앉아 한 손을 귀 위쪽 옆머리에 가볍게 올립니다.\n어깨는 고정한 채 귀를 어깨 쪽으로 천천히 기울이며 손으로 약하게 저항합니다.\n끝에서 1초 멈춥니다.\n천천히 머리를 세워 시작 자세로 돌아오고 반대쪽도 같은 방식으로 합니다.\n안전 팁: 어깨를 올리지 말고 가벼운 힘으로 천천히 하며, 통증이 있으면 멈추세요.","neck",[],"neck","bodyweight"),
  ex("bodyweight_neck_bridge","넥 브리지","목","목","맨몸","reps",["레슬러 브리지","Neck Bridge"],"매트에 누워 무릎을 세우고 두 팔을 가슴 앞에서 교차합니다.\n엉덩이를 들어 올려 머리 윗부분과 발로 몸을 지탱합니다.\n체중을 조금씩 실으며 목을 앞뒤로 아주 작게 움직입니다.\n천천히 엉덩이를 내려 누운 자세로 돌아옵니다.\n안전 팁: 처음에는 손으로 체중을 분산해 보조하고 짧은 시간만 하며, 목에 통증이 오면 즉시 중단하세요.","neck",[],"neck","bodyweight"),
  ex("neck_harness_curl","하네스 넥 컬","목","목","기타","weight_reps",["넥 하네스","Neck Harness Curl"],"벤치에 누워 넥 하네스를 머리에 쓰고 가벼운 원판을 연결합니다.\n고개를 벤치 끝 밖으로 두고 턱이 가슴 쪽으로 향하게 합니다.\n턱을 가슴 쪽으로 천천히 당겨 올립니다.\n잠시 멈춘 뒤 같은 속도로 천천히 내려 시작 위치로 돌아옵니다.\n안전 팁: 가장 가벼운 중량부터 시작하고 반동을 쓰지 말며, 어지러우면 중단하세요.","neck",[],"neck","other"),
  ex("neck_harness_extension","하네스 넥 익스텐션","목","목","기타","weight_reps",["넥 하네스","Neck Harness Extension"],"벤치 옆에 엎드리거나 상체를 숙인 자세로 넥 하네스를 쓰고 가벼운 원판을 연결합니다.\n등은 곧게 두고 머리를 중립에 놓습니다.\n뒤통수 쪽 근육을 써서 고개를 천천히 들어 올립니다.\n1초 멈춘 뒤 천천히 내려 시작 자세로 돌아옵니다.\n안전 팁: 아주 가벼운 중량과 느린 속도를 유지하고 목을 과하게 젖히지 마세요.","neck",[],"neck","other"),
  ex("barbell_clean","클린","전신","전신","바벨","weight_reps",["바벨 클린","Clean"],"발을 골반너비로 벌리고 바를 정강이 가까이 두고 어깨너비로 잡습니다.\n등을 편 채 바를 바닥에서 끌어올리고 무릎 위를 지나면 엉덩이를 힘차게 폅니다.\n바를 몸에 붙여 올리며 몸 아래로 파고들어 어깨 앞쪽에서 받습니다.\n완전히 일어선 뒤 바를 천천히 내려 바닥으로 돌려놓습니다.\n안전 팁: 손목을 억지로 꺾지 말고 실패 시 바를 앞으로 놓을 공간을 확보하세요.","full_body",["quads","traps"],"olympic","barbell"),
  ex("barbell_power_clean","파워 클린","전신","전신","바벨","weight_reps",["파클","Power Clean"],"바를 정강이 가까이 두고 어깨너비로 잡은 뒤 등을 곧게 폅니다.\n바를 무릎 위까지 끌어올린 뒤 엉덩이와 무릎을 폭발적으로 폅니다.\n바를 몸에 붙인 채 얕게 앉으며 어깨 앞쪽에서 받습니다.\n일어선 뒤 바를 조심스럽게 내려 시작 위치로 되돌립니다.\n안전 팁: 기술이 익숙해질 때까지 낮은 중량으로 연습하고 바닥에 충분한 공간을 확보하세요.","full_body",["quads","traps"],"olympic","barbell"),
  ex("barbell_hang_clean","행 클린","전신","전신","바벨","weight_reps",["Hang Clean"],"바를 잡고 일어서서 무릎 바로 위까지 바를 내리고 엉덩이를 뒤로 뺍니다.\n등을 곧게 유지한 채 엉덩이와 무릎을 힘차게 폅니다.\n어깨를 으쓱하고 팔꿈치를 돌려 바를 어깨 앞쪽에서 받습니다.\n바를 천천히 내려 무릎 위 행 자세로 돌아옵니다.\n안전 팁: 바를 팔로 당기지 말고 하체 힘으로 올리며, 손목이 불편하면 그립을 조절하세요.","full_body",["traps","quads"],"olympic","barbell"),
  ex("barbell_clean_and_jerk","클린 앤 저크","전신","전신","바벨","weight_reps",["용상","Clean and Jerk"],"바를 바닥에서 클린 동작으로 어깨 앞쪽까지 받아 올립니다.\n일어서서 호흡을 정리하고 무릎을 살짝 굽혀 몸통을 곧게 세웁니다.\n무릎을 힘차게 펴며 바를 머리 위로 밀어 올리고 다리를 앞뒤로 벌려 받칩니다.\n바를 안정시킨 뒤 발을 모으고 천천히 바를 내립니다.\n안전 팁: 실패 시 바를 놓을 공간을 확보하고 범퍼 플레이트를 사용하세요.","full_body",["shoulders","quads"],"olympic","barbell"),
  ex("barbell_snatch","스내치","전신","전신","바벨","weight_reps",["인상","Snatch"],"바를 넓게 잡고 발은 골반너비로 두며 등을 곧게 폅니다.\n바를 바닥에서 몸에 붙여 끌어올리고 엉덩이를 폭발적으로 폅니다.\n바 아래로 깊게 앉으며 머리 위에서 팔을 완전히 펴 받습니다.\n안정된 자세로 일어선 뒤 바를 조심스럽게 내립니다.\n안전 팁: 가벼운 바로 기술부터 익히고 실패 시 바를 뒤로 놓을 수 있는 공간을 확보하세요.","full_body",["shoulders","quads"],"olympic","barbell"),
  ex("barbell_power_snatch","파워 스내치","전신","전신","바벨","weight_reps",["Power Snatch"],"바를 넓게 잡고 정강이 근처에 두고 등을 곧게 폅니다.\n바를 몸에 붙여 끌어올린 뒤 엉덩이와 무릎을 힘차게 폅니다.\n얕게 앉으며 머리 위에서 팔을 완전히 펴 바를 받습니다.\n일어선 뒤 바를 어깨, 허리 순으로 조심스럽게 내립니다.\n안전 팁: 낮은 중량으로 시작하고 어깨가 불안정하면 중량을 낮추세요.","full_body",["shoulders","quads"],"olympic","barbell"),
  ex("barbell_thruster","쓰러스터","전신","전신","바벨","weight_reps",["스러스터","Thruster"],"바를 어깨 앞쪽에 올린 프론트 랙 자세로 서고 팔꿈치를 앞으로 높게 듭니다.\n가슴을 편 채 허벅지가 평행이 될 때까지 앉습니다.\n일어서는 힘을 이용해 바를 머리 위로 곧게 밀어 올립니다.\n바를 어깨로 되돌리고 다시 앉을 준비를 합니다.\n안전 팁: 앉을 때 무릎이 안쪽으로 모이지 않게 하고 허리를 곧게 유지하세요.","full_body",["quads","shoulders"],"thruster","barbell"),
  ex("kettlebell_swing","케틀벨 스윙","하체","둔근","케틀벨","weight_reps",["스윙","KB 스윙","Kettlebell Swing"],"발을 어깨너비로 벌리고 케틀벨을 앞쪽 바닥에 두고 손잡이를 양손으로 잡습니다.\n엉덩이를 뒤로 빼며 케틀벨을 다리 사이로 넘깁니다.\n엉덩이를 힘차게 펴며 케틀벨을 가슴 높이까지 앞으로 보냅니다.\n케틀벨이 내려오면 엉덩이를 다시 뒤로 빼며 이어서 반복합니다.\n안전 팁: 스쿼트처럼 앉지 말고 엉덩이 힘으로 움직이며, 허리가 둥글어지지 않게 하세요.","glutes",["hamstrings","lower_back"],"swing","kettlebell"),
  ex("kettlebell_clean","케틀벨 클린","전신","전신","케틀벨","weight_reps",["KB 클린","Kettlebell Clean"],"케틀벨을 두 발 사이 앞쪽에 두고 한 손으로 잡은 뒤 엉덩이를 뒤로 뺍니다.\n엉덩이를 펴며 케틀벨을 몸에 붙여 끌어올립니다.\n손을 케틀벨 아래로 돌려 어깨 앞쪽 랙 위치에 부드럽게 받습니다.\n케틀벨을 천천히 내려 다리 사이로 돌려보냅니다.\n안전 팁: 케틀벨이 팔뚝을 세게 치지 않도록 손목을 가볍게 돌려 받으세요.","full_body",["glutes","shoulders"],"olympic","kettlebell"),
  ex("kettlebell_snatch","케틀벨 스내치","전신","전신","케틀벨","weight_reps",["KB 스내치","Kettlebell Snatch"],"케틀벨을 앞쪽 바닥에 두고 한 손으로 잡고 엉덩이를 뒤로 뺍니다.\n엉덩이를 폭발적으로 펴며 케틀벨을 몸에 붙여 위로 끌어올립니다.\n손을 돌려 케틀벨을 머리 위에서 팔을 완전히 펴 받습니다.\n케틀벨을 몸 앞으로 내려 다리 사이로 보내며 반복합니다.\n안전 팁: 낮은 중량으로 궤적을 익히고 케틀벨이 손목을 때리지 않도록 주의하세요.","full_body",["shoulders","glutes"],"olympic","kettlebell"),
  ex("kettlebell_turkish_get_up","터키시 겟업","전신","전신","케틀벨","weight_reps",["터키쉬 겟업","TGU","Turkish Get-up"],"바닥에 누워 한 손으로 케틀벨을 천장 쪽으로 뻗고 같은 쪽 무릎을 세웁니다.\n팔꿈치와 손으로 바닥을 짚으며 상체를 일으키고 엉덩이를 들어 올립니다.\n다리를 뒤로 빼 무릎을 짚은 뒤 천천히 일어섭니다.\n같은 순서로 거꾸로 내려와 누운 자세로 돌아옵니다.\n안전 팁: 케틀벨을 든 팔은 항상 곧게 펴고 시선을 케틀벨에 두며 처음엔 빈손으로 연습하세요.","full_body",["shoulders","abs"],"squat","kettlebell"),
  ex("dumbbell_man_maker","맨메이커","전신","전신","덤벨","weight_reps",["맨 메이커","Man Maker"],"양손에 덤벨을 들고 어깨너비로 서서 바닥에 내려놓고 푸시업 자세를 만듭니다.\n푸시업 후 한쪽씩 덤벨을 당겨 로우를 합니다.\n발을 손 쪽으로 당겨 일어서며 덤벨을 어깨로 가져옵니다.\n머리 위로 밀어 올린 뒤 덤벨을 내려 다시 시작 자세로 돌아갑니다.\n안전 팁: 육각형 덤벨을 사용하고 허리가 처지지 않게 코어를 단단히 유지하세요.","full_body",["chest","shoulders"],"thruster","dumbbell"),
  ex("dumbbell_squat_to_press","스쿼트 투 프레스","전신","전신","덤벨","weight_reps",["덤벨 스러스터","Squat to Press"],"양손에 덤벨을 어깨 높이에 들고 발을 어깨너비로 벌립니다.\n가슴을 펴고 허벅지가 평행이 될 때까지 앉습니다.\n일어서는 반동을 이용해 덤벨을 머리 위로 곧게 밀어 올립니다.\n덤벨을 어깨로 내리며 다시 앉을 준비를 합니다.\n안전 팁: 밀어 올릴 때 허리를 과하게 젖히지 말고 코어에 힘을 유지하세요.","full_body",["quads","shoulders"],"thruster","dumbbell"),
  ex("bodyweight_burpee","버피","전신","전신","맨몸","reps",["버피 테스트","Burpee"],"발을 어깨너비로 벌리고 선 자세에서 시작해 손을 바닥에 짚으며 쪼그려 앉습니다.\n발을 뒤로 뻗어 플랭크 자세를 만들고 가슴을 바닥 가까이 내립니다.\n발을 손 쪽으로 당겨 일어서며 가볍게 점프합니다.\n착지 후 바로 다음 반복으로 이어갑니다.\n안전 팁: 플랭크에서 허리가 처지지 않게 하고 착지는 무릎을 부드럽게 굽혀 하세요.","full_body",["chest","quads"],"jump","bodyweight"),
  ex("bodyweight_burpee_pull_up","버피 풀업","전신","전신","맨몸","reps",["Burpee Pull-up"],"풀업 바 아래에서 버피를 하여 가슴을 바닥 가까이 내립니다.\n발을 당겨 일어서며 점프해 바를 어깨너비보다 넓게 잡습니다.\n턱이 바 위로 올라오도록 몸을 당겨 올립니다.\n천천히 내려와 착지하고 다음 반복으로 이어갑니다.\n안전 팁: 바를 잡을 때 손이 미끄러지지 않게 하고 내려올 때 무릎을 굽혀 충격을 흡수하세요.","full_body",["back"],"jump","bodyweight"),
  ex("bodyweight_jumping_jack","점핑 잭","전신","전신","맨몸","reps",["팔벌려뛰기","Jumping Jack"],"발을 모으고 팔을 몸 옆에 둔 채 바르게 섭니다.\n가볍게 점프하며 다리를 벌리고 팔을 머리 위로 올립니다.\n다시 점프하며 다리를 모으고 팔을 내립니다.\n일정한 리듬으로 호흡하며 반복합니다.\n안전 팁: 발 앞쪽부터 부드럽게 착지하고 무릎이 과하게 펴지지 않게 하세요.","full_body",[],"jump","bodyweight"),
  ex("bodyweight_bear_crawl","베어 크롤","전신","전신","맨몸","duration",["곰걸음","Bear Crawl"],"바닥에 네발로 엎드려 무릎을 바닥에서 살짝 띄우고 손은 어깨 아래에 둡니다.\n등을 평평하게 유지하고 오른손과 왼발을 함께 앞으로 내딛습니다.\n반대쪽 손과 발도 번갈아 앞으로 이동합니다.\n정해진 시간 또는 거리만큼 일정한 속도로 이동합니다.\n안전 팁: 엉덩이가 위로 솟지 않게 하고 손목이 아프면 천천히 하세요.","full_body",["shoulders","abs"],"plank","bodyweight"),
  ex("box_jump","박스 점프","전신","전신","기타","reps",["박스","플라이오 박스","Box Jump"],"박스 앞에 발을 어깨너비로 벌리고 서서 팔을 뒤로 젖히며 살짝 앉습니다.\n팔을 앞으로 휘두르며 두 발로 박스 위로 점프합니다.\n박스 위에서 무릎과 엉덩이를 펴 안정적으로 섭니다.\n뒤로 한 발씩 내려와 다음 반복을 준비합니다.\n안전 팁: 처음엔 낮은 박스를 사용하고 내려올 때 점프하지 말고 걸어 내려오세요.","full_body",["quads","glutes"],"jump","other"),
  ex("medicine_ball_wall_ball","월볼","전신","전신","기타","weight_reps",["월볼 샷","메디신볼","Wall Ball"],"메디신볼을 가슴 앞에 안고 벽에서 한 걸음 떨어져 섭니다.\n가슴을 편 채 앉아 허벅지가 평행이 되도록 내려갑니다.\n일어서며 공을 벽의 목표 지점으로 던져 올립니다.\n공이 내려오면 가슴 앞에서 받으며 바로 다시 앉습니다.\n안전 팁: 공을 받을 때 손목과 팔꿈치를 부드럽게 굽히고 허리를 곧게 유지하세요.","full_body",["quads","shoulders"],"thruster","other"),
  ex("medicine_ball_slam","메디신볼 슬램","전신","전신","기타","weight_reps",["볼 슬램","슬램볼","메디신볼","Medicine Ball Slam"],"메디신볼을 양손으로 잡고 발을 어깨너비로 벌려 섭니다.\n공을 머리 위로 높이 들어 올리며 몸을 쭉 폅니다.\n복부에 힘을 주며 공을 바닥에 강하게 내리칩니다.\n공을 집어 올려 다시 머리 위로 들어 반복합니다.\n안전 팁: 튀어 오르는 공에 얼굴이 맞지 않도록 거리를 두고 슬램용 공을 사용하세요.","full_body",["abs","shoulders"],"olympic","other"),
  ex("medicine_ball_twist","메디신볼 트위스트","복근","복근","기타","weight_reps",["메디신볼","Medicine Ball Twist"],"바닥에 앉아 무릎을 굽히고 상체를 살짝 뒤로 기울이며 공을 가슴 앞에 듭니다.\n등을 곧게 유지한 채 복부에 힘을 줍니다.\n몸통을 한쪽으로 돌려 공을 옆 바닥 가까이 가져갑니다.\n중앙을 지나 반대쪽으로 돌리며 반복합니다.\n안전 팁: 허리를 둥글게 말지 말고 몸통을 돌릴 때 반동을 쓰지 마세요.","abs",[],"twist","other"),
  ex("battle_rope","배틀로프","전신","전신","기타","duration",["배틀 로프","Battle Rope"],"발을 어깨너비로 벌리고 무릎을 살짝 굽혀 양손에 로프 끝을 잡습니다.\n코어에 힘을 주고 팔로 번갈아 위아래로 파도를 만듭니다.\n일정한 리듬으로 로프가 끝까지 파동이 가도록 유지합니다.\n정해진 시간 동안 호흡을 유지하며 이어갑니다.\n안전 팁: 허리를 곧게 유지하고 어깨가 지치면 속도를 낮추세요.","full_body",["shoulders"],"punch","other"),
  ex("sled_push","슬레드 푸시","전신","전신","기타","weight_duration",["썰매 밀기","썰매","Sled Push"],"슬레드 손잡이를 잡고 상체를 앞으로 기울여 몸이 대각선이 되게 합니다.\n팔을 뻗고 코어에 힘을 주며 발로 바닥을 밀어냅니다.\n짧고 힘찬 걸음으로 슬레드를 앞으로 밉니다.\n정해진 거리 또는 시간 동안 일정한 자세를 유지합니다.\n안전 팁: 허리가 처지지 않게 하고 미끄러지지 않는 신발을 신으세요.","full_body",["quads","glutes"],"walk","other"),
  ex("sled_pull","슬레드 풀","전신","전신","기타","weight_duration",["썰매 끌기","썰매","Sled Pull"],"슬레드에 로프나 하네스를 연결하고 슬레드를 바라보며 섭니다.\n상체를 곧게 세우고 코어에 힘을 줍니다.\n뒤로 걸으며 또는 로프를 번갈아 당기며 슬레드를 끌어옵니다.\n정해진 시간 또는 거리만큼 일정한 속도로 진행합니다.\n안전 팁: 뒤로 걸을 때는 바닥을 확인하고 중량은 자세가 유지되는 범위로 하세요.","full_body",["back","hamstrings"],"walk","other"),
  ex("sandbag_squat","샌드백 스쿼트","하체","대퇴사두","기타","weight_reps",["샌드백","Sandbag Squat"],"샌드백을 가슴 앞이나 어깨 위에 안고 발을 어깨너비로 벌립니다.\n가슴을 펴고 엉덩이를 뒤로 빼며 앉습니다.\n허벅지가 평행이 될 때까지 내려갑니다.\n발바닥으로 바닥을 밀며 일어서 시작 자세로 돌아옵니다.\n안전 팁: 샌드백이 흔들려도 상체를 곧게 유지하고 무릎이 안쪽으로 모이지 않게 하세요.","quads",["glutes"],"squat","other"),
  ex("sandbag_shouldering","샌드백 숄더링","전신","전신","기타","weight_reps",["샌드백","Sandbag Shouldering"],"샌드백을 바닥에 두고 다리를 벌린 채 엉덩이를 뒤로 뺍니다.\n등을 편 채 샌드백을 안아 올려 허벅지 위로 가져옵니다.\n엉덩이를 펴며 샌드백을 한쪽 어깨 위로 올립니다.\n천천히 내려놓고 반대쪽 어깨로 반복합니다.\n안전 팁: 허리를 둥글게 말지 말고 다리 힘으로 들어 올리세요.","full_body",["back","glutes"],"olympic","other"),
  ex("sandbag_carry","샌드백 캐리","전신","전신","기타","weight_duration",["샌드백","Sandbag Carry"],"샌드백을 양팔로 가슴 앞에 안거나 한쪽 어깨에 올립니다.\n상체를 곧게 세우고 코어에 힘을 줍니다.\n안정된 걸음으로 정해진 거리나 시간만큼 걷습니다.\n천천히 무릎을 굽혀 샌드백을 바닥에 내려놓습니다.\n안전 팁: 걸을 때 시선을 앞에 두고 몸이 한쪽으로 기울지 않게 하세요.","full_body",["abs"],"walk","other"),
  ex("band_pull_apart","밴드 풀어파트","어깨","어깨","밴드","reps",["풀어파트","저항 밴드","Band Pull-apart"],"밴드를 양손으로 어깨너비로 잡고 팔을 가슴 높이로 앞으로 뻗습니다.\n어깨를 내린 채 가슴을 펴고 준비합니다.\n팔을 곧게 유지하며 밴드를 양옆으로 당겨 벌립니다.\n날개뼈를 모은 뒤 천천히 시작 자세로 돌아옵니다.\n안전 팁: 어깨가 으쓱 올라가지 않게 하고 밴드를 놓치지 않도록 천천히 하세요.","shoulders",["back"],"raise","band"),
  ex("band_curl","밴드 컬","팔","이두","밴드","reps",["저항 밴드","Band Curl"],"밴드를 두 발로 밟고 양손으로 밴드 끝을 잡고 팔을 몸 옆에 내립니다.\n팔꿈치를 옆구리에 붙인 채 손바닥이 앞을 향하게 합니다.\n팔꿈치를 고정하고 손을 어깨 쪽으로 구부려 올립니다.\n천천히 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 밴드가 끊어지지 않았는지 사용 전 점검하고 몸을 흔들지 마세요.","biceps",[],"curl","band"),
  ex("band_press","밴드 프레스","가슴","가슴","밴드","reps",["밴드 체스트 프레스","저항 밴드","Band Press"],"밴드를 등 뒤로 돌려 양손으로 잡고 팔꿈치를 가슴 옆에 둡니다.\n한 발을 앞으로 내디뎌 균형을 잡고 코어에 힘을 줍니다.\n팔을 앞으로 곧게 밀어 밴드를 늘립니다.\n천천히 팔을 굽혀 시작 위치로 돌아옵니다.\n안전 팁: 밴드가 등에서 미끄러지지 않게 고정하고 어깨가 앞으로 말리지 않게 하세요.","chest",["triceps","shoulders"],"bench","band"),
  ex("trx_row","TRX 로우","등","등","기타","reps",["TRX","서스펜션","TRX Row"],"TRX 손잡이를 잡고 몸을 뒤로 기울여 팔을 곧게 폅니다.\n몸을 일직선으로 유지하고 발은 앞쪽에 둡니다.\n팔꿈치를 뒤로 당기며 가슴을 손잡이 쪽으로 끌어당깁니다.\n천천히 팔을 펴 시작 자세로 돌아옵니다.\n안전 팁: 사용 전 스트랩 고정 상태를 확인하고 엉덩이가 처지지 않게 하세요.","back",["biceps"],"row_bent","other"),
  ex("trx_push_up","TRX 푸쉬업","가슴","가슴","기타","reps",["TRX 푸시업","TRX","TRX Push-up"],"TRX 손잡이를 잡고 몸을 앞으로 기울여 플랭크 자세를 만듭니다.\n손잡이는 가슴 옆 높이에 두고 몸을 일직선으로 유지합니다.\n팔꿈치를 굽혀 가슴을 손잡이 사이로 내립니다.\n팔을 펴 밀어 올리며 시작 자세로 돌아옵니다.\n안전 팁: 손잡이가 흔들려도 몸통을 고정하고 어깨가 과하게 벌어지지 않게 하세요.","chest",["triceps"],"push_up","other"),
  ex("trx_squat","TRX 스쿼트","하체","대퇴사두","기타","reps",["TRX","TRX Squat"],"TRX 손잡이를 잡고 발을 어깨너비로 벌려 가슴 앞에서 팔을 폅니다.\n손잡이를 가볍게 당기며 가슴을 펴고 준비합니다.\n엉덩이를 뒤로 빼며 허벅지가 평행이 될 때까지 앉습니다.\n발바닥으로 바닥을 밀며 일어서 시작 자세로 돌아옵니다.\n안전 팁: 손잡이에 지나치게 의존하지 말고 무릎이 안쪽으로 모이지 않게 하세요.","quads",["glutes"],"squat","other"),
  ex("stability_ball_crunch","짐볼 크런치","복근","복근","기타","reps",["짐볼","스위스볼","Stability Ball Crunch"],"짐볼에 허리 아래쪽을 대고 눕고 발은 바닥에 단단히 둡니다.\n손을 가슴 앞이나 귀 옆에 가볍게 둡니다.\n복부에 힘을 주어 상체를 천천히 말아 올립니다.\n잠시 멈춘 뒤 천천히 내려 시작 자세로 돌아옵니다.\n안전 팁: 목을 당기지 말고 공이 굴러가지 않도록 발을 넓게 벌리세요.","abs",[],"crunch","other"),
  ex("stability_ball_leg_curl","짐볼 레그 컬","하체","햄스트링","기타","reps",["짐볼","Stability Ball Leg Curl"],"바닥에 누워 두 발뒤꿈치를 짐볼 위에 올리고 팔을 몸 옆에 둡니다.\n엉덩이를 들어 어깨부터 발까지 일직선이 되게 합니다.\n무릎을 굽혀 발로 공을 엉덩이 쪽으로 당깁니다.\n천천히 다리를 펴 시작 자세로 돌아옵니다.\n안전 팁: 엉덩이가 내려가지 않게 하고 공이 흔들리면 속도를 늦추세요.","hamstrings",["glutes"],"leg_curl","other"),
  ex("stability_ball_plank","짐볼 플랭크","복근","복근","기타","duration",["짐볼","Stability Ball Plank"],"짐볼 위에 팔꿈치와 팔뚝을 올리고 발을 뒤로 뻗어 몸을 일직선으로 만듭니다.\n복부와 엉덩이에 힘을 주어 허리가 처지지 않게 합니다.\n시선을 아래에 두고 정해진 시간 동안 호흡하며 버팁니다.\n시간이 끝나면 천천히 무릎을 내리고 쉽니다.\n안전 팁: 허리가 꺾이면 즉시 쉬고 처음엔 짧은 시간부터 시작하세요.","abs",[],"plank","other"),
  ex("plate_press","플레이트 프레스","가슴","가슴","기타","weight_reps",["원판 프레스","스비엔드 프레스","원판","Plate Press"],"원판을 양손으로 가슴 앞에 잡고 팔꿈치를 몸 옆에 붙입니다.\n벤치에 앉거나 서서 코어에 힘을 줍니다.\n원판을 가슴에서 앞으로 팔이 펴질 때까지 밀어냅니다.\n천천히 팔을 굽혀 가슴 앞으로 돌려놓습니다.\n안전 팁: 원판이 미끄러지지 않도록 가장자리를 단단히 잡으세요.","chest",["shoulders","triceps"],"bench","other"),
  ex("plate_front_raise","플레이트 프론트 레이즈","어깨","어깨","기타","weight_reps",["원판 프론트 레이즈","원판","Plate Front Raise"],"원판을 양손으로 아래쪽에 잡고 팔을 쭉 내린 채 서서 시작합니다.\n허리를 곧게 펴고 코어에 힘을 줍니다.\n팔꿈치를 약간 굽힌 채 원판을 어깨 높이까지 들어 올립니다.\n천천히 내려 시작 자세로 돌아옵니다.\n안전 팁: 몸을 뒤로 젖히지 말고 가벼운 원판부터 시작하세요.","shoulders",[],"raise","other"),
  ex("plate_twist","플레이트 트위스트","복근","복근","기타","weight_reps",["원판 트위스트","원판","Plate Twist"],"원판을 양손으로 가슴 앞에 잡고 앉아 무릎을 굽히고 상체를 살짝 뒤로 기울입니다.\n등을 곧게 유지하고 복부에 힘을 줍니다.\n원판을 한쪽 옆으로 몸통을 돌려 가져갑니다.\n중앙을 지나 반대쪽으로 돌리며 반복합니다.\n안전 팁: 허리가 아닌 몸통으로 돌리고 반동을 쓰지 마세요.","abs",[],"twist","other"),
  ex("foam_rolling","폼롤링","전신","전신","기타","duration",["폼롤러","근막이완","Foam Rolling"],"폼롤러를 풀고 싶은 근육 아래에 두고 손이나 발로 체중을 지지합니다.\n체중을 실어 천천히 폼롤러 위를 굴립니다.\n뭉친 부분에서는 20~30초 정도 머물며 호흡합니다.\n다른 부위로 천천히 이동하며 반복합니다.\n안전 팁: 관절이나 뼈 부위는 직접 누르지 말고 통증이 날카로우면 압력을 줄이세요.","full_body",[],"roll","other"),
