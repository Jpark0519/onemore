/* ================= 운동 로직 ================= */
function newSet(rt, src, prev) {
  const s = { type: src?.type || 'N', prev: prev || null, done:false, edited:false, pr:false };
  RT[rt].fields.forEach(f => { s[f.k] = src?.[f.k] ?? null; });
  return s;
}
/* plan(루틴 항목)이 있으면 세트 수·목표값은 루틴을 따르고, 빈 칸만 지난 기록으로 채운다. 이전 기록 표시는 항상 지난 기록 */
function makeExercise(exId, plan) {
  const e = exById(exId), h = HISTORY[exId];
  const src = plan ? plan.sets : h;
  const sets = src && src.length
    ? src.map((p, i) => { const last = h && h[i] ? h[i] : null, v = { type: p.type || 'N' };
        RT[e.rt].fields.forEach(f => { v[f.k] = p[f.k] ?? last?.[f.k] ?? null; });
        return newSet(e.rt, v, last ? { ...last } : null); })
    : [0,1,2].map(() => newSet(e.rt));
  return { exId, rest: plan?.rest ?? restOf(exId), sets };
}
function startWorkout(routineId) {
  const r = ROUTINES.find(x => x.id === routineId);
  S.workout = { title: r ? r.name : '자유 운동', routineId: r ? r.id : null, startedAt: Date.now(),
                exercises: r ? r.items.map(it => makeExercise(it.exId, it)) : [] };
  S.screen = 'workout'; S.rest.endsAt = null; S.pad = null; S.page = 0; S.listMode = false;
  render();
  if (!r) openPicker();
}
function completeSet(ei, si, fromLock) {
  const wx = S.workout.exercises[ei], e = exById(wx.exId), st = wx.sets[si];
  if (st.done) { if (allDone()) S.page = ei; st.done = false; st.pr = false; render(); return; }  // 전체 목록에서 해제하면 그 종목 페이지로 돌아감
  const missing = RT[e.rt].fields.findIndex(f => st[f.k] == null);
  if (missing >= 0) { if (fromLock) { toast('값이 비어 있어 앱에서 입력이 필요해요'); return; } openPad(ei, si, missing); return; }
  st.done = true; st.edited = true;
  buzz(15);
  if (e.rt === 'weight_reps' && st.type !== 'W') {
    const v = e1rm(st.w, st.r);
    if (v > (BEST_1RM[wx.exId] || 0)) { BEST_1RM[wx.exId] = v; st.pr = true; buzz([15,60,15]); toast(`새 기록  ${e.name} 추정 1RM ${fmt(v)}kg`); }
  }
  S.rest = { endsAt: Date.now() + wx.rest * 1000, total: wx.rest };
  if (!fromLock) S.pad = null;
  render();
  // 종목의 마지막 세트를 마치면 다음 미완료 종목으로 자동으로 넘긴다. 전부 끝나면 전체 목록으로 바뀐다(render에서 처리).
  if (exDone(wx)) {
    if (allDone()) toast('모든 운동 완료 · 위아래로 전체 기록을 확인하세요');
    else if (!fromLock) setTimeout(() => {
      // 실행 시점의 상태로 다시 판단한다 (그 사이 체크 해제·페이지 이동이 있었을 수 있음)
      if (S.screen !== 'workout' || !S.workout || isListMode() || S.page !== ei || !exDone(S.workout.exercises[ei])) return;
      const nx = nextUnfinished(ei); if (nx != null) goToPage(nx);
    }, 450);
  }
}
function nextPending() {
  const w = S.workout; if (!w) return null;
  for (let ei = 0; ei < w.exercises.length; ei++)
    for (let si = 0; si < w.exercises[ei].sets.length; si++)
      if (!w.exercises[ei].sets[si].done) return { ei, si };
  return null;
}
function addSet(ei) {
  const wx = S.workout.exercises[ei], e = exById(wx.exId), last = wx.sets[wx.sets.length - 1];
  const s = newSet(e.rt, last ? { ...last, type:'N' } : null); s.edited = !!last;
  wx.sets.push(s); render();
}
function cycleType(ei, si) {
  const st = S.workout.exercises[ei].sets[si], order = ['N','W','D','F'];
  st.type = order[(order.indexOf(st.type) + 1) % order.length];
  toast({ N:'일반 세트', W:'워밍업 세트 (통계 제외)', D:'드롭 세트', F:'실패 세트' }[st.type]);
  render();
}
function usePrev(ei, si) {
  const wx = S.workout.exercises[ei], st = wx.sets[si]; if (!st.prev || st.done) return;
  RT[exById(wx.exId).rt].fields.forEach(f => { st[f.k] = st.prev[f.k] ?? null; }); st.edited = true; render();
}
function finishWorkout() {
  const w = S.workout; let vol = 0, sets = 0; const prs = [];
  w.exercises.forEach(wx => { const e = exById(wx.exId); wx.sets.forEach(s => {
    if (!s.done) return; sets++;
    if (e.rt === 'weight_reps' && s.type !== 'W') vol += s.w * s.r;
    if (s.pr) prs.push({ name: e.name, w: s.w, r: s.r, v: e1rm(s.w, s.r) });
  }); });
  if (sets === 0 && !confirm('완료한 세트가 없어요. 기록 없이 종료할까요?')) return;
  const items = workoutToItems(w), src = ROUTINES.find(r => r.id === w.routineId);
  if (src) src.last = '오늘';
  // 루틴 없이 한 운동은 한 부위로 제목을 자동 작성 (예: "가슴·팔 운동")
  const title = !src && w.title === '자유 운동' && items.length ? partsTitle(items) : w.title;
  if (items.length) {   // 기록 탭 달력에 오늘 운동 추가
    const now = new Date(), key = ymd(now);
    LOG.push({ id: 'w' + Date.now(), date: key, title, routineId: src ? src.id : null, min: Math.max(1, Math.round((Date.now() - w.startedAt) / 60000)),
               exercises: items.map(it => ({ exId: it.exId, sets: it.sets.map(x => ({ ...x })) })) });
    S.hist = { y: now.getFullYear(), m: now.getMonth(), sel: key, dir: 0 };
  }
  S.summary = { title, dur: Date.now() - w.startedAt, vol, sets, prs, items, routineId: src ? src.id : null, saved:null };
  S.workout = null; S.rest.endsAt = null; S.pad = null; S.lock = false; S.screen = 'summary';
  if (items.length) openSaveRoutine();   // 완료한 세트가 있으면 루틴 등록 여부를 바로 묻는다
  render();
}

/* ================= 루틴 등록 (운동 종료 후) ================= */
// 완료한 세트만 루틴 목표값으로 옮긴다
function workoutToItems(w) {
  return w.exercises.map(wx => { const e = exById(wx.exId);
    const sets = wx.sets.filter(s => s.done).map(s => { const v = { type: s.type }; RT[e.rt].fields.forEach(f => { v[f.k] = s[f.k]; }); return v; });
    return sets.length ? { exId: wx.exId, rest: wx.rest, sets } : null; }).filter(Boolean);

// 한 순서대로 부위 칩 이름을 모아 최대 3개 (가슴·팔·어깨)
const partsOf = items => [...new Set(items.map(it => exById(it.exId).part))].slice(0, 3).join('·');
const partsTitle = items => partsOf(items) + ' 운동';
const suggestName = items => partsOf(items) + ' 루틴';
function openSaveRoutine(forceNew) {

  S.saveRt = src ? { mode:'update', name: src.name }
                 : { mode:'new', name: forceNew && s.routineId ? s.title + ' 2' : suggestName(s.items) };

}

    r.last = '오늘';

      <button class="icon-btn" onclick="moveMonth(1)" ${isCur ? 'disabled' : ''} aria-label="다음 달">${ic('right')}</button></div>
    <div class="cal" id="cal"><div class="cal-week">${DOW.map(d => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid ${H.dir < 0 ? 'slide-r' : H.dir > 0 ? 'slide-l' : ''}">${cells}</div></div>

}

/* ================= 통계 ================= */
const dOf = w => new Date(w.date + 'T00:00:00');
function periodStart(period, off) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (period === 'week') d.setDate(d.getDate() - (d.getDay() + 6) % 7 - 7 * off);   // 월요일 시작
  else { d.setDate(1); d.setMonth(d.getMonth() - off); }
  return d;
}
function periodEnd(period, s) { const e = new Date(s); period === 'week' ? e.setDate(e.getDate() + 7) : e.setMonth(e.getMonth() + 1); return e; }
const logsIn = (s, e) => LOG.filter(w => { const d = dOf(w); return d >= s && d < e; });
function totalsOf(logs) {
  return { n: logs.length, min: logs.reduce((a, w) => a + w.min, 0), vol: logs.reduce((a, w) => a + logVolume(w), 0),
           sets: logs.reduce((a, w) => a + w.exercises.reduce((b, x) => b + x.sets.filter(s => s.type !== 'W').length, 0), 0) };
}
function periodLabel(period, off, short) {
  const s = periodStart(period, off);
  if (period === 'month') return short ? `${s.getMonth() + 1}월` : off === 0 ? '이번 달' : `${s.getFullYear()}년 ${s.getMonth() + 1}월`;
  if (short) return `${s.getMonth() + 1}/${s.getDate()}`;
  if (off === 0) return '이번 주'; if (off === 1) return '지난주';
  const e = new Date(s); e.setDate(e.getDate() + 6);
  return `${s.getMonth() + 1}월 ${s.getDate()}일 ~ ${e.getMonth() + 1}월 ${e.getDate()}일`;
}
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}<small>시간</small> ${m % 60}<small>분</small>` : `${m}<small>분</small>`;
function deltaTxt(cur, prev, unit, word) {
  const d = Math.round(cur - prev); if (!prev && !cur) return '';
  if (d === 0) return `<span class="st-d">${word}과 같음</span>`;
  return `<span class="st-d ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString()}${unit}</span>`;
}
function setPeriod(p) { S.st = { period: p, off: 0 }; render(); }
function movePeriod(delta) { S.st.off = Math.max(0, S.st.off + delta); render(); }
function tapMark(el) { const on = el.classList.contains('on'); el.parentNode.querySelectorAll('.on').forEach(x => x.classList.remove('on')); if (!on) el.classList.add('on'); }

// 볼륨 추이: 선택한 기간까지 8개 막대. 선택 기간은 주황, 나머지는 옅게. 막대를 누르면 그 기간으로 이동
function volumeBars() {
  const { period, off } = S.st, N = 8, W = 340, H = 150, top = 22, base = 122;
  const data = Array.from({ length: N }, (_, i) => { const o = off + N - 1 - i, s = periodStart(period, o);
    return { o, v: totalsOf(logsIn(s, periodEnd(period, s))).vol, label: periodLabel(period, o, true) }; });
  const L = 48, max = Math.max(1, ...data.map(d => d.v)), step = (W - L) / N, bw = 20;   // 왼쪽 L px은 눈금 라벨 자리
  const step4 = Math.pow(10, Math.floor(Math.log10(max))) / 4, gmax = Math.ceil(max / step4) * step4;   // 눈금 최대값을 2.5 단위로 촘촘하게
  const y = v => base - (v / gmax) * (base - top);
  const grid = [0, gmax / 2, gmax].map(g => `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" class="gl"/><text x="${L - 6}" y="${y(g) + 3}" class="ax" text-anchor="end">${g ? Math.round(g).toLocaleString() : '0'}</text>`).join('');
  const bars = data.map((d, i) => { const x = L + i * step + (step - bw) / 2, h = Math.max(d.v ? 3 : 0, base - y(d.v)), cur = d.o === off;
    return `<g class="bar ${cur ? 'cur' : ''}" onclick="S.st.off=${d.o};render()" onmouseenter="tapMark(this)">
      <rect class="hit" x="${L + i * step}" y="0" width="${step}" height="${H}"/>
      ${h ? `<path class="b" d="M${x},${base} V${base - h + 4} Q${x},${base - h} ${x + 4},${base - h} H${x + bw - 4} Q${x + bw},${base - h} ${x + bw},${base - h + 4} V${base} Z"/>` : ''}
      <text class="tip" x="${x + bw / 2}" y="${base - h - 6}" text-anchor="middle">${Math.round(d.v).toLocaleString()}kg</text>
      <text class="ax ${cur ? 'cur' : ''}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${d.label}</text></g>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${period === 'week' ? '주별' : '월별'} 볼륨 추이">${grid}${bars}</svg>`;
}

// 종목별 세션 기록 (무게×횟수 종목만)
function exSessions(exId) {
  return LOG.filter(w => w.exercises.some(x => x.exId === exId)).sort((a, b) => a.date < b.date ? -1 : 1).map(w => {
    const x = w.exercises.find(x => x.exId === exId), work = x.sets.filter(s => s.type !== 'W');
    return { w, date: w.date, sets: x.sets, best: Math.max(0, ...work.map(s => e1rm(s.w || 0, s.r || 0))),
             top: Math.max(0, ...work.map(s => s.w || 0)), vol: work.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0) };
  });
}
function lineChart(pts, opts) {   // pts: [{x:label, v, sub}]
  const W = opts.w || 340, H = opts.h || 160, top = 24, base = H - 24, n = pts.length;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), pad = Math.max(2.5, (hi - lo) * 0.15);
  const y0 = Math.floor((lo - pad) / 2.5) * 2.5, y1 = Math.ceil((hi + pad) / 2.5) * 2.5;
  const L = opts.spark ? 0 : 34;   // 왼쪽 L px은 눈금 라벨 자리 (선과 겹치지 않게)
  const X = i => n === 1 ? (L + W) / 2 : L + 8 + i * (W - L - 16) / (n - 1), Y = v => base - (v - y0) / (y1 - y0) * (base - top);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<g class="pt ${i === n - 1 ? 'lab' : ''}" onmouseenter="tapMark(this)" onclick="tapMark(this)">
      <rect class="hit" x="${X(i) - (W / n) / 2}" y="0" width="${W / n}" height="${H}"/>
      <circle cx="${X(i)}" cy="${Y(p.v)}" r="${opts.spark ? 0 : 4}"/>
      ${opts.spark ? '' : `<text class="tip" x="${Math.min(W - 44, Math.max(L + 44, X(i)))}" y="${Y(p.v) - 10}" text-anchor="middle">${fmt(p.v)}${opts.unit ?? 'kg'} · ${p.x}</text>`}</g>`).join('');
  if (opts.spark) return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" class="ln"/></svg>`;
  const axis = [pts[0], pts[n - 1]].map((p, k) => `<text class="ax" x="${k ? W : L}" y="${H - 6}" text-anchor="${k ? 'end' : 'start'}">${p.x}</text>`).join('');
  const mid = (y0 + y1) / 2, grid = [y0, mid, y1].map(g => `<line x1="${L}" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" class="gl"/>${g === mid && !Number.isInteger(g * 2) ? ''
    : `<text x="${L - 6}" y="${Y(g) + 3}" class="ax" text-anchor="end">${fmt(g)}</text>`}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">${grid}<path d="${path}" class="ln"/>${dots}${axis}</svg>`;
}

function statsView() {

      <div class="r"><div class="num" style="font-weight:800">${fmt(best)}<small>kg</small></div><div class="st-d ${ch > 0 ? 'up' : ch < 0 ? 'down' : ''}">${ch ? (ch > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(+ch.toFixed(1))) + 'kg' : '유지'}</div></div></button>`; }).join('');

      <div class="card"><div class="caption">운동 시간</div><div class="stat-val num">${fmtMin(t.min)}</div>${deltaTxt(t.min, prev.min, '분', word)}</div>

    <div class="card" style="padding:4px 16px">${exRows || '<div class="caption" style="padding:16px 0">아직 기록이 없어요</div>'}</div></div>`;
}

/* ================= 마이: 체성분 · 목표 · AI 코치 ================= */
// 체성분 기록 (목업). 앱에서는 body_measurements 테이블. smm = 골격근량, fat = 체지방률
const BODY_M = { weight:{ l:'체중', u:'kg' }, smm:{ l:'골격근량', u:'kg' }, fat:{ l:'체지방률', u:'%' } };
function seedBody() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return [[118, 80.4, 33.1, 22.8], [90, 79.6, 33.3, 21.9], [62, 79.1, 33.6, 21.0], [33, 78.6, 33.8, 20.3], [6, 78.1, 34.0, 19.6]]
    .map(([b, weight, smm, fat]) => { const d = new Date(t); d.setDate(d.getDate() - b); return { date: ymd(d), weight, smm, fat }; });
}
// 목표 (목업). 앱에서는 goals 테이블: 기간(시작·끝) + 체중·골격근량·체지방률 목표값 + 시작할 때의 값(base, 진행률 계산용)
// initState()가 이 정의들보다 먼저 실행되므로 아래 날짜 함수와 seedGoal은 function 선언으로 둔다
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function dayDiff(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function seedGoal() {
  const start = BODY[2].date;
  return { start, end: addDays(start, 84), base: { weight: BODY[2].weight, smm: BODY[2].smm, fat: BODY[2].fat }, target: { weight: 76, smm: 35, fat: 19 } };
}
const bodyLatest = k => { for (let i = BODY.length - 1; i >= 0; i--) if (BODY[i][k] != null) return BODY[i]; return null; };
const bodyAt = (k, date) => { let r = null; BODY.forEach(b => { if (b[k] != null && b.date <= date) r = b[k]; }); return r; };   // 그 날짜까지의 마지막 측정값
const thisWeekLogs = () => { const s = periodStart('week', 0); return logsIn(s, periodEnd('week', s)); };
const mdTxt = s => `${+s.slice(5, 7)}월 ${+s.slice(8)}일`;
function goalMetric(k) {   // 항목별 진행률과 기한 예상
  const g = GOAL, t = g && g.target[k]; if (t == null) return null;
  const base = g.base[k], lb = bodyLatest(k), cur = lb ? lb[k] : null;
  if (cur == null || base == null) return { k, t, base, cur, pct: 0, proj: null };
  const pct = base === t ? (cur === t ? 1 : 0) : Math.max(0, Math.min(1, (cur - base) / (t - base)));
  const since = dayDiff(g.start, lb.date);   // 목표 시작 뒤 지금까지 바뀐 속도로 마감일 값을 추정
  const proj = since > 0 ? cur + (cur - base) / since * dayDiff(lb.date, g.end) : null;
  return { k, t, base, cur, pct, proj, reach: proj != null && (t - base) * (proj - t) >= 0 };
}
function goalCard() {
  if (!GOAL) return `<div class="caption" style="padding:4px 0 12px">기간과 목표 체중·골격근량·체지방률을 정하면 진행률과 기한 안에 닿을 수 있는지 보여드려요.</div>
    <button class="btn btn-secondary" style="width:100%;margin-bottom:12px" onclick="openGoal()">${ic('plus', 'icon-sm')}목표 정하기</button>`;
  const g = GOAL, today = ymd(new Date()), total = Math.max(1, dayDiff(g.start, g.end)), gone = Math.min(total, Math.max(0, dayDiff(g.start, today))), dl = dayDiff(today, g.end);
  const rows = Object.keys(BODY_M).map(goalMetric).filter(Boolean).map(m => { const u = BODY_M[m.k].u, done = m.pct >= 1;
    const sub = m.cur == null ? '측정 기록이 없어요' : done ? '달성했어요 🎉' : `${fmt(+Math.abs(m.t - m.cur).toFixed(1))}${u} 남음`;
    const fc = done || m.proj == null || dl < 0 ? '' : m.reach ? ' · <span class="gl-ok">기한 안에 도달 예상</span>' : ` · 이 속도면 ${fmt(+m.proj.toFixed(1))}${u}`;
    return `<div class="gl-row"><div class="gl-top"><span class="n">${BODY_M[m.k].l}</span>
        <span class="caption num">${m.base != null ? fmt(m.base) : '—'} → <b>${fmt(m.t)}${u}</b> · 지금 ${m.cur != null ? fmt(m.cur) : '—'}</span></div>
      <div class="pb-t ${done ? 'done' : ''}"><i style="width:${Math.max(m.pct ? 3 : 0, m.pct * 100)}%"></i></div>
      <div class="gl-sub caption"><span>${sub}${fc}</span><span class="num">${Math.round(m.pct * 100)}%</span></div></div>`; }).join('');
  return `<div class="gl-period"><div><b>${mdTxt(g.start)} ~ ${mdTxt(g.end)}</b><span class="caption"> · ${dl > 0 ? 'D-' + dl : dl === 0 ? 'D-day' : '기간 종료'}</span></div>
      <div class="gl-time"><i style="width:${gone / total * 100}%"></i></div><div class="caption">기간 ${Math.round(gone / total * 100)}% 지남 (${total}일 중 ${gone}일)</div></div>${rows}`;
}
function bodyDelta(k) {   // 직전 측정 대비. 골격근량은 늘면, 체지방률은 줄면 초록

// 인바디 결과 등록 시트: 결과지 사진을 올리면 숫자를 읽어 칸을 채우고, 사용자가 확인·수정한 뒤 저장
// 시안에서는 사진을 실제로 읽지 않고 "읽었다고 가정한 값"을 채운다. 앱에서는 기기 안 글자 인식(OCR)으로 읽는다
function openBodyAdd() { const b = BODY[BODY.length - 1] || {}; S.bodyAdd = { date: ymd(new Date()), weight:'', smm:'', fat:'', ph: b, img: null, ocr: null }; render(); }
function ocrPick(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {   // 미리보기용으로 작게 줄인다
    const c = document.createElement('canvas'), s = Math.min(1, 480 / img.width); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ocrStart(c.toDataURL('image/jpeg', 0.7));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('사진을 열 수 없어요'); };
  img.src = url;
}
function ocrStart(dataUrl) {
  if (!S.bodyAdd) return; S.bodyAdd.img = dataUrl; S.bodyAdd.ocr = 'reading'; render();
  setTimeout(() => {
    const a = S.bodyAdd; if (!a || a.img !== dataUrl) return;
    const r = ocrMock(); a.date = r.date; a.weight = String(r.weight); a.smm = String(r.smm); a.fat = String(r.fat); a.ocr = 'done'; render();
  }, 1400);
}
function ocrMock() {   // 시안용: 결과지에서 읽었다고 가정한 값 (최근 측정값에서 조금 바뀐 값)
  const b = BODY[BODY.length - 1] || {};
  return { date: ymd(new Date()), weight: +((b.weight ?? 75) - 0.4).toFixed(1), smm: +((b.smm ?? 32) + 0.2).toFixed(1), fat: +((b.fat ?? 20) - 0.4).toFixed(1) };
}
const bodyNum = (v, lo, hi) => { const n = parseFloat(v); return v === '' || v == null ? null : (isFinite(n) && n >= lo && n <= hi ? +n.toFixed(1) : NaN); };

}

  const date = S.bodyAdd.date; BODY = BODY.filter(b => b.date !== date).concat({ date, ...v }).sort((a, b) => a.date < b.date ? -1 : 1);

// 목표 설정 시트: 기간(시작·끝) + 체중·골격근량·체지방률 목표값을 직접 입력 (셋 중 하나 이상)
const GOAL_LEN = [['4주', 28], ['8주', 56], ['12주', 84], ['6개월', 182]];
function openGoal() {
  const g = GOAL, today = ymd(new Date()), s = v => v == null ? '' : String(v);
  S.goalEdit = g ? { start: g.start, end: g.end, weight: s(g.target.weight), smm: s(g.target.smm), fat: s(g.target.fat) }

function goalValid() {

/* AI 코치 (시안에서는 미리 정한 규칙으로 답을 흉내 낸다. 앱에서는 서버 함수가 내 기록 요약을 붙여 AI에게 묻는다) */
function openAi(q) { if (!S.ai) S.ai = { msgs: [], q: '', busy: false }; render(); if (q) aiAsk(q); }
function aiAsk(text) {
  const q = (text ?? S.ai.q).trim(); if (!q || S.ai.busy) return;
  S.ai.msgs.push({ me: true, t: q }); S.ai.q = ''; S.ai.busy = true; render();
  setTimeout(() => { if (!S.ai) return; S.ai.msgs.push({ me: false, t: aiReply(q) }); S.ai.busy = false; render(); }, 700);
}
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + fmt(+Math.abs(v).toFixed(1));
function partSets(days) {   // 최근 n일 부위별 세트
  const s = new Date(); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - days + 1); const e = new Date(s); e.setDate(e.getDate() + days + 1);
  const out = { 가슴: 0, 등: 0, 어깨: 0, 하체: 0, 팔: 0 };
  logsIn(s, e).forEach(w => w.exercises.forEach(x => { const p = exById(x.exId).part; if (p in out) out[p] += x.sets.filter(z => z.type !== 'W').length; }));
  return out;
}
function aiReply(q) {
  if (!/목표|기한|달성/.test(q) && /인바디|체성분|체중|몸무게|체지방|근육량|골격근|살/.test(q)) {
    const list = BODY.filter(b => b.weight != null); if (list.length < 2) return '체성분 기록이 2번 이상 있어야 변화를 볼 수 있어요. 마이페이지의 [측정 기록 추가]로 적어 주세요.';
    const a = list[0], b = list[list.length - 1], days = Math.round((new Date(b.date) - new Date(a.date)) / 864e5);
    const span = k => { const l = BODY.filter(x => x[k] != null); return l.length > 1 ? [l[0][k], l[l.length - 1][k]] : null; };   // 항목마다 처음·마지막 측정값
    const m = span('smm'), f = span('fat'), dw = b.weight - a.weight, dm = m && m[1] - m[0], df = f && f[1] - f[0];
    let t = `최근 ${days}일 동안\n· 체중 ${fmt(a.weight)} → ${fmt(b.weight)}kg (${sgn(dw)}kg)`;
    if (m) t += `\n· 골격근량 ${fmt(m[0])} → ${fmt(m[1])}kg (${sgn(dm)}kg)`;
    if (f) t += `\n· 체지방률 ${fmt(f[0])} → ${fmt(f[1])}% (${sgn(df)}%p)`;
    if (dm > 0 && df < 0) t += '\n\n근육은 늘고 체지방은 줄어서 아주 좋은 흐름이에요. 지금처럼 주 3회 근력 운동을 유지하고, 단백질은 체중 1kg당 1.6g 정도를 꾸준히 챙겨 보세요.';
    else if (df > 0) t += '\n\n체지방률이 조금 올랐어요. 식사량을 크게 줄이기보다 하루 걷기나 유산소 20분을 더해 보는 걸 추천해요.';
    else if (Math.abs(dw) >= 1) t += `\n\n체중이 ${fmt(+Math.abs(dw).toFixed(1))}kg ${dw < 0 ? '줄었어요' : '늘었어요'}. 골격근량·체지방률도 함께 재면 근육과 지방 중 무엇이 바뀌었는지 알려드릴게요.`;
    else t += '\n\n큰 변화 없이 유지 중이에요. 같은 조건(아침 공복)에서 2~4주마다 재면 변화를 더 정확하게 볼 수 있어요.';
    return t;
  }
  if (/목표|얼마나|달성|기한/.test(q)) {
    if (!GOAL) return '아직 정한 목표가 없어요. 마이페이지의 [목표 정하기]에서 기간과 체중·골격근량·체지방률 목표를 정해 보세요.';
    const dl = dayDiff(ymd(new Date()), GOAL.end), ms = Object.keys(BODY_M).map(goalMetric).filter(Boolean);
    const lines = ms.map(m => { const l = BODY_M[m.k].l, u = BODY_M[m.k].u;
      if (m.cur == null) return `· ${l}: 측정 기록이 없어요`;
      return `· ${l} ${fmt(m.cur)} → ${fmt(m.t)}${u} (${Math.round(m.pct * 100)}%)` + (m.pct >= 1 ? ' 달성!' : m.proj == null || dl < 0 ? '' : m.reach ? ', 기한 안에 도달 예상' : `, 이 속도면 기한에 ${fmt(+m.proj.toFixed(1))}${u}`); });
    const behind = ms.filter(m => m.pct < 1 && m.proj != null && !m.reach && dl >= 0);
    let tail = '\n\n지금 속도를 유지하면 돼요. 👍';
    if (dl < 0) tail = '\n\n목표 기간이 끝났어요. [수정]에서 새 기간을 정해 보세요.';
    else if (behind.length) tail = `\n\n${behind.map(m => BODY_M[m.k].l).join('·')}은(는) 지금 속도로는 기한까지 조금 부족해요.`

  }

    const ws = periodStart('week', 0), ps = periodStart('week', 1), c = totalsOf(logsIn(ws, periodEnd('week', ws))), p = totalsOf(logsIn(ps, periodEnd('week', ps)));

const padCtx = () => { const p = S.pad, wx = S.workout.exercises[p.ei], e = exById(wx.exId);
  return { p, wx, e, st: wx.sets[p.si], f: RT[e.rt].fields[p.fi], fields: RT[e.rt].fields }; };
function openPad(ei, si, fi) {
  if (S.workout.exercises[ei].sets[si].done) return;
  S.pad = { ei, si, fi, fresh:true }; render();
  requestAnimationFrame(() => { const el = document.querySelector('.cell.editing'); el && el.scrollIntoView({ block:'center', inline:'nearest', behavior:'smooth' }); });
}
function padKey(k) {
  const { p, st, f } = padCtx();
  let s = p.fresh ? '' : (st[f.k] == null ? '' : fmt(st[f.k]));
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '.') { if (!f.dec || s.includes('.')) return; s = (s || '0') + '.'; }
  else { if (s.replace('.', '').length >= 5) return; s += k; }
  p.fresh = false;
  st[f.k] = s === '' ? null : parseFloat(s);
  st.edited = true;
  const cell = document.querySelector('.cell.editing'); if (cell) { cell.textContent = s || '—'; cell.classList.toggle('empty', !s); cell.classList.add('edited'); }
  const v = document.querySelector('.pad-display .v'); if (v) v.textContent = s || '—';
}
function padStep(sign) {
  const { p, st, f } = padCtx();
  st[f.k] = Math.max(0, +(((st[f.k] || 0) + sign * f.step).toFixed(2))); st.edited = true; p.fresh = false; render();
}
function padNext() {
  const { p, wx, fields } = padCtx();
  if (p.fi < fields.length - 1) { p.fi++; p.fresh = true; }
  else {
    let n = p.si + 1; while (n < wx.sets.length && wx.sets[n].done) n++;
    if (n < wx.sets.length) { p.si = n; p.fi = 0; p.fresh = true; } else S.pad = null;
  }
  render();
}

function render() {
  const ph = document.getElementById('phone');
  // 다시 그려도 보던 위치를 유지한다 (종목별 페이지의 세로 위치 / 전체 목록의 세로 위치)
  const oldPager = document.getElementById('pager'), oldList = document.getElementById('wscroll');
  const reTop = (document.getElementById('rescroll') || {}).scrollTop || 0;   // 루틴 편집 화면
  const saved = oldPager ? { mode:'page', top: (oldPager.children[S.page] || {}).scrollTop || 0 }
              : oldList ? { mode:'list', top: oldList.scrollTop } : {};
  let html = `<div class="statusbar"><span class="num" id="clock">${clock()}</span><span>●●● ▮</span></div>`;
  if (AUTH.need) { ph.innerHTML = html + loginView(); return; }
  if (S.screen === 'home') html += homeView();
  else if (S.screen === 'workout') html += workoutView();
  else if (S.screen === 'summary') html += summaryView();
  else if (S.screen === 'routineEdit') html += routineEditView();
  if (S.saveRt) html += saveRtView();
  if (S.picker) html += pickerView();
  if (S.creator) html += creatorView();
  if (S.logView) html += logDetailView();
  if (S.logReg) html += logRegView();
  if (S.stEx) html += statExView();
  if (S.bodyAdd) html += bodyAddView();
  if (S.goalEdit) html += goalEditView();
  if (S.ai) html += aiView();
  if (S.detail) html += detailView();
  if (S.lock) html += lockView();
  ph.innerHTML = html;
  const pg = document.getElementById('pager');
  if (pg) {
    pg.scrollLeft = S.page * pg.clientWidth;
    if (saved.mode === 'page' && pg.children[S.page]) pg.children[S.page].scrollTop = saved.top;
    pg.addEventListener('scroll', onPagerScroll, { passive:true });
  }
  const ws = document.getElementById('wscroll'); if (ws && saved.mode === 'list') ws.scrollTop = saved.top;
  const rs = document.getElementById('rescroll'); if (rs && reTop) rs.scrollTop = reTop;
  const cal = document.getElementById('cal'); if (cal) bindCalSwipe(cal);
  S.hist.dir = 0;   // 달 이동 애니메이션은 한 번만
  const as = document.getElementById('aiscroll');
  if (as) { as.scrollTop = as.scrollHeight; if (!S.ai.busy && document.activeElement === document.body) document.getElementById('aiq').focus({ preventScroll:true }); }
  drawMotions(performance.now());
  tick();
  saveWip();
}

function muscleMapFor(list) {
  const t = { p: new Set(), s: new Set() };
  list.forEach(e => { const x = targetsOf(e); x.p.forEach(m => t.p.add(m)); x.s.forEach(m => t.s.add(m)); });
  t.p.forEach(m => t.s.delete(m));
  return muscleMap(null, t);
}
function muscleMap(e, given) {
  const t = given || targetsOf(e);

/* 데스크톱 마우스 드래그로도 좌우 넘기기 (터치·트랙패드는 기본 스크롤 스냅) */
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const pg = e.target.closest && e.target.closest('#pager');
  if (!pg || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { pg, x: e.clientX, left: pg.scrollLeft, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 8) { drag.moved = true; drag.pg.classList.add('dragging'); }
  if (drag.moved) drag.pg.scrollLeft = drag.left - dx;
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  d.pg.classList.remove('dragging');
  const dx = e.clientX - d.x, base = Math.round(d.left / d.pg.clientWidth);
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  goToPage(dx < -50 ? base + 1 : dx > 50 ? base - 1 : base);
});
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* ================= 저장 (링크의 저장 공간, 소유자만 읽고 씀) =================
   claude.ai 링크로 열면 기록을 저장 공간에 두고, 아이폰·PC 어디서 열어도 이어진다.
   문서: onemore/state (루틴·체성분·목표·내 운동·내 설정) + workouts/<id> (운동 1회당 1개).
   로컬 파일로 열면 저장 공간이 없으므로 예전처럼 화면 안에서만 바뀐다 */
const STORE_ONLY = IMPORT_LOG.length === 0;   // 공개용 사본: 기록을 페이지에 싣지 않고 저장 공간에서만 불러온다
const SYNC = { db: null, mode: null, state: 'local', loaded: false, timer: null, busy: false, again: false,
  remote: { st: null, w: {} }, saved: { st: null, w: {} } };
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, key) => { if (x[key] !== undefined) o[key] = x[key]; return o; }, {}) : x);
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
function stateDoc() {
  return { routines: ROUTINES, body: BODY, goal: GOAL, myHowto: MY_HOWTO, myRest: MY_REST,
    customEx: EXERCISES.filter(e => e.mine).map(({ id, name, part, eq, rt, how, bp, sec, mv }) => ({ id, name, part, eq, rt, how: how || '', bp: bp || null, sec: sec || [], mv: mv || null })) };
}
const workoutDoc = w => ({ date: w.date, title: w.title, routineId: w.routineId || null, min: w.min, exercises: w.exercises });
function applyRemote() {
  const st = SYNC.remote.st || {};
  EXERCISES = BASE_EXERCISES.map(e => ({ ...e })).concat((st.customEx || []).map(e => ({ alias: [], ...clone(e), mine: true })));
  ROUTINES = clone(st.routines || []); BODY = clone(st.body || []); GOAL = clone(st.goal || null);
  MY_HOWTO = clone(st.myHowto || {}); MY_REST = clone(st.myRest || {});
  LOG = Object.entries(SYNC.remote.w).map(([id, d]) => ({ id, ...clone(d) })).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1);
  LOG.forEach(w => w.exercises.forEach(x => { if (!EXERCISES.some(e => e.id === x.exId))   // 정의가 없는 종목은 자리표시로
    EXERCISES.push({ id: x.exId, name: '알 수 없는 운동', part: '전신', eq: '기타', rt: 'weight_reps', alias: [], how: '', mine: true }); }));
  rebuildHistory();
  if (S.logView && !LOG.some(w => w.id === S.logView)) S.logView = null;
}
function setSync(s) { if (SYNC.state === s) return; SYNC.state = s; render(); }
async function startSync() {
  if (SUPA_CFG) return startSupa();
  const db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
  if (!db) { setSync(STORE_ONLY ? 'offline' : 'local'); return; }
  SYNC.db = db; SYNC.mode = 'claude'; setSync('loading');
  const slow = setTimeout(() => { if (!SYNC.loaded) setSync('slow'); }, 10000);
  let gotSt = false, gotW = false;
  const ready = fresh => {
    if (!gotSt || !gotW) return;
    if (fresh) clearTimeout(slow);
    SYNC.loaded = true; applyRemote();
    if (SYNC.state !== 'error' && SYNC.state !== 'full') SYNC.state = fresh || SYNC.state !== 'slow' ? 'live' : 'slow';
    render();
  };
  const fail = () => { clearTimeout(slow); setSync('error'); };
  db.doc('onemore/state').onSnapshot(s => {
    SYNC.remote.st = s.exists ? s.data() : null; SYNC.saved.st = s.exists ? stable(s.data()) : null; gotSt = true; ready(!s.metadata.fromCache);
  }, fail);
  db.collection('workouts').onSnapshot(q => {
    SYNC.remote.w = {}; SYNC.saved.w = {};
    q.docs.forEach(d => { SYNC.remote.w[d.id] = d.data(); SYNC.saved.w[d.id] = stable(d.data()); });
    gotW = true; ready(!q.metadata.fromCache);
  }, fail);
}
function persistSoon() { if (!SYNC.db || !SYNC.loaded) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(persist, 300); }
async function persist() {   // 바뀐 문서만 쓴다
  SYNC.timer = null;
  if (SYNC.busy) { SYNC.again = true; return; } SYNC.busy = true;
  try {
    const st = stable(stateDoc()), sets = [], dels = [], ids = new Set();
    if (st !== SYNC.saved.st) sets.push(['onemore/state', st, () => { SYNC.saved.st = st; }]);
    for (const w of LOG) {
      ids.add(w.id); const s = stable(workoutDoc(w));
      if (s !== SYNC.saved.w[w.id]) sets.push(['workouts/' + w.id, s, () => { SYNC.saved.w[w.id] = s; }]);
    }
    for (const id of Object.keys(SYNC.saved.w)) if (!ids.has(id)) dels.push(id);
    if (SYNC.db.bulk) {   // 내 서버: 한 번에 묶어서 보낸다
      if (sets.length || dels.length) await SYNC.db.bulk(sets.map(([p, s]) => [p, JSON.parse(s)]), dels.map(id => 'workouts/' + id));
      sets.forEach(x => x[2]()); dels.forEach(id => delete SYNC.saved.w[id]);
    } else {   // 링크 저장 공간: 한 문서에 한 번에 하나씩
      for (const [p, s, done] of sets) { await SYNC.db.doc(p).set(JSON.parse(s)); done(); }
      for (const id of dels) { await SYNC.db.doc('workouts/' + id).delete(); delete SYNC.saved.w[id]; }
    }
    if (SYNC.state !== 'live') setSync('live');
  } catch (e) {
    setSync(e && e.code === 'quota_exceeded' ? 'full' : 'error');
    toast(e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요' : '저장하지 못했어요. 연결을 확인해 주세요');
  } finally { SYNC.busy = false; if (SYNC.again) { SYNC.again = false; persist(); } }
}

/* ================= 내 서버 (Supabase) =================
   웹사이트 버전에서 쓴다. 이메일·비밀번호로 한 번 로그인하면 이 기기에 로그인이 유지된다.
   표 app_docs(user_id, path, data): 링크 저장 공간과 같은 문서 구조 (onemore/state, workouts/<id>), 내 행만 읽고 쓴다(RLS) */
const SUPA_CFG = window.ONEMORE_SUPA || null;
const AUTH = { need: false, mode: 'in', email: '', pw: '', pw2: '', busy: false, err: '', info: '' };
let SB = null;
function supaDb(uid) {
  const chk = r => { if (r.error) throw r.error; return r; };
  const row = (path, data) => ({ user_id: uid, path, data, updated_at: new Date().toISOString() });
  return {
    doc: p => ({ set: async d => chk(await SB.from('app_docs').upsert(row(p, d))), delete: async () => chk(await SB.from('app_docs').delete().eq('path', p)) }),
    bulk: async (sets, dels) => {
      for (let i = 0; i < sets.length; i += 100) chk(await SB.from('app_docs').upsert(sets.slice(i, i + 100).map(([p, d]) => row(p, d))));
      for (let i = 0; i < dels.length; i += 100) chk(await SB.from('app_docs').delete().in('path', dels.slice(i, i + 100)));
    },
  };
}
async function supaLoad() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from('app_docs').select('path,data').order('path').range(from, from + 999);
    if (error) throw error; rows.push(...data); if (data.length < 1000) break;
  }
  const w = {}; let st = null;
  rows.forEach(r => { if (r.path === 'onemore/state') st = r.data; else if (r.path.startsWith('workouts/')) w[r.path.slice(9)] = r.data; });
  return { st, w };
}
async function supaPull() {   // 서버 내용을 받아서, 바뀐 게 있을 때만 다시 그린다
  const r = await supaLoad(), st = r.st ? stable(r.st) : null, ws = {};
  Object.keys(r.w).forEach(id => { ws[id] = stable(r.w[id]); });
  const same = SYNC.loaded && st === SYNC.saved.st && stable(ws) === stable(SYNC.saved.w);
  SYNC.remote = r; SYNC.saved = { st, w: ws }; SYNC.loaded = true;
  if (!same) { applyRemote(); restoreWip(); }
  if (SYNC.state !== 'live') setSync('live'); else if (!same) render();
}
async function startSupa() {
  if (!window.supabase) { setSync('error'); return; }
  SB = window.supabase.createClient(SUPA_CFG.url, SUPA_CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data } = await SB.auth.getSession();
  if (data && data.session) supaOpen(data.session); else { AUTH.need = true; render(); }
}
async function supaOpen(session) {
  AUTH.need = false; AUTH.email = session.user.email || ''; AUTH.err = ''; AUTH.info = '';
  SYNC.db = supaDb(session.user.id); SYNC.mode = 'supa'; setSync('loading');
  const slow = setTimeout(() => { if (!SYNC.loaded) setSync('slow'); }, 10000);
  try { await supaPull(); } catch (e) { setSync('error'); } finally { clearTimeout(slow); }
}
// 앱으로 돌아올 때마다 다른 기기에서 바꾼 내용을 받아 온다 (저장 중이면 건너뜀)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkUpdate();
  if (SYNC.mode === 'supa' && SYNC.loaded && !SYNC.busy && !SYNC.timer) supaPull().catch(() => setSync('error'));
});
// 로그인: 이메일 + 비밀번호 (홈 화면 앱에서도 앱을 벗어나지 않음). 처음 한 번은 [계정 만들기]
const AUTH_ERR = [[/invalid login/i, '이메일 또는 비밀번호가 맞지 않아요'], [/already registered|already exists/i, '이미 가입된 이메일이에요. 로그인해 주세요'],
  [/signups? not allowed|disabled/i, '새 계정 만들기가 막혀 있어요'], [/not confirmed/i, '메일의 확인 링크를 먼저 눌러 주세요'],
  [/password/i, '비밀번호는 6자 이상으로 정해 주세요'], [/rate|seconds/i, '잠시 뒤 다시 시도해 주세요'], [/fetch|network/i, '인터넷 연결을 확인해 주세요']];
const authMsg = e => (AUTH_ERR.find(([re]) => re.test(e.message || '')) || [0, '로그인하지 못했어요: ' + (e.message || '')])[1];
async function doAuth() {
  const a = AUTH, email = a.email.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { a.err = '이메일 주소를 확인해 주세요'; render(); return; }
  if (a.pw.length < 6) { a.err = '비밀번호는 6자 이상이에요'; render(); return; }
  if (a.mode === 'up' && a.pw !== a.pw2) { a.err = '비밀번호 확인이 달라요'; render(); return; }
  a.busy = true; a.err = ''; a.info = ''; render();
  const { data, error } = a.mode === 'up' ? await SB.auth.signUp({ email, password: a.pw }) : await SB.auth.signInWithPassword({ email, password: a.pw });
  a.busy = false;
  if (error) { a.err = authMsg(error); render(); return; }
  if (!data.session) { a.mode = 'in'; a.pw2 = ''; a.info = '메일로 온 확인 링크를 누른 뒤 여기서 로그인해 주세요'; render(); return; }
  a.pw = ''; a.pw2 = ''; supaOpen(data.session);
}
async function signOut() {
  if (!confirm('로그아웃할까요? 기록은 서버에 그대로 남아요.')) return;
  await SB.auth.signOut();
  try { localStorage.removeItem('onemore.wip'); } catch (e) {}
  SYNC.db = null; SYNC.loaded = false; SYNC.mode = null; SYNC.remote = { st: null, w: {} }; SYNC.saved = { st: null, w: {} };
  initState(); AUTH.need = true; AUTH.mode = 'in'; AUTH.pw = ''; render();
}
function loginView() {
  const a = AUTH, up = a.mode === 'up', dis = a.busy ? 'disabled' : '';
  const inp = (id, type, key, ph, ac) => `<input class="input" id="${id}" type="${type}" autocomplete="${ac}" placeholder="${ph}" value="${esc(a[key])}"
    oninput="AUTH.${key}=this.value" onkeydown="if(event.key==='Enter')doAuth()">`;
  return `<div class="screen"><div class="scroll login"><div class="logo">One<b>More</b></div>
    <div class="title1">${up ? '계정 만들기' : '로그인'}</div>
    <p class="caption">${up ? '처음 한 번만 만들면 돼요. 아이폰·PC에서 같은 이메일로 로그인하면 기록이 이어져요.' : '한 번 로그인하면 이 기기에서는 계속 유지돼요.'}</p>
    ${inp('lgemail', 'email', 'email', '이메일 주소', 'email')}
    ${inp('lgpw', 'password', 'pw', '비밀번호 (6자 이상)', up ? 'new-password' : 'current-password')}
    ${up ? inp('lgpw2', 'password', 'pw2', '비밀번호 확인', 'new-password') : ''}
    <button class="btn btn-primary btn-lg" onclick="doAuth()" ${dis}>${a.busy ? '잠시만요…' : up ? '계정 만들기' : '로그인'}</button>
    <button class="btn btn-ghost btn-sm" onclick="AUTH.mode='${up ? 'in' : 'up'}';AUTH.err='';AUTH.info='';render()">${up ? '이미 계정이 있어요 · 로그인' : '처음이에요 · 계정 만들기'}</button>
    ${a.err ? `<div class="sync-note warn">${esc(a.err)}</div>` : a.info ? `<div class="sync-note">${esc(a.info)}</div>` : ''}</div></div>`;
}// 진행 중인 운동은 기기에 임시 저장한다 (앱이 닫혀도 이어서 기록)
function saveWip() {
  if (!SUPA_CFG || !SYNC.loaded) return;
  try { if (S.workout) localStorage.setItem('onemore.wip', JSON.stringify({ w: S.workout, page: S.page, listMode: S.listMode })); else localStorage.removeItem('onemore.wip'); } catch (e) {}
}
function restoreWip() {
  if (S.workout) return;
  try { const j = JSON.parse(localStorage.getItem('onemore.wip') || 'null');
    if (j && j.w && j.w.exercises) { S.workout = j.w; S.page = j.page || 0; S.listMode = !!j.listMode; S.screen = 'workout'; } } catch (e) {}
}
// 백업: 내 기록 전체를 파일 하나로 내보내고 가져온다
function exportBackup() {
  const w = {}; LOG.forEach(x => { w[x.id] = workoutDoc(x); });
  const blob = new Blob([JSON.stringify({ app: 'onemore', version: 1, exportedAt: new Date().toISOString(), state: stateDoc(), workouts: w })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `onemore-backup-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importBackup(input) {
  const file = input.files && input.files[0]; input.value = ''; if (!file) return;
  file.text().then(t => {
    const j = JSON.parse(t);
    if (!j || j.app !== 'onemore' || !j.state || !j.workouts) throw new Error('bad');
    const n = Object.keys(j.workouts).length;
    if (!confirm(`백업 파일의 운동 ${n}회로 지금 기록을 모두 바꿀까요? 지금 기록은 지워져요.`)) return;
    SYNC.remote = { st: j.state, w: j.workouts }; applyRemote(); render(); persistSoon(); toast(`운동 ${n}회를 가져왔어요`);
  }).catch(() => toast('OneMore 백업 파일이 아니에요'));
}
// 새 버전이 올라가 있으면 다시 불러온다 (운동 중에는 하지 않음)
const APP_VER = window.ONEMORE_VER || null;
async function checkUpdate() {
  if (!APP_VER || S.workout) return;
  try {
    const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (!j.v || j.v === APP_VER) return;
    if (sessionStorage.getItem('onemore.tried') === j.v) return;   // 같은 버전으로 두 번 새로고침하지 않음
    sessionStorage.setItem('onemore.tried', j.v);
    location.replace(location.pathname + '?v=' + encodeURIComponent(j.v));
  } catch (e) {}
}
// 기록을 바꾸는 동작이 끝나면 저장한다
['finishWorkout', 'confirmSaveRoutine', 'saveRoutineEdit', 'deleteRoutine', 'confirmLogReg', 'saveBody', 'saveGoal', 'deleteGoal',
 'saveHowto', 'resetHowto', 'setRest', 'saveCreator'].forEach(n => {
  const f = window[n]; if (typeof f !== 'function') return;
  window[n] = function (...a) { const r = f.apply(this, a); persistSoon(); return r; };
});
const SYNC_TXT = {
  loading: ['기록을 불러오는 중이에요', ''],
  slow: ['저장 공간에 아직 연결되지 않았어요. 잠시 뒤 다시 확인해 주세요', 'warn'],
  error: ['저장 공간에 연결할 수 없어요. 지금 바꾼 내용은 저장되지 않을 수 있어요', 'warn'],
  full: ['저장 공간이 가득 찼어요. 새 기록이 저장되지 않아요', 'warn'],
  offline: ['claude.ai 링크에서 열어야 내 기록이 보여요', 'warn'],
};
function syncBanner() { const t = SYNC_TXT[SYNC.state]; return t ? `<div class="sync-note ${t[1]}">${t[0]}</div>` : ''; }
const syncLine = () => SYNC.state === 'live' ? (SYNC.mode === 'supa' ? '내 서버에 저장돼요 · 아이폰·PC 어디서나 이어져요' : '이 링크에 저장돼요 · 나만 볼 수 있어요') : SYNC.state === 'local' ? '이 화면에서만 바뀌어요 (저장 안 됨)' : (SYNC_TXT[SYNC.state] || [''])[0];
render();
startSync();
</script>
